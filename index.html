                                        type="button"
                                        onClick={() => executeAdminAction('delete')}
                                        className="flex-1 py-3 rounded-xl font-bold text-xs bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white border border-red-500/30 tracking-widest"
                                    >
                                        SİL
                                    </button>
                                </div>
                            </div>
                        )}

                        {adminActionTarget?.action === 'toggle_lock' && (
                            <div className="flex flex-col text-center gap-4">
                                <i className={`fa-solid ${adminActionTarget.vault.isLocked ? 'fa-lock-open text-emerald-400' : 'fa-lock text-red-400'} text-4xl mb-1`}></i>
                                <h3 className="text-xl font-bold text-white">
                                    {adminActionTarget.vault.isLocked ? 'Kilidi Aç' : 'Kasayı Dondur'}
                                </h3>
                                <p className="text-sm text-zinc-400">
                                    "<span className="text-white font-bold">{adminActionTarget.vault.name}</span>" {adminActionTarget.vault.isLocked ? 'artık giriş yapabilecek.' : 'sahibi artık giriş yapamayacak.'}
                                </p>
                                <div className="flex gap-3 mt-1">
                                    <button
                                        type="button"
                                        onClick={() => setAdminActionTarget(null)}
                                        className="flex-1 py-3 rounded-xl font-bold text-xs bg-white/5 text-white hover:bg-white/10 tracking-widest border border-white/10"
                                    >
                                        İPTAL
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => executeAdminAction('toggle_lock')}
                                        className={`flex-1 py-3 rounded-xl font-bold text-xs tracking-widest border ${
                                            adminActionTarget.vault.isLocked
                                                ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30 hover:bg-emerald-500 hover:text-black'
                                                : 'bg-red-500/20 text-red-400 border-red-500/30 hover:bg-red-500 hover:text-white'
                                        }`}
                                    >
                                        {adminActionTarget.vault.isLocked ? 'AÇ' : 'DONDUR'}
                                    </button>
                                </div>
                            </div>
                        )}

                        {adminActionTarget?.action === 'rename' && (
                            <form onSubmit={(e) => executeAdminAction('rename', e)} className="flex flex-col text-center gap-4">
                                <i className="fa-solid fa-pen text-4xl text-blue-400 mb-1"></i>
                                <h3 className="text-xl font-bold text-white">İsim Değiştir</h3>
                                <p className="text-xs text-zinc-400">Şifre ve veriler sabit kalır, sadece kasa adı değişir.</p>
                                {adminModalError && (
                                    <div className="p-2.5 rounded-xl bg-red-500/10 border border-red-500/25 text-red-400 text-xs font-semibold">
                                        {adminModalError}
                                    </div>
                                )}
                                <input
                                    autoFocus
                                    type="text"
                                    value={adminInputVal}
                                    onChange={(e) => { setAdminInputVal(e.target.value); setAdminModalError(''); }}
                                    className="w-full glass-surface py-3 px-4 rounded-xl text-center text-white font-bold text-sm outline-none focus:border-white/30"
                                    placeholder="Yeni Kasa Adı"
                                />
                                <div className="flex gap-3 mt-1">
                                    <button
                                        type="button"
                                        onClick={() => { setAdminActionTarget(null); setAdminModalError(''); }}
                                        className="flex-1 py-3 rounded-xl font-bold text-xs bg-white/5 text-white hover:bg-white/10 tracking-widest border border-white/10"
                                    >
                                        İPTAL
                                    </button>
                                    <button
                                        type="submit"
                                        className="flex-1 py-3 rounded-xl font-bold text-xs bg-blue-500/20 text-blue-400 hover:bg-blue-500 hover:text-white tracking-widest border border-blue-500/30"
                                    >
                                        KAYDET
                                    </button>
                                </div>
                            </form>
                        )}

                        {adminActionTarget?.action === 'reset_password' && (
                            <form onSubmit={(e) => executeAdminAction('reset_password', e)} className="flex flex-col text-center gap-4">
                                <i className="fa-solid fa-key text-4xl text-amber-500 mb-1"></i>
                                <h3 className="text-xl font-bold text-white">Zorla Sıfırla</h3>
                                <p className="text-xs text-red-400 font-bold bg-red-500/10 p-2.5 rounded-xl border border-red-500/20 leading-relaxed">
                                    DİKKAT: Şifreyi zorla sıfırlamak bu kasanın içerisindeki tüm verileri kalıcı olarak SİLER!
                                </p>
                                {adminModalError && (
                                    <div className="p-2.5 rounded-xl bg-red-500/10 border border-red-500/25 text-red-400 text-xs font-semibold">
                                        {adminModalError}
                                    </div>
                                )}
                                <input
                                    autoFocus
                                    type="text"
                                    value={adminInputVal}
                                    onChange={(e) => { setAdminInputVal(e.target.value); setAdminModalError(''); }}
                                    className="w-full glass-surface py-3 px-4 rounded-xl text-center text-white font-bold text-base tracking-[0.2em] outline-none focus:border-white/30"
                                    placeholder="Yeni Şifre (En az 4 hane)"
                                />
                                <div className="flex gap-3 mt-1">
                                    <button
                                        type="button"
                                        onClick={() => { setAdminActionTarget(null); setAdminModalError(''); }}
                                        className="flex-1 py-3 rounded-xl font-bold text-xs bg-white/5 text-white hover:bg-white/10 tracking-widest border border-white/10"
                                    >
                                        İPTAL
                                    </button>
                                    <button
                                        type="submit"
                                        className="flex-1 py-3 rounded-xl font-bold text-xs bg-amber-500/20 text-amber-400 hover:bg-amber-500 hover:text-black tracking-widest border border-amber-500/30"
                                    >
                                        SIFIRLA
                                    </button>
                                </div>
                            </form>
                        )}
                    </PortalModal>
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <PortfolioApp />
            </ErrorBoundary>
        );
    </script>
</body>

</html>
