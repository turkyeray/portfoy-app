    <style>

<body class="antialiased min-h-screen relative">

    <div class="ambient-bg">
        <div class="blob-1 animate-blob"></div>
        <div class="blob-2 animate-blob-reverse"></div>
    </div>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        // =========================================================================
        // CONSTANTS & PURE HELPERS
        // =========================================================================
        const DEFAULT_GH_CONFIG = { token: '', username: 'turkyeray', repo: 'portfoy-kasa' };
        const DEFAULT_RATES = { USD: 44.46, EUR: 51.30, GRAM: 6600, ATA: 45400, TRY: 1, STOCK: 1 };
        const DEFAULT_LABELS = { USD: 'Dolar', EUR: 'Euro', TRY: 'TL', GRAM: 'Gram', ATA: 'Ata', STOCK: 'Hisse' };

        const GH_CONFIG_KEY = 'gh_config_v5';
        const VAULT_SESSION_KEY = 'vault_session_v5';
        const SESSION_DURATION_MS = 30 * 60 * 1000; // 30 dakika
        const IDLE_TIMEOUT_MS = 15 * 60 * 1000;     // 15 dakika

        const safeJsonParse = (str, fallback = null) => {
            if (!str) return fallback;
            try {
                return JSON.parse(str);
            } catch {
                return fallback;
            }
        };

        const safeDecodeURIComponent = (str) => {
            if (!str) return '';
            try {
                return decodeURIComponent(str);
            } catch {
                return String(str);
            }
        };

        const utf8ToBase64 = (str) => {
            const bytes = new TextEncoder().encode(str);
            let binary = '';
            const chunkSize = 0x8000;
            for (let i = 0; i < bytes.length; i += chunkSize) {
                binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
            }
            return btoa(binary);
        };

        const base64ToUtf8 = (b64) => {
            const cleaned = String(b64 || '').replace(/\s/g, '');
            const binary = atob(cleaned);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return new TextDecoder().decode(bytes);
        };

        const cleanTokenStr = (token) => String(token || '').replace(/[^\x20-\x7E]/g, '').trim();

        const generateId = (prefix) => `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;

        const safeParseNum = (val) => {
            if (val === '' || val === null || val === undefined) return 0;
            if (typeof val === 'number') return Number.isFinite(val) ? val : 0;
            const normalized = String(val).trim().replace(',', '.');
            const num = parseFloat(normalized);
            return Number.isFinite(num) ? num : 0;
        };

        const formatMoney = (value) => {
            const safeVal = Number.isFinite(value) ? (Math.abs(value) < 0.5 ? 0 : value) : 0;
            return new Intl.NumberFormat('tr-TR', { minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(safeVal) + ' ₺';
        };

        const formatTitleCase = (str) => {
            if (!str) return 'TL';
            return String(str).trim().split(/[\s_-]+/).map((word) => {
                if (!word) return '';
                const upper = word.toUpperCase();
                if (upper === 'TL' || upper === 'USD' || upper === 'EUR' || upper === 'BIST') return upper;
                if (word.length <= 4 && word === upper && /[A-Z]/.test(word)) return word;
                return word.charAt(0).toLocaleUpperCase('tr-TR') + word.slice(1).toLocaleLowerCase('tr-TR');
            }).filter(Boolean).join(' ');
        };

        const getVaultDisplayName = (filename) => {
            if (!filename) return 'Kasa';
            if (filename === 'data.json') return 'Ana Kasa (Legacy)';
            const stripped = filename
                .replace(/^vault_locked_/, '')
                .replace(/^vault_/, '')
                .replace(/\.json$/i, '');
            return safeDecodeURIComponent(stripped) || 'Kasa';
        };

        const validateVaultName = (rawName) => {
            const trimmed = String(rawName || '').trim().replace(/\s+/g, ' ');
            if (!trimmed) return { ok: false, error: 'Kasa adı boş olamaz.' };
            if (trimmed.length > 50) return { ok: false, error: 'Kasa adı en fazla 50 karakter olabilir.' };
            if (/[\/\\?%*:|"<>#]/.test(trimmed)) {
                return { ok: false, error: 'Kasa adında / \\ ? % * : | " < > # karakterleri kullanılamaz.' };
            }
            if (trimmed.toLowerCase() === 'data') {
                return { ok: false, error: 'Bu kasa adı sistem tarafından ayrılmıştır.' };
            }
            return { ok: true, name: trimmed };
        };

        const normalizeBistTicker = (rawName) => {
            if (!rawName) return '';
            const firstWord = String(rawName).trim().split(/\s+/)[0] || '';
            const ascii = firstWord
                .replace(/[çÇ]/g, 'C')
                .replace(/[ğĞ]/g, 'G')
                .replace(/[ıİiI]/g, 'I')
                .replace(/[öÖ]/g, 'O')
                .replace(/[şŞ]/g, 'S')
                .replace(/[üÜ]/g, 'U')
                .toUpperCase()
                .replace(/[^A-Z0-9]/g, '');
            if (ascii.length < 2 || ascii.length > 10) return '';
            return ascii;
        };

        const fetchTurkishStockPricesBatch = async (rawTickers) => {
            const unique = [...new Set(rawTickers.map(normalizeBistTicker).filter(Boolean))];
            if (unique.length === 0) return {};

            try {
                // Content-Type: text/plain avoids CORS OPTIONS preflight on TradingView scanner
                const res = await fetch('https://scanner.tradingview.com/turkey/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({
                        symbols: { tickers: unique.map((s) => `BIST:${s}`) },
                        query: { types: [] },
                        columns: ['close']
                    })
                });
                if (!res.ok) return {};
                const data = await res.json();
                const map = {};
                if (Array.isArray(data?.data)) {
                    data.data.forEach((row) => {
                        const sym = String(row?.s || '').replace(/^BIST:/i, '').toUpperCase();
                        const price = row?.d?.[0];
                        if (sym && typeof price === 'number' && Number.isFinite(price) && price > 0) {
                            map[sym] = parseFloat(price.toFixed(2));
                        }
                    });
                }
                return map;
            } catch (e) {
                console.warn('TradingView fetch failed:', e);
                return {};
            }
        };

        const fetchTurkishStockPrice = async (ticker) => {
            const normalized = normalizeBistTicker(ticker);
            if (!normalized) return null;
            const prices = await fetchTurkishStockPricesBatch([normalized]);
            return prices[normalized] ?? null;
        };

        const getItemUnitRate = (item, rates) => {
            if (!item) return 0;
            if (item.type === 'STOCK') {
                return safeParseNum(item.currentPrice) || safeParseNum(item.costPrice) || 0;
            }
            return safeParseNum(rates[item.type] ?? 1);
        };

        const getItemValue = (item, rates) => {
            return safeParseNum(item?.amount) * getItemUnitRate(item, rates);
        };

        const sanitizePortfolioData = (raw) => {
            if (!Array.isArray(raw)) return [];
            return raw.map((p) => ({
                id: p?.id || generateId('person'),
                person: typeof p?.person === 'string' ? p.person : '',
                isHidden: Boolean(p?.isHidden),
                assets: Array.isArray(p?.assets)
                    ? p.assets.map((a) => ({
                        id: a?.id || generateId('asset'),
                        name: typeof a?.name === 'string' ? a.name : '',
                        type: typeof a?.type === 'string' && a.type ? a.type : 'TRY',
                        amount: a?.amount ?? '',
                        costPrice: a?.costPrice ?? '',
                        currentPrice: a?.currentPrice ?? '',
                        _lastFetchedTicker: a?._lastFetchedTicker || '',
                        isHidden: Boolean(a?.isHidden),
                        subItems: Array.isArray(a?.subItems)
                            ? a.subItems.map((s) => ({
                                id: s?.id || generateId('sub'),
                                name: typeof s?.name === 'string' ? s.name : '',
                                type: typeof s?.type === 'string' && s.type ? s.type : 'TRY',
                                amount: s?.amount ?? '',
                                costPrice: s?.costPrice ?? '',
                                currentPrice: s?.currentPrice ?? '',
                                _lastFetchedTicker: s?._lastFetchedTicker || ''
                            }))
                            : []
                    }))
                    : []
            }));
        };

        const ghContentsUrl = (config, filename = '', cacheBust = false) => {
            const user = encodeURIComponent(String(config.username || '').trim());
            const repo = encodeURIComponent(String(config.repo || '').trim());
            const filePart = filename ? encodeURIComponent(filename) : '';
            const qs = cacheBust ? `?t=${Date.now()}` : '';
            return `https://api.github.com/repos/${user}/${repo}/contents/${filePart}${qs}`;
        };

        const ghReadHeaders = (config) => ({
            'Authorization': `Bearer ${cleanTokenStr(config.token)}`,
            'Accept': 'application/vnd.github.v3+json'
        });

        const ghWriteHeaders = (config) => ({
            'Authorization': `Bearer ${cleanTokenStr(config.token)}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
        });

        // =========================================================================
        // ERROR BOUNDARY
        // =========================================================================
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, message: '' };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, message: error?.message || 'Beklenmeyen bir hata oluştu.' };
            }
            componentDidCatch(error, info) {
                console.error('PortfolioApp ErrorBoundary:', error, info);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex items-center justify-center p-6">
                            <div className="glass-card p-8 rounded-[2rem] max-w-sm w-full text-center flex flex-col items-center gap-4 border border-red-500/30">
                                <div className="w-14 h-14 rounded-2xl bg-red-500/15 border border-red-500/30 flex items-center justify-center">
                                    <i className="fa-solid fa-triangle-exclamation text-2xl text-red-400"></i>
                                </div>
                                <h2 className="text-xl font-bold text-white">Bir Hata Oluştu</h2>
                                <p className="text-xs text-zinc-400 leading-relaxed">{this.state.message}</p>
                                <button
                                    onClick={() => window.location.reload()}
                                    className="w-full py-3 rounded-xl font-bold text-xs tracking-widest uppercase bg-emerald-500/20 text-emerald-400 hover:bg-emerald-500 hover:text-black border border-emerald-500/30 transition-all"
                                >
                                    Sayfayı Yenile
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // =========================================================================
        // REUSABLE UI PRIMITIVES
        // =========================================================================
        let openModalCount = 0;

        const PortalModal = ({ isOpen, onClose, children, maxWidth = 'max-w-sm', disableBackdropClose = false }) => {
            useEffect(() => {
                if (!isOpen) return;
                openModalCount += 1;
                document.body.style.overflow = 'hidden';

                const handleKeyDown = (e) => {
                    if (e.key === 'Escape' && onClose && !disableBackdropClose) {
                        onClose();
                    }
                };
                document.addEventListener('keydown', handleKeyDown);
                return () => {
                    document.removeEventListener('keydown', handleKeyDown);
                    openModalCount = Math.max(0, openModalCount - 1);
                    if (openModalCount === 0) {
                        document.body.style.overflow = '';
                    }
                };
            }, [isOpen, onClose, disableBackdropClose]);

            if (!isOpen) return null;

            return ReactDOM.createPortal(
                <div
                    className="fixed inset-0 z-[99990] bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto"
                    onMouseDown={(e) => {
                        if (e.target === e.currentTarget && onClose && !disableBackdropClose) {
                            onClose();
                        }
                    }}
                >
                    <div
                        className={`glass-card p-5 sm:p-6 rounded-[1.75rem] ${maxWidth} w-full max-h-[90dvh] overflow-y-auto border border-white/10 shadow-2xl animate-fade-in-up relative my-auto`}
                        onMouseDown={(e) => e.stopPropagation()}
                    >
                        {children}
                    </div>
                </div>,
                document.body
            );
        };

        const ToastBanner = ({ toast }) => {
            return ReactDOM.createPortal(
                <div
                    className={`fixed top-5 left-1/2 -translate-x-1/2 z-[100000] transition-all duration-300 ease-out flex items-center gap-3 px-4 py-3 rounded-2xl shadow-2xl border backdrop-blur-xl max-w-[92vw] ${
                        toast.show ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-6 pointer-events-none'
                    } ${
                        toast.type === 'error'
                            ? 'bg-red-950/85 border-red-500/40'
                            : toast.type === 'warning'
                                ? 'bg-amber-950/85 border-amber-500/40'
                                : 'bg-emerald-950/85 border-emerald-500/40'
                    }`}
                >
                    <div
                        className={`w-7 h-7 rounded-full flex items-center justify-center shrink-0 ${
                            toast.type === 'error'
                                ? 'bg-red-500/30 text-red-200'
                                : toast.type === 'warning'
                                    ? 'bg-amber-500/30 text-amber-200'
                                    : 'bg-emerald-500/30 text-emerald-300'
                        }`}
                    >
                        <i className={`fa-solid text-[11px] ${
                            toast.type === 'error'
                                ? 'fa-triangle-exclamation'
                                : toast.type === 'warning'
                                    ? 'fa-circle-exclamation'
                                    : 'fa-check'
                        }`}></i>
                    </div>
                    <p className={`font-bold text-xs tracking-wide ${
                        toast.type === 'error'
                            ? 'text-red-100'
                            : toast.type === 'warning'
                                ? 'text-amber-100'
                                : 'text-emerald-50'
                    }`}>
                        {toast.message}
                    </p>
                </div>,
                document.body
            );
        };

        const PasswordInput = ({
            value,
            onChange,
            placeholder,
            className = '',
            leftIcon = null,
            autoFocus = false,
            required = false,
            minLength
        }) => {
            const [visible, setVisible] = useState(false);
            return (
                <div className="relative w-full">
                    {leftIcon && (
                        <i className={`fa-solid ${leftIcon} absolute left-3.5 top-1/2 -translate-y-1/2 text-xs pointer-events-none`}></i>
                    )}
                    <input
                        required={required}
                        minLength={minLength}
                        autoFocus={autoFocus}
                        type={visible ? 'text' : 'password'}
                        value={value}
                        onChange={onChange}
                        placeholder={placeholder}
                        className={`${className} ${leftIcon ? 'pl-10 pr-10' : 'px-10'}`}
                    />
                    <button
                        type="button"
                        tabIndex={-1}
                        onClick={() => setVisible((v) => !v)}
                        className="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-500 hover:text-zinc-200 transition-colors p-1"
                        title={visible ? 'Gizle' : 'Göster'}
                    >
                        <i className={`fa-solid ${visible ? 'fa-eye-slash' : 'fa-eye'} text-xs`}></i>
                    </button>
                </div>
            );
        };

        const CustomSelect = ({ value, options, onChange, className = '' }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [coords, setCoords] = useState(null);
            const dropdownRef = useRef(null);

            useEffect(() => {
                if (!isOpen) return;

                const updatePosition = () => {
                    if (!dropdownRef.current) return;
                    const rect = dropdownRef.current.getBoundingClientRect();
                    const optionCount = Object.keys(options).length;
                    const estimatedHeight = Math.min(260, optionCount * 40 + 16);
                    const spaceBelow = window.innerHeight - rect.bottom;
                    const spaceAbove = rect.top;
                    const direction = (spaceBelow < estimatedHeight + 16 && spaceAbove > spaceBelow) ? 'up' : 'down';
                    const menuWidth = Math.max(115, rect.width);
                    const rawRight = window.innerWidth - rect.right;
                    const clampedRight = Math.max(8, Math.min(rawRight, window.innerWidth - menuWidth - 8));

                    setCoords({
                        right: clampedRight,
                        top: rect.bottom + 6,
                        bottom: window.innerHeight - rect.top + 6,
                        width: menuWidth,
                        direction
                    });
                };

                updatePosition();

                const handleClickOutside = (event) => {
                    const target = event.target;
                    const insideDropdown = dropdownRef.current && target instanceof Node && dropdownRef.current.contains(target);
                    const insidePortal = target && typeof target.closest === 'function' && Boolean(target.closest('.custom-select-portal'));
                    if (!insideDropdown && !insidePortal) {
                        setIsOpen(false);
                    }
                };

                const handleScroll = (event) => {
                    const target = event.target;
                    const insidePortal = target && typeof target.closest === 'function' && Boolean(target.closest('.custom-select-portal'));
                    if (!insidePortal) {
                        setIsOpen(false);
                    }
                };

                const handleKeyDown = (event) => {
                    if (event.key === 'Escape') setIsOpen(false);
                };

                const handleResize = () => setIsOpen(false);

                document.addEventListener('mousedown', handleClickOutside);
                document.addEventListener('keydown', handleKeyDown);
                window.addEventListener('scroll', handleScroll, true);
                window.addEventListener('resize', handleResize);
                return () => {
                    document.removeEventListener('mousedown', handleClickOutside);
                    document.removeEventListener('keydown', handleKeyDown);
                    window.removeEventListener('scroll', handleScroll, true);

        const DebouncedInput = ({ value, onChange, delay = 350, type = 'text', onBlur, ...props }) => {

            useEffect(() => {
                latestPropRef.current = safeProp;
                if (safeProp !== localValueRef.current) {
                    if (timerRef.current) {
                        clearTimeout(timerRef.current);
                        timerRef.current = null;
                    }
                    localValueRef.current = safeProp;
                    setLocalValue(safeProp);
                }
            }, [safeProp]);

            useEffect(() => {
                return () => {
                    if (timerRef.current) {
                        clearTimeout(timerRef.current);
                        timerRef.current = null;
                        if (localValueRef.current !== latestPropRef.current) {
                            onChangeRef.current(localValueRef.current);

                const next = e.target.value;
                localValueRef.current = next;
                setLocalValue(next);
                if (timerRef.current) clearTimeout(timerRef.current);
                timerRef.current = setTimeout(() => {
                    timerRef.current = null;
                    if (localValueRef.current !== latestPropRef.current) {
                        onChangeRef.current(localValueRef.current);

                }, delay);

                if (timerRef.current) {

                    timerRef.current = null;

                    inputMode={isNumeric ? (props.inputMode ?? 'decimal') : props.inputMode}

            // =========================================================================
            // GITHUB SAVE ENGINE (SERIALIZED, ZERO STALE CLOSURES, 409 SAFE)
            // =========================================================================
            const handleSaveToGithub = useCallback(async (isAutoSave = false) => {
                if (autoSaveTimerRef.current) {
                    clearTimeout(autoSaveTimerRef.current);
                    autoSaveTimerRef.current = null;
                }

                if (saveInFlightRef.current) {
                    pendingSaveRef.current = true;
                    if (!isAutoSave) pendingManualRef.current = true;

                }

                const snap = latestStateRef.current;
                if (!snap.currentVaultFile || !snap.vaultPassword) return;
                if (snap.appState !== 'app' && snap.appState !== 'admin_panel') return;

                saveInFlightRef.current = true;
                pendingSaveRef.current = false;
                pendingManualRef.current = false;
                if (savedBadgeTimerRef.current) {
                    clearTimeout(savedBadgeTimerRef.current);
                    savedBadgeTimerRef.current = null;

                setSaveStatus('saving');

                const targetFile = snap.currentVaultFile;
                const targetPass = snap.vaultPassword;
                const config = snap.githubConfig;

                const doPut = async (shaToUse) => {
                    const jsonString = JSON.stringify({
                        portfolio: snap.portfolio,
                        labels: snap.currencyLabels,
                        rates: snap.rates
                    });
                    const encryptedPayload = CryptoJS.AES.encrypt(jsonString, targetPass).toString();
                    const vaultPackage = {
                        isEncrypted: true,
                        lastUpdate: new Date().toISOString(),
                        payload: encryptedPayload
                    };
                    const contentBase64 = utf8ToBase64(JSON.stringify(vaultPackage, null, 2));

                    return fetch(ghContentsUrl(config, targetFile), {
                        method: 'PUT',
                        headers: ghWriteHeaders(config),
                        body: JSON.stringify({
                            message: isAutoSave ? '🤖 Oto-Kayıt' : `🔒 Kasa güncellendi: ${targetFile}`,
                            content: contentBase64,
                            ...(shaToUse ? { sha: shaToUse } : {})
                        })
                    });
                };

                try {
                    let response = await doPut(fileShaRef.current);

                            const freshRes = await fetch(ghContentsUrl(config, targetFile, true), {

                            if (freshRes.ok) {

                                if (freshData?.sha) {

                                    response = await doPut(freshData.sha);
                                }
                            }

                            setHasUnsavedChanges(true);

                            setSaveStatus('idle');

                    if (!response.ok) {
                        const errJson = await response.json().catch(() => ({}));
                        throw new Error(errJson?.message || 'Kayıt reddedildi.');

                    const data = await response.json();
                    const stillSameVault =
                        latestStateRef.current.currentVaultFile === targetFile &&
                        latestStateRef.current.vaultPassword === targetPass;

                        if (data?.content?.sha) updateFileSha(data.content.sha);

            // =========================================================================

            const fetchAvailableVaults = useCallback(async (configOverride = null, preserveError = false) => {

                    }
                    if (!response.ok) throw new Error('GitHub erişimi reddedildi.');

                    const files = await response.json();
                    const fileList = Array.isArray(files) ? files : [];

                    const vaults = fileList
                        .filter((f) => f?.name && f.name.startsWith('vault_') && !f.name.startsWith('vault_locked_') && f.name.endsWith('.json'))
                        .map((f) => ({
                            name: getVaultDisplayName(f.name),

                        .sort((a, b) => a.name.localeCompare(b.name, 'tr'));

                    setAvailableVaults(vaults);

            const handleAuth = useCallback(async (e, directPassword = null, directFilename = null, configOverride = null, isAutoLogin = false) => {
                if (e) e.preventDefault();

                const fileToFetch = directFilename || currentVaultFile;
                const config = configOverride || latestStateRef.current.githubConfig;

                if (!fileToFetch) {

                if (!pass) {

                        setAppState('setup_github');

                    if (!response.ok) throw new Error('GitHub erişimi reddedildi.');

                    const data = await response.json();

                    if (!vaultData || !vaultData.isEncrypted || !vaultData.payload) {

                    let parsedData;
                    try {

                        throw new Error('Kasa Şifresi Yanlış');

                    const rawPortfolio = Array.isArray(parsedData) ? parsedData : (parsedData?.portfolio || []);
                    const finalPortfolio = sanitizePortfolioData(rawPortfolio);

                    const mergedLabels = { ...DEFAULT_LABELS };
                    if (parsedData && !Array.isArray(parsedData) && parsedData.labels && typeof parsedData.labels === 'object') {
                        Object.assign(mergedLabels, parsedData.labels);
                        if (!mergedLabels.STOCK) mergedLabels.STOCK = 'Hisse';
                    }

                    const mergedRates = { ...DEFAULT_RATES };
                    if (parsedData && !Array.isArray(parsedData) && parsedData.rates && typeof parsedData.rates === 'object') {
                        Object.entries(parsedData.rates).forEach(([k, v]) => {
                            const n = safeParseNum(v);
                            if (n > 0) mergedRates[k] = n;
                        });
                    }

                    const expandedInit = {};
                    finalPortfolio.forEach((p) => { expandedInit[p.id] = true; });

                    // Prevent initial hydration from triggering a redundant auto-save
                    skipNextSaveRef.current = true;
                    updateFileSha(data.sha);
                    setPortfolio(finalPortfolio);
                    setCurrencyLabels(mergedLabels);
                    setRates(mergedRates);
                    setExpandedPersons(expandedInit);
                    setExpandedAssets({});
                    setVaultPassword(pass);
                    setPasswordInput('');
                    setCurrentVaultFile(fileToFetch);
                    setVaultSession(fileToFetch, pass);
                    setAppState('app');
                } catch (err) {
                    const errMsg = String(err?.message || '');
                    const isNetworkErr = errMsg.toLowerCase().includes('failed to fetch');

                    if (!isNetworkErr) {
                        clearVaultSession();
                    }

                    setAuthError(
                        isNetworkErr
                            ? 'Ağa bağlanılamadı. İnternet bağlantınızı kontrol edin.'
                            : (errMsg || 'Erişim Reddedildi.')
                    );
                    setPasswordInput('');
                    setAppState('enter_password');
                }
            }, [passwordInput, currentVaultFile, cancelAutoSave, closeAllModals, updateFileSha, clearVaultSession, showToast, fetchAvailableVaults, setVaultSession]);

            const lockVault = useCallback((toastMsg = null, toastType = 'error') => {
                cancelAutoSave();
                closeAllModals();
                setVaultPassword('');
                setPasswordInput('');
                setPortfolio([]);
                setAdminVaults([]);
                setCurrencyLabels({ ...DEFAULT_LABELS });
                setRates({ ...DEFAULT_RATES });
                setExpandedPersons({});
                setExpandedAssets({});
                updateFileSha(null);
                setHasUnsavedChanges(false);
                setSaveStatus('idle');
                attemptedStocksRef.current.clear();
                ratesFetchedForVaultRef.current = '';
                clearVaultSession();
                if (toastMsg) showToast(toastMsg, toastType);
                fetchAvailableVaults();
            }, [cancelAutoSave, closeAllModals, updateFileSha, clearVaultSession, showToast, fetchAvailableVaults]);

            // =========================================================================
            // STARTUP INIT, IDLE TIMEOUT (15m) & SESSION EXPIRY CHECK (30m)
            // =========================================================================
            useEffect(() => {
                const init = async () => {
                    const parsedConfig = safeJsonParse(localStorage.getItem(GH_CONFIG_KEY), null);
                    if (parsedConfig && parsedConfig.username && parsedConfig.repo && parsedConfig.token) {
                        setGithubConfig(parsedConfig);
                        setFormConfig(parsedConfig);

                        const session = safeJsonParse(localStorage.getItem(VAULT_SESSION_KEY), null);
                        if (session && Date.now() < session.expiry && session.filename && session.password) {
                            await handleAuth(null, session.password, session.filename, parsedConfig, true);
                        } else {
                            clearVaultSession();
                            await fetchAvailableVaults(parsedConfig);
                        }
                    } else {
                        localStorage.removeItem('gh_config_v4');
                        localStorage.removeItem('gh_config_v3');
                        clearVaultSession();
                        setAppState('setup_github');
                    }
                };
                init();
            }, []);

            // 15-minute Idle Auto-Logout & Mobile Wake-up 30-minute Session Enforcement
            useEffect(() => {
                if (appState !== 'app' && appState !== 'admin_panel') return;

                let idleTimer = null;
                const events = ['mousemove', 'mousedown', 'keydown', 'scroll', 'touchstart', 'wheel'];

                const resetTimer = () => {
                    if (idleTimer) clearTimeout(idleTimer);
                    idleTimer = setTimeout(() => {
                        lockVault('Hareketsizlik sebebiyle oturum otomatik kilitlendi.', 'error');
                    }, IDLE_TIMEOUT_MS);
                };

                const handleVisibilityChange = () => {
                    if (document.visibilityState === 'visible') {
                        const session = safeJsonParse(localStorage.getItem(VAULT_SESSION_KEY), null);
                        if (!session || Date.now() >= session.expiry) {
                            lockVault('30 dakikalık oturum süresi doldu. Lütfen tekrar giriş yapın.', 'warning');
                        } else {
                            resetTimer();
                        }
                    }
                };

                resetTimer();
                events.forEach((ev) => window.addEventListener(ev, resetTimer, { passive: true }));
                document.addEventListener('visibilitychange', handleVisibilityChange);

                return () => {
                    if (idleTimer) clearTimeout(idleTimer);
                    events.forEach((ev) => window.removeEventListener(ev, resetTimer));
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                };
            }, [appState, lockVault]);

            // =========================================================================
            // LIVE MARKET RATES & BIST STOCK PRICES (NO STALE OVERWRITES)
            // =========================================================================
            const applyBatchStockPricesToPortfolio = useCallback((priceMap) => {
                if (!priceMap || Object.keys(priceMap).length === 0) return false;
                let anyChanged = false;

                setPortfolio((prev) => {
                    const next = prev.map((person) => {
                        let personChanged = false;
                        const nextAssets = person.assets.map((asset) => {
                            let assetChanged = false;
                            let updatedAsset = asset;

                            if ((!asset.subItems || asset.subItems.length === 0) && asset.type === 'STOCK' && asset.name) {
                                const sym = normalizeBistTicker(asset.name);
                                if (sym && priceMap[sym] !== undefined) {
                                    if (safeParseNum(asset.currentPrice) !== priceMap[sym] || asset._lastFetchedTicker !== sym) {
                                        updatedAsset = { ...updatedAsset, currentPrice: priceMap[sym], _lastFetchedTicker: sym };
                                        assetChanged = true;
                                    }
                                }
                            }

                            if (asset.subItems && asset.subItems.length > 0) {
                                let subChanged = false;
                                const nextSubs = asset.subItems.map((sub) => {
                                    if (sub.type === 'STOCK' && sub.name) {
                                        const sym = normalizeBistTicker(sub.name);
                                        if (sym && priceMap[sym] !== undefined) {
                                            if (safeParseNum(sub.currentPrice) !== priceMap[sym] || sub._lastFetchedTicker !== sym) {
                                                subChanged = true;
                                                return { ...sub, currentPrice: priceMap[sym], _lastFetchedTicker: sym };
                                            }
                                        }
                                    }
                                    return sub;
                                });
                                if (subChanged) {
                                    updatedAsset = { ...updatedAsset, subItems: nextSubs };
                                    assetChanged = true;
                                }
                            }

                            if (assetChanged) {
                                personChanged = true;
                                return updatedAsset;
                            }
                            return asset;
                        });

                        if (personChanged) {
                            anyChanged = true;
                            return { ...person, assets: nextAssets };
                        }
                        return person;
                    });

                    return anyChanged ? next : prev;
                });

                return anyChanged;
            }, []);

            const fetchLiveRates = useCallback(async (isManual = false) => {
                setIsLoadingRates(true);
                try {
                    const endpoints = [
                        'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json',
                        'https://latest.currency-api.pages.dev/v1/currencies/usd.json'
                    ];
                    let data = null;
                    for (const url of endpoints) {
                        try {
                            const res = await fetch(url);
                            if (res.ok) {
                                data = await res.json();
                                if (data?.usd?.try) break;
                            }
                        } catch { }
                    }

                    if (!data?.usd?.try || !Number.isFinite(data.usd.try) || data.usd.try <= 0) {
                        throw new Error('Kur API cevap vermedi');
                    }

                    const usdTry = data.usd.try;
                    const eurPerUsd = data.usd.eur;
                    const xauPerUsd = data.usd.xau;

                    const nextUsd = parseFloat(usdTry.toFixed(2));
                    const nextEur = (Number.isFinite(eurPerUsd) && eurPerUsd > 0)
                        ? parseFloat((usdTry / eurPerUsd).toFixed(2))
                        : null;

                    let nextGram = null;
                    let nextAta = null;
                    if (Number.isFinite(xauPerUsd) && xauPerUsd > 0) {
                        const xauUsd = 1 / xauPerUsd;
                        const spotGramGoldUsd = xauUsd / 31.1034768;
                        const spotGramGoldTry = spotGramGoldUsd * usdTry;
                        const physicalPremium = 1.045;
                        nextGram = parseFloat((spotGramGoldTry * physicalPremium).toFixed(2));
                        nextAta = parseFloat((nextGram * 6.88).toFixed(2));
                    }

                    setRates((prev) => {
                        const updated = {
                            ...prev,
                            USD: nextUsd,
                            EUR: nextEur ?? prev.EUR,
                            GRAM: nextGram ?? prev.GRAM,
                            ATA: nextAta ?? prev.ATA
                        };
                        if (
                            updated.USD === prev.USD &&
                            updated.EUR === prev.EUR &&
                            updated.GRAM === prev.GRAM &&
                            updated.ATA === prev.ATA
                        ) {
                            return prev;
                        }
                        return updated;
                    });

                    // Also refresh all BIST stocks in portfolio in a single batch call
                    const currentPortfolio = latestStateRef.current.portfolio || [];
                    const allStockTickers = [];
                    currentPortfolio.forEach((p) => {
                        (p.assets || []).forEach((a) => {
                            if ((!a.subItems || a.subItems.length === 0) && a.type === 'STOCK' && a.name) {
                                allStockTickers.push(a.name);
                            }
                            (a.subItems || []).forEach((s) => {
                                if (s.type === 'STOCK' && s.name) allStockTickers.push(s.name);
                            });
                        });
                    });
                    if (allStockTickers.length > 0) {
                        const stockPrices = await fetchTurkishStockPricesBatch(allStockTickers);
                        applyBatchStockPricesToPortfolio(stockPrices);
                    }

                    if (isManual) showToast('Piyasa kurları güncellendi', 'success');
                } catch (err) {
                    console.error('Fiyat çekme hatası:', err);
                    showToast('Kurlar güncellenemedi, mevcut değerler korunuyor', 'error');
                } finally {
                    setIsLoadingRates(false);
                }
            }, [applyBatchStockPricesToPortfolio, showToast]);

            // Auto-fetch live rates once per opened vault
            useEffect(() => {
                if (appState !== 'app' || !currentVaultFile) return;
                if (ratesFetchedForVaultRef.current === currentVaultFile) return;

                ratesFetchedForVaultRef.current = currentVaultFile;
                const timer = setTimeout(() => {
                    fetchLiveRates(false);
                }, 400);
                return () => clearTimeout(timer);
            }, [appState, currentVaultFile, fetchLiveRates]);

            // Auto-fetch BIST price ONLY when a new stock ticker is entered (deduplicated, zero stale overwrite)
            useEffect(() => {
                if (appState !== 'app' || !portfolio.length) return;

                const tickersToFetch = [];
                portfolio.forEach((person) => {
                    (person.assets || []).forEach((asset) => {
                        if ((!asset.subItems || asset.subItems.length === 0) && asset.type === 'STOCK' && asset.name) {
                            const sym = normalizeBistTicker(asset.name);
                            const key = `${asset.id}:${sym}`;
                            if (sym && asset._lastFetchedTicker !== sym && !attemptedStocksRef.current.has(key)) {
                                attemptedStocksRef.current.add(key);
                                tickersToFetch.push(sym);
                            }
                        }
                        (asset.subItems || []).forEach((sub) => {
                            if (sub.type === 'STOCK' && sub.name) {
                                const sym = normalizeBistTicker(sub.name);
                                const key = `${sub.id}:${sym}`;
                                if (sym && sub._lastFetchedTicker !== sym && !attemptedStocksRef.current.has(key)) {
                                    attemptedStocksRef.current.add(key);
                                    tickersToFetch.push(sym);
                                }
                            }
                        });
                    });
                });

                if (tickersToFetch.length === 0) return;

                let cancelled = false;
                fetchTurkishStockPricesBatch(tickersToFetch).then((priceMap) => {
                    if (!cancelled && Object.keys(priceMap).length > 0) {
                        applyBatchStockPricesToPortfolio(priceMap);
                    }
                });

                return () => { cancelled = true; };
            }, [portfolio, appState, applyBatchStockPricesToPortfolio]);

            const forceFetchStockPrice = useCallback(async (personId, assetId, subId = null) => {
                const currentPortfolio = latestStateRef.current.portfolio || [];
                const person = currentPortfolio.find((p) => p.id === personId);
                const asset = person?.assets?.find((a) => a.id === assetId);
                const target = subId ? asset?.subItems?.find((s) => s.id === subId) : asset;

                if (!target || target.type !== 'STOCK' || !target.name) {
                    showToast('Önce geçerli bir hisse sembolü (örn: THYAO) girin.', 'warning');
                    return;
                }

                const sym = normalizeBistTicker(target.name);
                if (!sym) {
                    showToast('Geçerli bir BIST sembolü bulunamadı.', 'error');
                    return;
                }

                const fetchKey = subId || assetId;
                setFetchingStocks((prev) => ({ ...prev, [fetchKey]: true }));

                try {
                    const price = await fetchTurkishStockPrice(sym);
                    if (price !== null) {
                        setPortfolio((prev) =>
                            prev.map((p) => {
                                if (p.id !== personId) return p;
                                return {
                                    ...p,
                                    assets: p.assets.map((a) => {
                                        if (a.id !== assetId) return a;
                                        if (subId) {
                                            return {
                                                ...a,
                                                subItems: (a.subItems || []).map((s) =>
                                                    s.id === subId ? { ...s, currentPrice: price, _lastFetchedTicker: sym } : s
                                                )
                                            };
                                        }
                                        return { ...a, currentPrice: price, _lastFetchedTicker: sym };
                                    })
                                };
                            })
                        );
                        showToast(`${sym} güncel fiyatı: ${price} ₺`, 'success');
                    } else {
                        showToast(`${sym} için fiyat çekilemedi. Sembolü kontrol edin.`, 'error');
                    }
                } finally {
                    setFetchingStocks((prev) => {
                        const next = { ...prev };
                        delete next[fetchKey];
                        return next;
                    });
                }
            }, [showToast]);

            // =========================================================================
            // ADMIN PANEL ACTIONS (LEGACY MAIN VAULT ONLY)
            // =========================================================================
            const fetchAdminVaults = useCallback(async () => {
                if (latestStateRef.current.currentVaultFile !== 'data.json') return;
                const config = latestStateRef.current.githubConfig;
                setAppState('admin_loading');
                try {
                    const response = await fetch(ghContentsUrl(config, '', true), {
                        headers: ghReadHeaders(config),
                        cache: 'no-store'
                    });
                    if (!response.ok) throw new Error('Depo içeriği okunamadı.');

                    const files = await response.json();
                    const fileList = Array.isArray(files) ? files : [];
                    const targetFiles = fileList.filter(
                        (f) => f?.name && (f.name.startsWith('vault_') || f.name === 'data.json') && f.name.endsWith('.json')
                    );

                    const detailedVaults = await Promise.all(targetFiles.map(async (f) => {
                        const isLocked = f.name.startsWith('vault_locked_');
                        const detail = {
                            name: getVaultDisplayName(f.name),
                            filename: f.name,
                            isLocked,
                            lastUpdate: 'Bilinmiyor',
                            sha: f.sha
                        };

                        try {
                            const fRes = await fetch(ghContentsUrl(config, f.name, true), {
                                headers: ghReadHeaders(config),
                                cache: 'no-store'
                            });
                            if (fRes.ok) {
                                const fData = await fRes.json();
                                detail.sha = fData.sha;
                                const decoded = safeJsonParse(base64ToUtf8(fData.content), null);
                                if (decoded?.lastUpdate) {
                                    const d = new Date(decoded.lastUpdate);
                                    if (!isNaN(d.getTime())) {
                                        detail.lastUpdate = d.toLocaleString('tr-TR', {
                                            day: '2-digit',
                                            month: '2-digit',
                                            year: 'numeric',
                                            hour: '2-digit',
                                            minute: '2-digit'
                                        });
                                    }
                                }
                            }
                        } catch { }

                        return detail;
                    }));

                    detailedVaults.sort((a, b) => {
                        if (a.filename === 'data.json') return -1;
                        if (b.filename === 'data.json') return 1;
                        if (a.isLocked !== b.isLocked) return a.isLocked ? 1 : -1;
                        return a.name.localeCompare(b.name, 'tr');
                    });

                    setAdminVaults(detailedVaults);
                    setAppState('admin_panel');
                } catch (e) {
                    showToast('Yönetim paneline ulaşılamadı: ' + (e?.message || ''), 'error');
                    setAppState('app');
                }
            }, [showToast]);

            const executeAdminAction = async (type, e = null) => {
                if (e) e.preventDefault();
                const target = adminActionTarget;
                if (!target?.vault || target.vault.filename === 'data.json') return;

                // Validate inputs BEFORE closing modal or switching to loading screen
                let validatedRename = null;
                if (type === 'rename') {
                    const check = validateVaultName(adminInputVal);
                    if (!check.ok) {
                        setAdminModalError(check.error);
                        return;
                    }
                    const candidateFile = target.vault.isLocked
                        ? `vault_locked_${check.name}.json`
                        : `vault_${check.name}.json`;
                    if (candidateFile === target.vault.filename) {
                        setAdminModalError('Yeni isim mevcut isimle aynı.');
                        return;
                    }
                    const collision = adminVaults.some(
                        (v) =>
                            v.filename !== target.vault.filename &&
                            v.name.toLocaleLowerCase('tr-TR') === check.name.toLocaleLowerCase('tr-TR')
                    );
                    if (collision) {
                        setAdminModalError('Bu isimde başka bir kasa zaten mevcut.');
                        return;
                    }
                    validatedRename = { name: check.name, filename: candidateFile };
                } else if (type === 'reset_password') {
                    if (adminInputVal.length < 4) {
                        setAdminModalError('Yeni şifre en az 4 karakter olmalıdır.');
                        return;
                    }
                }

                setAdminModalError('');
                setAdminActionTarget(null);
                setAppState('admin_loading');

                const config = latestStateRef.current.githubConfig;

                const getFileRaw = async (filename) => {
                    const res = await fetch(ghContentsUrl(config, filename, true), {
                        headers: ghReadHeaders(config),
                        cache: 'no-store'
                    });
                    if (!res.ok) throw new Error('Dosya GitHub üzerinden okunamadı.');
                    return res.json();
                };

                const putFile = async (filename, contentBase64, message, existingSha = null) => {
                    const bodyData = { message, content: String(contentBase64).replace(/\s/g, '') };
                    if (existingSha) bodyData.sha = existingSha;
                    const res = await fetch(ghContentsUrl(config, filename), {
                        method: 'PUT',
                        headers: ghWriteHeaders(config),
                        body: JSON.stringify(bodyData)
                    });
                    if (!res.ok) {
                        const errJson = await res.json().catch(() => ({}));
                        throw new Error(errJson?.message || 'GitHub yazma hatası.');
                    }
                };

                const deleteFile = async (filename, sha, message) => {
                    const res = await fetch(ghContentsUrl(config, filename), {
                        method: 'DELETE',
                        headers: ghWriteHeaders(config),
                        body: JSON.stringify({ message, sha })
                    });
                    if (!res.ok) {
                        const errJson = await res.json().catch(() => ({}));
                        throw new Error(errJson?.message || 'Dosya silinemedi.');
                    }
                };

                try {
                    if (type === 'delete') {
                        const fresh = await getFileRaw(target.vault.filename);
                        await deleteFile(target.vault.filename, fresh.sha, `🗑️ Admin: Kasa silindi (${target.vault.name})`);
                        showToast('Kasa kalıcı olarak silindi', 'success');
                    } else if (type === 'toggle_lock') {
                        const newFilename = target.vault.isLocked
                            ? target.vault.filename.replace(/^vault_locked_/, 'vault_')
                            : target.vault.filename.replace(/^vault_/, 'vault_locked_');

                        const fData = await getFileRaw(target.vault.filename);
                        await putFile(newFilename, fData.content, '🔐 Admin: Kilit durumu değiştirildi');
                        await deleteFile(target.vault.filename, fData.sha, '🧹 Admin: Eski dosya kaldırıldı');
                        showToast(`Kasa ${target.vault.isLocked ? 'aktif edildi' : 'donduruldu'}`, 'success');
                    } else if (type === 'rename' && validatedRename) {
                        const fData = await getFileRaw(target.vault.filename);
                        await putFile(validatedRename.filename, fData.content, `✏️ Admin: Kasa adı değiştirildi (${validatedRename.name})`);
                        await deleteFile(target.vault.filename, fData.sha, '🧹 Admin: Eski dosya kaldırıldı');
                        showToast('Kasa adı güncellendi', 'success');
                    } else if (type === 'reset_password') {
                        const fresh = await getFileRaw(target.vault.filename);
                        const emptyData = { portfolio: [], labels: { ...DEFAULT_LABELS }, rates: { ...DEFAULT_RATES } };
                        const encrypted = CryptoJS.AES.encrypt(JSON.stringify(emptyData), adminInputVal).toString();
                        const payload = { isEncrypted: true, lastUpdate: new Date().toISOString(), payload: encrypted };
                        const contentBase64 = utf8ToBase64(JSON.stringify(payload, null, 2));

                        await putFile(target.vault.filename, contentBase64, '🔑 Admin: Kasa şifresi sıfırlandı', fresh.sha);
                        showToast('Şifre değiştirildi ve kasa içeriği sıfırlandı.', 'success');
                    }

                    setAdminInputVal('');
                    await fetchAdminVaults();
                } catch (err) {
                    showToast('İşlem başarısız: ' + (err?.message || 'Bilinmeyen hata'), 'error');
                    setAppState('admin_panel');
                }
            };

            // =========================================================================
            // SETTINGS: PASSWORD CHANGE & BACKUP EXPORT
            // =========================================================================
            const handleExportData = () => {
                try {
                    const snap = latestStateRef.current;
                    const exportData = {
                        schema: 'v1.0',
                        timestamp: new Date().toISOString(),
                        vaultName: getVaultDisplayName(snap.currentVaultFile),
                        vaultFile: snap.currentVaultFile,
                        portfolio: snap.portfolio,
                        rates: snap.rates,
                        currencyLabels: snap.currencyLabels
                    };
                    const jsonStr = JSON.stringify(exportData, null, 2);
                    const blob = new Blob([jsonStr], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);

                    const safeSlug = getVaultDisplayName(snap.currentVaultFile)
                        .toLowerCase()
                        .replace(/[^a-z0-9çğıöşü]+/gi, '_')
                        .replace(/^_|_$/g, '') || 'kasa';

                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `portfoy_${safeSlug}_${new Date().toISOString().split('T')[0]}.json`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 1500);

                    showToast('Yedek dosyası indiriliyor.', 'success');
                } catch {
                    showToast('Yedekleme başarısız oldu.', 'error');
                }
            };

            const handleChangePassword = async (e) => {
                e.preventDefault();
                const snap = latestStateRef.current;

                if (settingsOldPass !== snap.vaultPassword) {
                    setSettingsError('Mevcut şifreniz yanlış.');
                    return;
                }
                if (settingsNewPass.length < 4) {
                    setSettingsError('Yeni şifre en az 4 karakter olmalıdır.');
                    return;
                }
                if (settingsNewPass === settingsOldPass) {
                    setSettingsError('Yeni şifre mevcut şifreyle aynı olamaz.');
                    return;
                }
                if (settingsNewPass !== settingsNewPassConfirm) {
                    setSettingsError('Yeni şifreler birbiriyle uyuşmuyor.');
                    return;
                }
                if (!snap.currentVaultFile) {
                    setSettingsError('Aktif kasa bulunamadı.');
                    return;
                }

                cancelAutoSave();
                setSettingsError('');
                setIsChangingPassword(true);

                try {
                    const config = snap.githubConfig;
                    const jsonString = JSON.stringify({
                        portfolio: snap.portfolio,
                        labels: snap.currencyLabels,
                        rates: snap.rates
                    });
                    const encryptedPayload = CryptoJS.AES.encrypt(jsonString, settingsNewPass).toString();
                    const vaultPackage = {
                        isEncrypted: true,
                        lastUpdate: new Date().toISOString(),
                        payload: encryptedPayload
                    };
                    const contentBase64 = utf8ToBase64(JSON.stringify(vaultPackage, null, 2));

                    const putPass = (sha) =>
                        fetch(ghContentsUrl(config, snap.currentVaultFile), {
                            method: 'PUT',
                            headers: ghWriteHeaders(config),
                            body: JSON.stringify({
                                message: `🔑 Şifre Değiştirildi: ${snap.currentVaultFile}`,
                                content: contentBase64,
                                ...(sha ? { sha } : {})
                            })
                        });

                    let response = await putPass(fileShaRef.current);

                    // Retry once with fresh SHA if 409 conflict occurred
                    if (response.status === 409) {
                        const freshRes = await fetch(ghContentsUrl(config, snap.currentVaultFile, true), {
                            headers: ghReadHeaders(config),
                            cache: 'no-store'
                        });
                        if (freshRes.ok) {
                            const freshData = await freshRes.json();
                            if (freshData?.sha) {
                                updateFileSha(freshData.sha);
                                response = await putPass(freshData.sha);
                            }
                        }
                    }

                    if (!response.ok) {
                        const errJson = await response.json().catch(() => ({}));
                        throw new Error(errJson?.message || 'Şifre güncellenemedi.');
                    }

                    const data = await response.json();
                    if (data?.content?.sha) updateFileSha(data.content.sha);

                    setVaultPassword(settingsNewPass);
                    setVaultSession(snap.currentVaultFile, settingsNewPass);
                    setHasUnsavedChanges(false);

                    setShowSettingsModal(false);
                    setSettingsOldPass('');
                    setSettingsNewPass('');
                    setSettingsNewPassConfirm('');
                    setSettingsError('');

                    showToast('Şifreniz başarıyla değiştirildi!', 'success');

                    if (snap.appState === 'admin_panel') {
                        fetchAdminVaults();
                    }
                } catch (err) {
                    setSettingsError('Hata: ' + (err?.message || 'Bağlantı hatası'));
                } finally {
                    setIsChangingPassword(false);
                }
            };

            // =========================================================================
            // NEW VAULT & GITHUB CONFIG
            // =========================================================================
            const setupNewVault = async (e) => {
                if (e) e.preventDefault();
                const nameCheck = validateVaultName(newVaultName);
                if (!nameCheck.ok) {
                    setAuthError(nameCheck.error);
                    return;
                }
                if (passwordInput.length < 4) {
                    setAuthError('Şifre en az 4 karakter olmalıdır.');
                    return;
                }

                const targetFile = `vault_${nameCheck.name}.json`;
                const duplicate = availableVaults.some(
                    (v) => v.name.toLocaleLowerCase('tr-TR') === nameCheck.name.toLocaleLowerCase('tr-TR')
                );
                if (duplicate) {
                    setAuthError('Bu isimde bir kasa zaten var.');
                    return;
                }

                const config = latestStateRef.current.githubConfig;
                const newPass = passwordInput;
                setAuthError('');
                setAppState('loading_vault');

                try {
                    const freshLabels = { ...DEFAULT_LABELS };
                    const freshRates = { ...DEFAULT_RATES };
                    const emptyData = { portfolio: [], labels: freshLabels, rates: freshRates };
                    const encrypted = CryptoJS.AES.encrypt(JSON.stringify(emptyData), newPass).toString();
                    const payload = { isEncrypted: true, lastUpdate: new Date().toISOString(), payload: encrypted };
                    const contentBase64 = utf8ToBase64(JSON.stringify(payload, null, 2));

                    const res = await fetch(ghContentsUrl(config, targetFile), {
                        method: 'PUT',
                        headers: ghWriteHeaders(config),
                        body: JSON.stringify({
                            message: `🔒 Yeni Kasa Oluşturuldu: ${nameCheck.name}`,
                            content: contentBase64
                        })
                    });

                    if (res.status === 422) {
                        throw new Error('Bu isimde bir kasa (aktif veya dondurulmuş) zaten mevcut.');
                    }
                    if (!res.ok) {
                        const errJson = await res.json().catch(() => ({}));
                        throw new Error(errJson?.message || "GitHub'a yazılamadı.");
                    }

                    const data = await res.json();
                    skipNextSaveRef.current = true;
                    updateFileSha(data?.content?.sha || null);
                    setCurrencyLabels(freshLabels);
                    setRates(freshRates);
                    setPortfolio([]);
                    setExpandedPersons({});
                    setExpandedAssets({});
                    setCurrentVaultFile(targetFile);
                    setVaultPassword(newPass);
                    setPasswordInput('');
                    setNewVaultName('');
                    setHasUnsavedChanges(false);
                    attemptedStocksRef.current.clear();
                    ratesFetchedForVaultRef.current = '';
                    setVaultSession(targetFile, newPass);
                    setAppState('app');
                    showToast(`"${nameCheck.name}" kasası oluşturuldu!`, 'success');
                } catch (err) {
                    setAuthError(err?.message || 'Kasa oluşturulamadı.');
                    setAppState('create_vault');
                }
            };

            const saveGithubConfig = async (e) => {

                    setAuthError('Tüm GitHub alanlarını doldurmalısınız.');
                    return;

                localStorage.setItem(GH_CONFIG_KEY, JSON.stringify(cleanedConfig));

            // =========================================================================
            // PORTFOLIO CALCULATIONS (MEMOIZED & CONSISTENT)
            // =========================================================================
            const calculateAssetValue = useCallback((asset) => {
                if (asset.subItems && asset.subItems.length > 0) {
                    return asset.subItems.reduce((total, sub) => total + getItemValue(sub, rates), 0);
                }
                return getItemValue(asset, rates);
            }, [rates]);

            const calculatePnL = useCallback((amount, rate, costPrice, type, currentPrice) => {
                const cost = safeParseNum(costPrice);
                const qty = safeParseNum(amount);
                if (cost <= 0 || qty <= 0 || type === 'TRY') return null;

                let unitCurrent;
                if (type === 'STOCK') {
                    unitCurrent = safeParseNum(currentPrice);
                } else {
                    unitCurrent = safeParseNum(rate);
                }
                if (unitCurrent <= 0) return null;

                const currentTotal = qty * unitCurrent;
                const costTotal = qty * cost;
                const profit = currentTotal - costTotal;
                const percentage = (profit / costTotal) * 100;
                return { profit, percentage, isProfit: profit >= 0, isNeutral: Math.abs(profit) < 0.5 };
            }, []);

            const calculatePersonTotal = useCallback((assets) => {
                return (assets || []).filter((a) => !a.isHidden).reduce((total, asset) => total + calculateAssetValue(asset), 0);
            }, [calculateAssetValue]);

            const visiblePortfolio = useMemo(() => portfolio.filter((p) => !p.isHidden), [portfolio]);

            const grandTotal = useMemo(
                () => visiblePortfolio.reduce((acc, person) => acc + calculatePersonTotal(person.assets), 0),
                [visiblePortfolio, calculatePersonTotal]
            );

            const distribution = useMemo(() => {
                if (grandTotal <= 0) return [];
                const tryEquivalent = { TRY: 0, USD: 0, EUR: 0, GRAM: 0, ATA: 0, STOCK: 0 };

                visiblePortfolio.forEach((person) => {
                    (person.assets || []).filter((a) => !a.isHidden).forEach((asset) => {
                        if (asset.subItems && asset.subItems.length > 0) {
                            asset.subItems.forEach((sub) => {
                                tryEquivalent[sub.type] = (tryEquivalent[sub.type] || 0) + getItemValue(sub, rates);
                            });
                        } else {
                            tryEquivalent[asset.type] = (tryEquivalent[asset.type] || 0) + getItemValue(asset, rates);
                        }
                    });
                });

                return Object.keys(tryEquivalent)
                    .filter((key) => tryEquivalent[key] > 0)
                    .map((key) => {
                        const rawPct = (tryEquivalent[key] / grandTotal) * 100;
                        return {
                            type: key,
                            label: currencyLabels[key] || key,
                            rawPct,
                            percentage: rawPct.toFixed(1)
                        };

                    .sort((a, b) => b.rawPct - a.rawPct);
