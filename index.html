            const handleChangePassword = async (e) => {
                e.preventDefault();
                const snap = latestStateRef.current;

                if (settingsOldPass !== snap.vaultPassword) {
                    setSettingsError('Mevcut şifreniz yanlış.');
                    return;
                }
                if (settingsNewPass.length < 4) {
                    setSettingsError('Yeni şifre en az 4 karakter olmalıdır.');
                    return;
                }
                if (settingsNewPass === settingsOldPass) {
                    setSettingsError('Yeni şifre mevcut şifreyle aynı olamaz.');
                    return;
                }
                if (settingsNewPass !== settingsNewPassConfirm) {
                    setSettingsError('Yeni şifreler birbiriyle uyuşmuyor.');
                    return;
                }
                if (!snap.currentVaultFile) {
                    setSettingsError('Aktif kasa bulunamadı.');
                    return;
                }

                cancelAutoSave();
                setSettingsError('');
                setIsChangingPassword(true);

                try {
                    const config = snap.githubConfig;
                    const jsonString = JSON.stringify({
                        portfolio: snap.portfolio,
                        labels: snap.currencyLabels,
                        rates: snap.rates,
                        history: mergeTodayHistorySnapshot(snap.vaultHistory, snap.portfolio, snap.rates),
                        goal: snap.vaultGoal
                    });
                    const encryptedPayload = CryptoJS.AES.encrypt(jsonString, settingsNewPass).toString();
                    const vaultPackage = {
                        isEncrypted: true,
                        lastUpdate: new Date().toISOString(),
                        payload: encryptedPayload
                    };
                    const contentBase64 = utf8ToBase64(JSON.stringify(vaultPackage, null, 2));

                    const putPass = (sha) =>
                        fetch(ghContentsUrl(config, snap.currentVaultFile), {
                            method: 'PUT',
                            headers: ghWriteHeaders(config),
                            body: JSON.stringify({
                                message: `🔑 Şifre Değiştirildi: ${snap.currentVaultFile}`,
                                content: contentBase64,
                                ...(sha ? { sha } : {})
                            })
                        });

                    let response = await putPass(fileShaRef.current);

                    // Retry once with fresh SHA if 409 conflict occurred
                    if (response.status === 409) {
                        const freshRes = await fetch(ghContentsUrl(config, snap.currentVaultFile, true), {
                            headers: ghReadHeaders(config),
                            cache: 'no-store'
                        });
                        if (freshRes.ok) {
                            const freshData = await freshRes.json();
                            if (freshData?.sha) {
                                updateFileSha(freshData.sha);
                                response = await putPass(freshData.sha);
                            }
                        }
                    }

                    if (!response.ok) {
                        const errJson = await response.json().catch(() => ({}));
                        throw new Error(errJson?.message || 'Şifre güncellenemedi.');
                    }

                    const data = await response.json();
                    if (data?.content?.sha) updateFileSha(data.content.sha);

                    setVaultPassword(settingsNewPass);
                    setVaultSession(snap.currentVaultFile, settingsNewPass);
                    setHasUnsavedChanges(false);

                    setShowSettingsModal(false);
                    setSettingsOldPass('');
                    setSettingsNewPass('');
                    setSettingsNewPassConfirm('');
                    setSettingsError('');

                    showToast('Şifreniz başarıyla değiştirildi!', 'success');

                    if (snap.appState === 'admin_panel') {
                        fetchAdminVaults();
                    }

                    setSettingsError('Hata: ' + (err?.message || 'Bağlantı hatası'));

                    setIsChangingPassword(false);
                }

            const calculateAssetValue = useCallback((asset) => {
                if (asset.subItems && asset.subItems.length > 0) {
                    return asset.subItems.reduce((total, sub) => total + getItemValue(sub, rates), 0);
                }
                return getItemValue(asset, rates);
            }, [rates]);

            const calculatePnL = useCallback((amount, rate, costPrice, type, currentPrice) => {
                const cost = safeParseNum(costPrice);
                const qty = safeParseNum(amount);
                if (cost <= 0 || qty <= 0 || type === 'TRY') return null;

                let unitCurrent;
                if (type === 'STOCK') {
                    unitCurrent = safeParseNum(currentPrice);
                } else {
                    unitCurrent = safeParseNum(rate);
                }
                if (unitCurrent <= 0) return null;

                const currentTotal = qty * unitCurrent;
                const costTotal = qty * cost;
                const profit = currentTotal - costTotal;
                const percentage = (profit / costTotal) * 100;
                return { profit, percentage, isProfit: profit >= 0, isNeutral: Math.abs(profit) < 0.5 };
            }, []);

            const calculatePersonTotal = useCallback((assets) => {
                return (assets || []).filter((a) => !a.isHidden).reduce((total, asset) => total + calculateAssetValue(asset), 0);
            }, [calculateAssetValue]);

            const calculateAssetPnL = useCallback((asset) => {
                const items = asset?.subItems && asset.subItems.length > 0 ? asset.subItems : [asset];
                let costSum = 0;
                let currSum = 0;
                items.forEach((it) => {
                    if (!it) return;
                    const pnl = calculatePnL(it.amount, rates[it.type], it.costPrice, it.type, it.currentPrice);
                    if (pnl) {
                        costSum += safeParseNum(it.amount) * safeParseNum(it.costPrice);
                        currSum += getItemValue(it, rates);
                    }
                });
                if (costSum <= 0) return null;
                const profit = currSum - costSum;
                const percentage = (profit / costSum) * 100;
                return { profit, percentage, isProfit: profit >= 0, isNeutral: Math.abs(profit) < 0.5 };
            }, [rates, calculatePnL]);

            const calculatePersonPnL = useCallback((assets) => {
                let costSum = 0;
                let currSum = 0;
                (assets || []).filter((a) => !a.isHidden).forEach((asset) => {
                    const items = asset.subItems && asset.subItems.length > 0 ? asset.subItems : [asset];
                    items.forEach((it) => {
                        const pnl = calculatePnL(it.amount, rates[it.type], it.costPrice, it.type, it.currentPrice);
                        if (pnl) {
                            costSum += safeParseNum(it.amount) * safeParseNum(it.costPrice);
                            currSum += getItemValue(it, rates);
                        }
                    });
                });
                if (costSum <= 0) return null;
                const profit = currSum - costSum;
                const percentage = (profit / costSum) * 100;
                return { profit, percentage, isProfit: profit >= 0, isNeutral: Math.abs(profit) < 0.5 };
            }, [rates, calculatePnL]);

            const visiblePortfolio = useMemo(() => portfolio.filter((p) => !p.isHidden), [portfolio]);

            const grandTotal = useMemo(
                () => visiblePortfolio.reduce((acc, person) => acc + calculatePersonTotal(person.assets), 0),
                [visiblePortfolio, calculatePersonTotal]
            );

            const overallPnL = useMemo(() => {
                let costSum = 0;
                let currSum = 0;
                visiblePortfolio.forEach((person) => {
                    (person.assets || []).filter((a) => !a.isHidden).forEach((asset) => {
                        const items = asset.subItems && asset.subItems.length > 0 ? asset.subItems : [asset];
                        items.forEach((it) => {
                            const pnl = calculatePnL(it.amount, rates[it.type], it.costPrice, it.type, it.currentPrice);
                            if (pnl) {
                                costSum += safeParseNum(it.amount) * safeParseNum(it.costPrice);
                                currSum += getItemValue(it, rates);
                            }
                        });
                    });
                });
                if (costSum <= 0) return null;
                const profit = currSum - costSum;
                const percentage = (profit / costSum) * 100;
                return { profit, percentage, costSum, isProfit: profit >= 0 };
            }, [visiblePortfolio, rates, calculatePnL]);

            const goalProgress = useMemo(() => {
                const targetNum = safeParseNum(vaultGoal?.target);
                if (targetNum <= 0) return null;
                const cur = vaultGoal.currency || 'TRY';
                let targetInTry = targetNum;
                if (cur !== 'TRY') {
                    const r = safeParseNum(rates[cur]);
                    if (r <= 0) return null;
                    targetInTry = targetNum * r;
                }
                const pct = Math.min(100, Math.max(0, (grandTotal / targetInTry) * 100));
                const remainingTry = Math.max(0, targetInTry - grandTotal);
                return {
                    title: vaultGoal.title || 'Portföy Hedefi',
                    currency: cur,
                    targetInTry,
                    pct,
                    remainingTry,
                    reached: grandTotal >= targetInTry
                };
            }, [vaultGoal, grandTotal, rates]);

            const liveHistory = useMemo(
                () => mergeTodayHistorySnapshot(vaultHistory, portfolio, rates),
                [vaultHistory, portfolio, rates]
            );

            const hasAnyExpandedAsset = useMemo(() => {
                return portfolio.some((p) => (p.assets || []).some((a) => Boolean(expandedAssets[a.id])));
            }, [portfolio, expandedAssets]);

            const toggleExpandAllAssets = useCallback(() => {
                const nextExpand = !hasAnyExpandedAsset;
                const nextPersons = {};
                const nextAssets = {};
                portfolio.forEach((p) => {
                    nextPersons[p.id] = true;
                    (p.assets || []).forEach((a) => {
                        nextAssets[a.id] = nextExpand;
                    });
                });
                setExpandedPersons(nextPersons);
                setExpandedAssets(nextAssets);
            }, [portfolio, hasAnyExpandedAsset]);

            const distribution = useMemo(() => {
                if (grandTotal <= 0) return [];
                const tryEquivalent = {};

                visiblePortfolio.forEach((person) => {
                    (person.assets || []).filter((a) => !a.isHidden).forEach((asset) => {
                        if (asset.subItems && asset.subItems.length > 0) {
                            asset.subItems.forEach((sub) => {
                                tryEquivalent[sub.type] = (tryEquivalent[sub.type] || 0) + getItemValue(sub, rates);
                            });
                        } else {
                            tryEquivalent[asset.type] = (tryEquivalent[asset.type] || 0) + getItemValue(asset, rates);
                        }
                    });
                });

                return Object.keys(tryEquivalent)
                    .filter((key) => tryEquivalent[key] > 0)
                    .map((key) => {
                        const rawPct = (tryEquivalent[key] / grandTotal) * 100;
                        return {
                            type: key,
                            label: currencyLabels[key] || key,
                            value: tryEquivalent[key],
                            rawPct,
                            percentage: rawPct.toFixed(1)
                        };
                    })
                    .sort((a, b) => b.rawPct - a.rawPct);
            }, [visiblePortfolio, grandTotal, rates, currencyLabels]);

            const filteredPortfolio = useMemo(() => {
                const q = normalizeTurkishSearch(searchQuery).trim();
                const hasQuery = q.length > 0;
                const hasType = Boolean(activeTypeFilter);

                let list = portfolio;

                if (hasQuery || hasType) {
                    list = portfolio
                        .map((person) => {
                            const personMatchesQuery = hasQuery && normalizeTurkishSearch(person.person).includes(q);
                            const matchedAssets = (person.assets || []).filter((asset) => {
                                const hasSubs = asset.subItems && asset.subItems.length > 0;
                                const typeOk = !hasType || (
                                    hasSubs
                                        ? asset.subItems.some((s) => s.type === activeTypeFilter)
                                        : asset.type === activeTypeFilter
                                );
                                if (!typeOk) return false;
                                if (!hasQuery || personMatchesQuery) return true;
                                if (normalizeTurkishSearch(asset.name).includes(q)) return true;
                                if (normalizeTurkishSearch(currencyLabels[asset.type] || asset.type).includes(q)) return true;
                                if (hasSubs) {
                                    return asset.subItems.some(
                                        (s) =>
                                            normalizeTurkishSearch(s.name).includes(q) ||
                                            normalizeTurkishSearch(currencyLabels[s.type] || s.type).includes(q)
                                    );
                                }
                                return false;
                            });

                            if (matchedAssets.length === 0 && !(personMatchesQuery && !hasType)) return null;
                            return { ...person, assets: matchedAssets };
                        })
                        .filter(Boolean);
                }

                if (sortByValue) {
                    list = [...list]
                        .map((person) => ({
                            ...person,
                            assets: [...(person.assets || [])].sort((a, b) => calculateAssetValue(b) - calculateAssetValue(a))
                        }))
                        .sort((a, b) => calculatePersonTotal(b.assets) - calculatePersonTotal(a.assets));
                }

                return list;
            }, [portfolio, searchQuery, activeTypeFilter, sortByValue, currencyLabels, calculateAssetValue, calculatePersonTotal]);

            // Keyboard Shortcuts (Desktop power users: Ctrl+S save, Alt+R refresh, Alt+H privacy)
            useEffect(() => {
                if (appState !== 'app') return;
                const onKeyDown = (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                        e.preventDefault();
                        handleSaveToGithub(false);
                    } else if (e.altKey && e.key.toLowerCase() === 'r') {
                        e.preventDefault();
                        fetchLiveRates(true);
                    } else if (e.altKey && e.key.toLowerCase() === 'h') {
                        e.preventDefault();
                        togglePrivacyMode();
                    }
                };
                window.addEventListener('keydown', onKeyDown);
                return () => window.removeEventListener('keydown', onKeyDown);
            }, [appState, handleSaveToGithub, fetchLiveRates, togglePrivacyMode]);

            const getSessionRemainingMinutes = () => {
                const session = safeJsonParse(localStorage.getItem(VAULT_SESSION_KEY), null);
                if (!session?.expiry) return null;
                const diff = Math.max(0, Math.ceil((session.expiry - Date.now()) / 60000));
                return diff;
            };

            const movePerson = (personId, direction) => {
                setPortfolio((prev) => {
                    const idx = prev.findIndex((p) => p.id === personId);
                    const nextIdx = idx + direction;
                    if (idx < 0 || nextIdx < 0 || nextIdx >= prev.length) return prev;
                    const copy = [...prev];
                    const [moved] = copy.splice(idx, 1);
                    copy.splice(nextIdx, 0, moved);
                    return copy;
                });
            };

            const openTradeModal = (personId, assetId, item, subId = null) => {
                const liveUnit = getItemUnitRate(item, rates);
                setTradeTarget({
                    personId,
                    assetId,
                    subId,
                    name: item.name || (currencyLabels[item.type] || item.type),
                    type: item.type,
                    typeLabel: currencyLabels[item.type] || item.type,
                    currentAmount: safeParseNum(item.amount),
                    currentCost: safeParseNum(item.costPrice),
                    liveUnit
                });
                setTradeMode('buy');
                setTradeQty('');
                setTradePrice(liveUnit > 0 ? String(liveUnit) : '');
            };

            const applyTrade = (e) => {
                e.preventDefault();
                if (!tradeTarget) return;
                const qty = safeParseNum(tradeQty);
                const price = safeParseNum(tradePrice);
                if (qty <= 0) {
                    showToast('İşlem miktarı 0’dan büyük olmalıdır.', 'error');
                    return;
                }
                if (tradeMode === 'buy' && price <= 0) {
                    showToast('Alım birim fiyatı 0’dan büyük olmalıdır.', 'error');
                    return;
                }
                if (tradeMode === 'sell' && qty > tradeTarget.currentAmount) {
                    showToast('Satış miktarı mevcut adetten fazla olamaz.', 'error');
                    return;
                }

                let newAmount;
                let newCost;
                if (tradeMode === 'buy') {
                    newAmount = parseFloat((tradeTarget.currentAmount + qty).toFixed(6));
                    if (tradeTarget.currentAmount > 0 && tradeTarget.currentCost > 0) {
                        newCost = parseFloat((((tradeTarget.currentAmount * tradeTarget.currentCost) + (qty * price)) / newAmount).toFixed(4));
                    } else {
                        newCost = parseFloat(price.toFixed(4));
                    }
                } else {
                    newAmount = parseFloat(Math.max(0, tradeTarget.currentAmount - qty).toFixed(6));
                    newCost = newAmount > 0 ? tradeTarget.currentCost : '';
                }

                if (tradeTarget.subId) {
                    updatePortfolioAsset(tradeTarget.personId, tradeTarget.assetId, (asset) => ({
                        ...asset,
                        subItems: (asset.subItems || []).map((s) =>
                            s.id === tradeTarget.subId
                                ? { ...s, amount: String(newAmount), costPrice: newCost === '' ? '' : String(newCost) }
                                : s
                        )
                    }));
                } else {
                    updatePortfolioAsset(tradeTarget.personId, tradeTarget.assetId, (asset) => ({
                        ...asset,
                        amount: String(newAmount),
                        costPrice: newCost === '' ? '' : String(newCost)
                    }));
                }

                showToast(
                    tradeMode === 'buy'
                        ? `${tradeTarget.name}: +${qty} eklendi (Yeni ort: ${newCost} ₺)`
                        : `${tradeTarget.name}: -${qty} satıldı (Kalan: ${newAmount})`,
                    'success'
                );
                setTradeTarget(null);
            };

            // =========================================================================
            // PORTFOLIO MUTATIONS
            // =========================================================================
            const handleRateCommit = useCallback((currency, numVal) => {
                setRates((prev) => (prev[currency] === numVal ? prev : { ...prev, [currency]: numVal }));
            }, []);

            const togglePersonAccordion = (personId) =>
                setExpandedPersons((prev) => ({ ...prev, [personId]: prev[personId] === false ? true : false }));

            const toggleAssetAccordion = (assetId) =>
                setExpandedAssets((prev) => ({ ...prev, [assetId]: !prev[assetId] }));

            const updatePersonName = (personId, newName) =>
                setPortfolio((prev) => prev.map((p) => (p.id === personId ? { ...p, person: newName } : p)));

            const updatePortfolioAsset = (personId, assetId, updater) =>
                setPortfolio((prev) =>
                    prev.map((person) =>
                        person.id === personId
                            ? { ...person, assets: person.assets.map((asset) => (asset.id === assetId ? updater(asset) : asset)) }
                            : person
                    )
                );

            const addSubItem = (personId, assetId) => {
                updatePortfolioAsset(personId, assetId, (asset) => {
                    const existingSubs = [...(asset.subItems || [])];
                    // If this is the first sub-item and the asset already holds a value, preserve it as the first sub-item
                    if (existingSubs.length === 0 && safeParseNum(asset.amount) > 0) {
                        existingSubs.push({
                            id: generateId('sub'),
                            name: asset.name || 'Kalem 1',
                            type: asset.type || 'TRY',
                            amount: asset.amount,
                            costPrice: asset.costPrice || '',
                            currentPrice: asset.currentPrice || '',
                            _lastFetchedTicker: asset._lastFetchedTicker || ''
                        });
                    }
                    existingSubs.push({ id: generateId('sub'), name: '', type: 'TRY', amount: '', costPrice: '', currentPrice: '' });
                    return {
                        ...asset,
                        amount: '',
                        costPrice: '',
                        currentPrice: '',
                        _lastFetchedTicker: '',
                        subItems: existingSubs
                    };
                });
            };

            const removeSubItem = (e, personId, assetId, subItemId) => {
                e.stopPropagation();
                setDeleteTarget({ type: 'subItem', personId, assetId, subItemId });
            };

            const updateSubItem = (personId, assetId, subItemId, field, value) =>
                updatePortfolioAsset(personId, assetId, (asset) => ({
                    ...asset,
                    subItems: (asset.subItems || []).map((sub) => (sub.id === subItemId ? { ...sub, [field]: value } : sub))
                }));

            const addAsset = (personId) => {
                const newId = generateId('asset');
                setPortfolio((prev) =>
                    prev.map((person) =>
                        person.id === personId
                            ? { ...person, assets: [...person.assets, { id: newId, name: '', type: 'TRY', amount: '', costPrice: '', currentPrice: '', subItems: [] }] }
                            : person
                    )
                );
                setExpandedAssets((prev) => ({ ...prev, [newId]: true }));
            };

            const removeAsset = (e, personId, assetId) => {
                e.stopPropagation();
                setDeleteTarget({ type: 'asset', personId, assetId });
            };

            const togglePersonVisibility = (personId) => {
                setPortfolio((prev) => prev.map((p) => (p.id === personId ? { ...p, isHidden: !p.isHidden } : p)));
            };

            const toggleAssetVisibility = (e, personId, assetId) => {
                e.stopPropagation();
                setPortfolio((prev) =>
                    prev.map((person) =>
                        person.id === personId
                            ? { ...person, assets: person.assets.map((asset) => (asset.id === assetId ? { ...asset, isHidden: !asset.isHidden } : asset)) }
                            : person
                    )
                );
            };

            const removePerson = (e, personId) => {
                e.preventDefault();
                e.stopPropagation();
                setDeleteTarget({ type: 'person', personId });
            };

            const addNewPerson = () => {
                const newId = generateId('person');
                setPortfolio((prev) => [...prev, { id: newId, person: '', isHidden: false, assets: [] }]);
                setExpandedPersons((prev) => ({ ...prev, [newId]: true }));
            };

            const openSettingsModal = (initialTab = 'password') => {
                setSettingsTab(typeof initialTab === 'string' ? initialTab : 'password');
                setSettingsOldPass('');
                setSettingsNewPass('');
                setSettingsNewPassConfirm('');
                setSettingsError('');
                setImportPreview(null);
                setImportError('');
                setGoalForm({
                    title: vaultGoal?.title || '',
                    target: vaultGoal?.target !== undefined && vaultGoal?.target !== '' ? String(vaultGoal.target) : '',
                    currency: vaultGoal?.currency || 'TRY'
                });
                setShowSettingsModal(true);
            };

            const handleConfirmDelete = () => {
                if (!deleteTarget) return;
                if (deleteTarget.type === 'person') {
                    setPortfolio((prev) => prev.filter((p) => p.id !== deleteTarget.personId));
                    setExpandedPersons((prev) => {
                        const next = { ...prev };
                        delete next[deleteTarget.personId];
                        return next;
                    });
                } else if (deleteTarget.type === 'asset') {
                    setPortfolio((prev) =>
                        prev.map((p) =>
                            p.id === deleteTarget.personId
                                ? { ...p, assets: p.assets.filter((a) => a.id !== deleteTarget.assetId) }
                                : p
                        )
                    );
                } else if (deleteTarget.type === 'subItem') {
                    updatePortfolioAsset(deleteTarget.personId, deleteTarget.assetId, (asset) => ({
                        ...asset,
                        subItems: (asset.subItems || []).filter((s) => s.id !== deleteTarget.subItemId)
                    }));
                }
                setDeleteTarget(null);
            };

            // =========================================================================
            // ACTIVE VIEW RENDERER (SINGLE ROOT + PORTAL MODALS & TOAST)
            // =========================================================================
            const activeVaultLabel = getVaultDisplayName(currentVaultFile);

            const renderMainView = () => {
                if (appState === 'loading_vault' || appState === 'loading_vaults') {
                    return (
                        <div className="min-h-screen flex flex-col items-center justify-center gap-4">
                            <i className="fa-solid fa-vault text-primary text-5xl animate-float opacity-85"></i>
                            <p className="text-emerald-300 font-semibold tracking-widest uppercase text-xs animate-pulse opacity-80">
                                {appState === 'loading_vault' ? 'Kasa Açılıyor' : 'Bağlanıyor'}
                            </p>
                        </div>
                    );
                }

                if (appState === 'admin_loading') {
                    return (
                        <div className="min-h-screen flex flex-col items-center justify-center gap-4">
                            <i className="fa-solid fa-server text-amber-500 text-5xl animate-float opacity-85"></i>
                            <p className="text-amber-300 font-semibold tracking-widest uppercase text-xs animate-pulse opacity-80">
                                Kasalar Taranıyor
                            </p>
                        </div>
                    );
                }

                if (appState === 'admin_panel') {
                    return (
                        <div className="min-h-screen safe-top px-4 pb-10 sm:p-8 flex flex-col items-center">
                            <div className="w-full max-w-4xl relative z-20">
                                <div className="flex justify-between items-center gap-3 mb-8">
                                    <div className="flex items-center gap-3 sm:gap-4 min-w-0">
                                        <div className="w-11 h-11 sm:w-12 sm:h-12 rounded-2xl bg-amber-500/15 border border-amber-500/35 flex items-center justify-center shrink-0 shadow-[0_0_15px_rgba(245,158,11,0.2)]">
                                            <i className="fa-solid fa-crown text-amber-400 text-lg sm:text-xl"></i>
                                        </div>
                                        <div className="min-w-0">
                                            <h2 className="text-xl sm:text-2xl font-bold text-white tracking-tight truncate">Yönetim Merkezi</h2>
                                            <p className="text-[10px] sm:text-xs font-semibold uppercase tracking-widest text-amber-400/80">Tam Yetkili Erişim</p>
                                        </div>
                                    </div>
                                    <div className="flex gap-2 shrink-0">
                                        <button
                                            onClick={fetchAdminVaults}
                                            title="Listeyi Yenile"
                                            className="w-10 h-10 rounded-xl header-btn text-zinc-200 hover:text-white transition-all flex items-center justify-center"
                                        >
                                            <i className="fa-solid fa-rotate-right text-sm"></i>
                                        </button>
                                        <button
                                            onClick={openSettingsModal}
                                            title="Hesap Ayarları"
                                            className="w-10 h-10 rounded-xl header-btn text-zinc-200 hover:text-white transition-all flex items-center justify-center"
                                        >
                                            <i className="fa-solid fa-gear text-sm"></i>
                                        </button>
                                        <button
                                            onClick={() => setAppState('app')}
                                            className="px-3.5 sm:px-5 py-2.5 rounded-xl header-btn text-white font-bold text-xs uppercase tracking-widest transition-all flex items-center gap-2"
                                        >
                                            <i className="fa-solid fa-arrow-left"></i> <span className="hidden sm:inline">KASAMA DÖN</span>
                                        </button>
                                    </div>
                                </div>

                                <div className="flex flex-col gap-4">
                                    {adminVaults.map((gv) => {
                                        const isMain = gv.filename === 'data.json';
                                        return (
                                            <div
                                                key={gv.filename}
                                                className={`glass-card p-5 sm:p-6 rounded-2xl flex flex-col sm:flex-row justify-between sm:items-center gap-4 border transition-all ${
                                                    gv.isLocked
                                                        ? 'border-red-500/30 bg-red-500/5'
                                                        : isMain
                                                            ? 'border-amber-500/30 bg-amber-500/5'
                                                            : 'border-white/10'
                                                }`}
                                            >
                                                <div className="flex items-center gap-4 min-w-0">
                                                    <div
                                                        className={`w-10 h-10 rounded-xl flex items-center justify-center shrink-0 ${
                                                            gv.isLocked
                                                                ? 'bg-red-500/20 text-red-400'
                                                                : isMain
                                                                    ? 'bg-amber-500/20 text-amber-400'
                                                                    : 'bg-emerald-500/20 text-emerald-400'
                                                        }`}
                                                    >
                                                        <i className={`fa-solid ${gv.isLocked ? 'fa-lock' : isMain ? 'fa-star' : 'fa-folder-open'} text-lg`}></i>
                                                    </div>
                                                    <div className="flex flex-col min-w-0">
                                                        <div className="flex items-center gap-2 flex-wrap">
                                                            <h3 className={`text-base sm:text-lg font-bold break-words ${gv.isLocked ? 'text-zinc-500 line-through' : 'text-white'}`}>
                                                                {gv.name}
                                                            </h3>
                                                            {gv.isLocked && (
                                                                <span className="text-[9px] uppercase tracking-wider font-bold bg-red-500/20 text-red-400 px-2 py-0.5 rounded-md">
                                                                    Dondurulmuş
                                                                </span>
                                                            )}
                                                            {isMain && (
                                                                <span className="text-[9px] uppercase tracking-wider font-bold bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded-md">
                                                                    Yönetici
                                                                </span>
                                                            )}
                                                        </div>
                                                        <p className="text-xs text-zinc-400 mt-1 flex items-center gap-1.5">
                                                            <i className="fa-regular fa-clock"></i> Son İşlem: {gv.lastUpdate}
                                                        </p>
                                                        <p className="text-[10px] text-zinc-500 mt-0.5 font-mono truncate">{gv.filename}</p>
                                                    </div>
                                                </div>

                                                {!isMain && (
                                                    <div className="flex items-center gap-2 flex-wrap shrink-0">
                                                        <button
                                                            onClick={() => { setAdminModalError(''); setAdminActionTarget({ action: 'toggle_lock', vault: gv }); }}
                                                            className="w-10 h-10 rounded-xl border border-white/10 text-white hover:bg-white/10 transition-colors flex items-center justify-center"
                                                            title={gv.isLocked ? 'Kilidi Aç' : 'Kasayı Dondur'}
                                                        >
                                                            <i className={`fa-solid ${gv.isLocked ? 'fa-lock-open text-emerald-400' : 'fa-lock text-red-400'}`}></i>
                                                        </button>

                                <p className="text-xs text-zinc-400">Şifre ve veriler sabit kalır, sadece kasa adı değişir.</p>
                                {adminModalError && (
                                    <div className="p-2.5 rounded-xl bg-red-500/10 border border-red-500/25 text-red-400 text-xs font-semibold">
                                        {adminModalError}
                                    </div>
                                )}
                                <input
                                    autoFocus
                                    type="text"
                                    value={adminInputVal}
                                    onChange={(e) => { setAdminInputVal(e.target.value); setAdminModalError(''); }}
                                    className="w-full glass-surface py-3 px-4 rounded-xl text-center text-white font-bold text-sm outline-none focus:border-white/30"
                                    placeholder="Yeni Kasa Adı"
                                />
                                <div className="flex gap-3 mt-1">
                                    <button
                                        type="button"
                                        onClick={() => { setAdminActionTarget(null); setAdminModalError(''); }}
                                        className="flex-1 py-3 rounded-xl font-bold text-xs bg-white/5 text-white hover:bg-white/10 tracking-widest border border-white/10"
                                    >
                                        İPTAL
                                    </button>
                                    <button
                                        type="submit"
                                        className="flex-1 py-3 rounded-xl font-bold text-xs bg-blue-500/20 text-blue-400 hover:bg-blue-500 hover:text-white tracking-widest border border-blue-500/30"
                                    >
                                        KAYDET
                                    </button>
                                </div>
                            </form>
                        )}

                        {adminActionTarget?.action === 'reset_password' && (
                            <form onSubmit={(e) => executeAdminAction('reset_password', e)} className="flex flex-col text-center gap-4">
                                <i className="fa-solid fa-key text-4xl text-amber-500 mb-1"></i>
                                <h3 className="text-xl font-bold text-white">Zorla Sıfırla</h3>
                                <p className="text-xs text-red-400 font-bold bg-red-500/10 p-2.5 rounded-xl border border-red-500/20 leading-relaxed">
                                    DİKKAT: Şifreyi zorla sıfırlamak bu kasanın içerisindeki tüm verileri kalıcı olarak SİLER!
                                </p>
                                {adminModalError && (
                                    <div className="p-2.5 rounded-xl bg-red-500/10 border border-red-500/25 text-red-400 text-xs font-semibold">
                                        {adminModalError}
                                    </div>
                                )}
                                <input
                                    autoFocus
                                    type="text"
                                    value={adminInputVal}
                                    onChange={(e) => { setAdminInputVal(e.target.value); setAdminModalError(''); }}
                                    className="w-full glass-surface py-3 px-4 rounded-xl text-center text-white font-bold text-base tracking-[0.2em] outline-none focus:border-white/30"
                                    placeholder="Yeni Şifre (En az 4 hane)"
                                />
                                <div className="flex gap-3 mt-1">
                                    <button
                                        type="button"
                                        onClick={() => { setAdminActionTarget(null); setAdminModalError(''); }}
                                        className="flex-1 py-3 rounded-xl font-bold text-xs bg-white/5 text-white hover:bg-white/10 tracking-widest border border-white/10"
                                    >
                                        İPTAL
                                    </button>
                                    <button
                                        type="submit"
                                        className="flex-1 py-3 rounded-xl font-bold text-xs bg-amber-500/20 text-amber-400 hover:bg-amber-500 hover:text-black tracking-widest border border-amber-500/30"
                                    >
                                        SIFIRLA
                                    </button>
                                </div>
                            </form>
                        )}
                    </PortalModal>
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <PortfolioApp />
            </ErrorBoundary>
        );
    </script>
</body>

</html>
