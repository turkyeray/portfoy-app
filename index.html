                                                                        {slice.pnlVal >= 0 ? '+' : ''}%{slice.pnlPct.toFixed(1)}
                                                                    </span>
                                                                )}
                                                                <span className="text-xs font-bold text-white">{fmt(slice.value)}</span>
                                                                <span className="text-[10px] text-zinc-400 w-10 text-right">%{slice.pct.toFixed(1)}</span>
                                                            </div>
                                                        </div>
                                                        <div className="h-1.5 w-full bg-white/5 rounded-full overflow-hidden">
                                                            <div
                                                                className="h-full rounded-full transition-all duration-500"
                                                                style={{ width: `${Math.max(2, slice.pct)}%`, backgroundColor: slice.color }}
                                                            ></div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                ) : (
                                    <div className="bg-black/25 border border-white/5 rounded-2xl p-6 text-center text-xs text-zinc-500">
                                        Bu portföyde görüntülenecek aktif varlık değeri bulunmuyor.
                                    </div>
                                )
                            )}

                            {/* TAB 3: HISTORICAL VALUE TREND SVG LINE CHART */}
                            {chartTab === 'trend' && (
                                <div className="flex flex-col gap-3">
                                    {activeTrendPoint && (
                                        <div className="flex items-center justify-between gap-2 bg-black/25 border border-white/5 rounded-xl px-3.5 py-2.5">
                                            <div>
                                                <span className="text-[10px] uppercase tracking-widest text-zinc-500 font-bold">
                                                    {formatShortDateTr(activeTrendPoint.date)}
                                                </span>
                                                <div className="text-sm sm:text-base font-black text-white font-numbers">
                                                    {fmt(activeTrendPoint.value)}
                                                </div>
                                            </div>
                                            {trendDelta && (
                                                <div className="text-right font-numbers">
                                                    <span className="text-[9px] uppercase tracking-widest text-zinc-500 font-sans block">Dönem Değişimi</span>
                                                    <span className={`text-xs font-bold ${trendDelta.diff >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                                                        {trendDelta.diff >= 0 ? '+' : ''}{fmt(trendDelta.diff)} ({trendDelta.diff >= 0 ? '+' : ''}%{trendDelta.pct.toFixed(1)})
                                                    </span>
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {trendSeries.length > 0 ? (
                                        <div className="bg-black/25 border border-white/5 rounded-2xl p-3 sm:p-4">
                                            {(() => {
                                                const W = 560;
                                                const H = 175;
                                                const padX = 24;
                                                const padY = 22;
                                                const vals = trendSeries.map((p) => p.value);
                                                const minV = Math.min(...vals);
                                                const maxV = Math.max(...vals);
                                                const span = maxV - minV || Math.max(1, maxV * 0.1);
                                                const low = Math.max(0, minV - span * 0.15);
                                                const high = maxV + span * 0.15;
                                                const range = high - low || 1;

                                                const pts = trendSeries.map((p, idx) => {
                                                    const x = trendSeries.length === 1
                                                        ? W / 2
                                                        : padX + (idx / (trendSeries.length - 1)) * (W - padX * 2);
                                                    const y = padY + (1 - (p.value - low) / range) * (H - padY * 2);
                                                    return { ...p, x, y, idx };
                                                });

                                                const lineD = pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
                                                const areaD = pts.length > 1
                                                    ? `${lineD} L ${pts[pts.length - 1].x.toFixed(1)} ${(H - padY).toFixed(1)} L ${pts[0].x.toFixed(1)} ${(H - padY).toFixed(1)} Z`
                                                    : '';

                                                return (
                                                    <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-40 sm:h-48 overflow-visible">
                                                        <defs>
                                                            <linearGradient id="trendGrad" x1="0" y1="0" x2="0" y2="1">
                                                                <stop offset="0%" stopColor="#10b981" stopOpacity="0.35" />
                                                                <stop offset="100%" stopColor="#10b981" stopOpacity="0.0" />
                                                            </linearGradient>
                                                        </defs>
                                                        {[0.2, 0.5, 0.8].map((t) => (
                                                            <line
                                                                key={t}
                                                                x1={padX}
                                                                x2={W - padX}
                                                                y1={padY + t * (H - padY * 2)}
                                                                y2={padY + t * (H - padY * 2)}
                                                                stroke="rgba(255,255,255,0.06)"
                                                                strokeDasharray="4 4"
                                                            />
                                                        ))}
                                                        {areaD && <path d={areaD} fill="url(#trendGrad)" />}
                                                        {pts.length > 1 && (
                                                            <path d={lineD} fill="none" stroke="#10b981" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
                                                        )}
                                                        {pts.map((p) => {
                                                            const isActive = (selectedPointIdx ?? pts.length - 1) === p.idx;
                                                            return (
                                                                <g
                                                                    key={p.date}
                                                                    className="cursor-pointer"
                                                                    onClick={() => setSelectedPointIdx(p.idx)}
                                                                >
                                                                    <circle cx={p.x} cy={p.y} r="14" fill="transparent" />
                                                                    <circle
                                                                        cx={p.x}
                                                                        cy={p.y}
                                                                        r={isActive ? '6' : '4'}
                                                                        fill={isActive ? '#34d399' : '#040608'}
                                                                        stroke="#10b981"
                                                                        strokeWidth="2.5"
                                                                    />
                                                                </g>
                                                            );
                                                        })}
                                                    </svg>
                                                );
                                            })()}

                                            <div className="flex justify-between text-[10px] text-zinc-500 font-semibold mt-1 px-1">
                                                <span>{formatShortDateTr(trendSeries[0].date)}</span>
                                                {trendSeries.length > 1 && <span>{formatShortDateTr(trendSeries[trendSeries.length - 1].date)}</span>}
                                            </div>
                                            {trendSeries.length < 2 && (
                                                <p className="text-[10px] text-zinc-500 text-center mt-2">
                                                    Günlük kayıtlar otomatik olarak şifreli kasanızda biriktikçe çok günlük trend çizgisi oluşacaktır.
                                                </p>
                                            )}
                                        </div>
                                    ) : (
                                        <div className="bg-black/25 border border-white/5 rounded-2xl p-6 text-center text-xs text-zinc-500">
                                            Henüz kayıtlı trend verisi bulunmuyor.
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        // =========================================================================
        // MAIN APPLICATION
        // =========================================================================
        const PortfolioApp = () => {
            const [appState, setAppState] = useState('loading_vault');

            const [githubConfig, setGithubConfig] = useState(() => {
                const saved = safeJsonParse(localStorage.getItem(GH_CONFIG_KEY), null);
                if (saved && typeof saved === 'object') {
                    return {
                        username: saved.username || DEFAULT_GH_CONFIG.username,
                        repo: saved.repo || DEFAULT_GH_CONFIG.repo,
                        token: saved.token || ''
                    };
                }
                return { ...DEFAULT_GH_CONFIG };
            });

            const [formConfig, setFormConfig] = useState(githubConfig);

            const [vaultPassword, setVaultPassword] = useState('');
            const [passwordInput, setPasswordInput] = useState('');
            const [authError, setAuthError] = useState('');
            const [toast, setToast] = useState({ show: false, message: '', type: 'success' });

            const [rates, setRates] = useState(() => ({ ...DEFAULT_RATES }));
            const [currencyLabels, setCurrencyLabels] = useState(() => ({ ...DEFAULT_LABELS }));
            const [portfolio, setPortfolio] = useState([]);
            const [vaultHistory, setVaultHistory] = useState([]);
            const [vaultGoal, setVaultGoal] = useState({ title: '', target: '', currency: 'TRY' });

            // UX & View preferences
            const [privacyMode, setPrivacyMode] = useState(() => localStorage.getItem(PRIVACY_MODE_KEY) === '1');
            const [displayCurrency, setDisplayCurrency] = useState('TRY'); // 'TRY' | 'USD' | 'EUR' | 'GRAM'
            const [showExtraRates, setShowExtraRates] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [activeTypeFilter, setActiveTypeFilter] = useState(null);
            const [sortByValue, setSortByValue] = useState(false);

            const [isLoadingRates, setIsLoadingRates] = useState(false);
            const [lastRefreshTime, setLastRefreshTime] = useState('');
            const [fetchingStocks, setFetchingStocks] = useState({});
            const [saveStatus, setSaveStatus] = useState('idle'); // 'idle' | 'saving' | 'saved'
            const [hasUnsavedChanges, setHasUnsavedChanges] = useState(false);

            const [expandedPersons, setExpandedPersons] = useState({});
            const [expandedAssets, setExpandedAssets] = useState({});

            const [availableVaults, setAvailableVaults] = useState([]);
            const [currentVaultFile, setCurrentVaultFile] = useState('');
            const [newVaultName, setNewVaultName] = useState('');

            // Admin state
            const [adminVaults, setAdminVaults] = useState([]);
            const [adminActionTarget, setAdminActionTarget] = useState(null);
            const [adminInputVal, setAdminInputVal] = useState('');
            const [adminModalError, setAdminModalError] = useState('');

            // Modals state
            const [deleteTarget, setDeleteTarget] = useState(null);
            const [showDisconnectModal, setShowDisconnectModal] = useState(false);
            const [showSettingsModal, setShowSettingsModal] = useState(false);
            const [settingsTab, setSettingsTab] = useState('password'); // 'password' | 'goal' | 'export'
            const [settingsOldPass, setSettingsOldPass] = useState('');
            const [settingsNewPass, setSettingsNewPass] = useState('');
            const [settingsNewPassConfirm, setSettingsNewPassConfirm] = useState('');
            const [settingsError, setSettingsError] = useState('');
            const [isChangingPassword, setIsChangingPassword] = useState(false);
            const [goalForm, setGoalForm] = useState({ title: '', target: '', currency: 'TRY' });
            const [importPreview, setImportPreview] = useState(null);
            const [importMode, setImportMode] = useState('replace'); // 'replace' | 'merge'
            const [importError, setImportError] = useState('');

            // DCA Buy/Sell Calculator modal state
            const [tradeTarget, setTradeTarget] = useState(null);
            const [tradeMode, setTradeMode] = useState('buy'); // 'buy' | 'sell'
            const [tradeQty, setTradeQty] = useState('');
            const [tradePrice, setTradePrice] = useState('');

            // Refs for race-free async operations
            const toastTimerRef = useRef(null);
            const autoSaveTimerRef = useRef(null);
            const savedBadgeTimerRef = useRef(null);
            const skipNextSaveRef = useRef(true);
            const saveInFlightRef = useRef(false);
            const pendingSaveRef = useRef(false);
            const pendingManualRef = useRef(false);
            const fileShaRef = useRef(null);
            const attemptedStocksRef = useRef(new Set());
            const ratesFetchedForVaultRef = useRef('');

            const latestStateRef = useRef({});
            latestStateRef.current = {
                appState,
                githubConfig,
                portfolio,
                currencyLabels,
                rates,
                vaultHistory,
                vaultGoal,
                vaultPassword,
                currentVaultFile
            };

            const togglePrivacyMode = useCallback(() => {
                setPrivacyMode((prev) => {
                    const next = !prev;
                    localStorage.setItem(PRIVACY_MODE_KEY, next ? '1' : '0');
                    return next;
                });
            }, []);

            const fmtMoney = useCallback((val) => formatMoney(val, privacyMode), [privacyMode]);

            const updateFileSha = useCallback((sha) => {
                fileShaRef.current = sha;
            }, []);

            const showToast = useCallback((message, type = 'success') => {
                if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
                setToast({ show: true, message, type });
                toastTimerRef.current = setTimeout(() => {
                    setToast((prev) => ({ ...prev, show: false }));
                    toastTimerRef.current = null;
                }, 3200);
            }, []);

            const setVaultSession = useCallback((filename, pass) => {
                if (!filename || !pass) return;
                const expiry = Date.now() + SESSION_DURATION_MS;
                localStorage.setItem(VAULT_SESSION_KEY, JSON.stringify({ filename, password: pass, expiry }));
            }, []);

            const clearVaultSession = useCallback(() => {
                localStorage.removeItem(VAULT_SESSION_KEY);
            }, []);

            const cancelAutoSave = useCallback(() => {
                if (autoSaveTimerRef.current) {
                    clearTimeout(autoSaveTimerRef.current);
                    autoSaveTimerRef.current = null;
                }
                pendingSaveRef.current = false;
                pendingManualRef.current = false;
            }, []);

            const closeAllModals = useCallback(() => {
                setDeleteTarget(null);
                setShowDisconnectModal(false);
                setShowSettingsModal(false);
                setAdminActionTarget(null);
                setAdminModalError('');
                setTradeTarget(null);
                setImportPreview(null);
                setImportError('');
                setSettingsOldPass('');
                setSettingsNewPass('');
                setSettingsNewPassConfirm('');
                setSettingsError('');
            }, []);

            const closeSettingsModal = useCallback(() => {
                if (isChangingPassword) return;
                setShowSettingsModal(false);
                setSettingsOldPass('');
                setSettingsNewPass('');
                setSettingsNewPassConfirm('');
                setSettingsError('');
                setImportPreview(null);
                setImportError('');
            }, [isChangingPassword]);

            // Cleanup timers on unmount
            useEffect(() => {
                return () => {
                    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
                    if (autoSaveTimerRef.current) clearTimeout(autoSaveTimerRef.current);
                    if (savedBadgeTimerRef.current) clearTimeout(savedBadgeTimerRef.current);
                };
            }, []);

            // =========================================================================
            // GITHUB SAVE ENGINE (SERIALIZED, ZERO STALE CLOSURES, 409 SAFE)
            // =========================================================================
            const handleSaveToGithub = useCallback(async (isAutoSave = false) => {
                if (autoSaveTimerRef.current) {
                    clearTimeout(autoSaveTimerRef.current);
                    autoSaveTimerRef.current = null;
                }

                if (saveInFlightRef.current) {
                    pendingSaveRef.current = true;
                    if (!isAutoSave) pendingManualRef.current = true;
                    return;
                }

                const snap = latestStateRef.current;
                if (!snap.currentVaultFile || !snap.vaultPassword) return;
                if (snap.appState !== 'app' && snap.appState !== 'admin_panel') return;

                saveInFlightRef.current = true;
                pendingSaveRef.current = false;
                pendingManualRef.current = false;
                if (savedBadgeTimerRef.current) {
                    clearTimeout(savedBadgeTimerRef.current);
                    savedBadgeTimerRef.current = null;
                }
                setSaveStatus('saving');

                const targetFile = snap.currentVaultFile;
                const targetPass = snap.vaultPassword;
                const config = snap.githubConfig;

                const doPut = async (shaToUse) => {
                    const updatedHistory = mergeTodayHistorySnapshot(snap.vaultHistory, snap.portfolio, snap.rates);
                    const jsonString = JSON.stringify({
                        portfolio: snap.portfolio,
                        labels: snap.currencyLabels,
                        rates: snap.rates,
                        history: updatedHistory,
                        goal: snap.vaultGoal
                    });
                    const encryptedPayload = CryptoJS.AES.encrypt(jsonString, targetPass).toString();
                    const vaultPackage = {
                        isEncrypted: true,
                        lastUpdate: new Date().toISOString(),
                        payload: encryptedPayload
                    };
                    const contentBase64 = utf8ToBase64(JSON.stringify(vaultPackage, null, 2));

                    return {
                        updatedHistory,
                        response: await fetch(ghContentsUrl(config, targetFile), {
                            method: 'PUT',
                            headers: ghWriteHeaders(config),
                            body: JSON.stringify({
                                message: isAutoSave ? '🤖 Oto-Kayıt' : `🔒 Kasa güncellendi: ${targetFile}`,
                                content: contentBase64,
                                ...(shaToUse ? { sha: shaToUse } : {})
                            })
                        })
                    };
                };

                try {
                    let putResult = await doPut(fileShaRef.current);
                    let response = putResult.response;

                    // Handle 409 SHA conflict gracefully
                    if (response.status === 409) {
                        if (!isAutoSave) {
                            // User explicitly clicked KAYDET -> fetch latest SHA and retry once
                            const freshRes = await fetch(ghContentsUrl(config, targetFile, true), {
                                headers: ghReadHeaders(config),
                                cache: 'no-store'
                            });
                            if (freshRes.ok) {
                                const freshData = await freshRes.json();
                                if (freshData?.sha) {
                                    updateFileSha(freshData.sha);
                                    putResult = await doPut(freshData.sha);
                                    response = putResult.response;
                                }
                            }
                        } else {
                            setHasUnsavedChanges(true);
                            showToast('Kasa başka bir cihazda güncellenmiş. Kaydetmek için KAYDET butonuna basın.', 'warning');
                            setSaveStatus('idle');
                            return;
                        }
                    }

                    if (!response.ok) {
                        const errJson = await response.json().catch(() => ({}));
                        throw new Error(errJson?.message || 'Kayıt reddedildi.');
                    }

                    const data = await response.json();
                    const stillSameVault =
                        latestStateRef.current.currentVaultFile === targetFile &&
                        latestStateRef.current.vaultPassword === targetPass;

                    if (stillSameVault) {
                        if (data?.content?.sha) updateFileSha(data.content.sha);
                        setVaultHistory(putResult.updatedHistory);
                        setVaultSession(targetFile, targetPass);
                        setHasUnsavedChanges(false);
                        if (!isAutoSave) showToast('Kasa başarıyla senkronize edildi', 'success');
                    }

                    setSaveStatus('saved');
                    savedBadgeTimerRef.current = setTimeout(() => {
                        setSaveStatus('idle');
                        savedBadgeTimerRef.current = null;
                    }, 1800);
                } catch (error) {
                    setHasUnsavedChanges(true);
                    setSaveStatus('idle');
                    if (!isAutoSave) {
                        const msg = String(error?.message || '').toLowerCase().includes('failed to fetch')
                            ? 'İnternet bağlantısı yok. Değişiklikler kaydedilemedi.'
                            : 'Kayıt Hatası! İnternet bağlantınızı veya GitHub yetkinizi kontrol edin.';
                        showToast(msg, 'error');
                    }
                } finally {
                    saveInFlightRef.current = false;
                    if (pendingSaveRef.current) {
                        const nextIsAuto = !pendingManualRef.current;
                        pendingSaveRef.current = false;
                        pendingManualRef.current = false;
                        // Only run queued save if vault is still unlocked
                        if (latestStateRef.current.vaultPassword && latestStateRef.current.currentVaultFile === targetFile) {
                            handleSaveToGithub(nextIsAuto);
                        }
                    }
                }
            }, [showToast, setVaultSession, updateFileSha]);

            // Auto-save watcher
            useEffect(() => {
                if (appState !== 'app' || !vaultPassword || !currentVaultFile) return;

                if (skipNextSaveRef.current) {
                    skipNextSaveRef.current = false;
                    return;
                }

                setHasUnsavedChanges(true);
                if (autoSaveTimerRef.current) clearTimeout(autoSaveTimerRef.current);
                autoSaveTimerRef.current = setTimeout(() => {
                    autoSaveTimerRef.current = null;
                    handleSaveToGithub(true);
                }, 1800);

                return () => {
                    if (autoSaveTimerRef.current) {
                        clearTimeout(autoSaveTimerRef.current);
                        autoSaveTimerRef.current = null;
                    }
                };
            }, [portfolio, currencyLabels, rates, vaultGoal, appState, vaultPassword, currentVaultFile, handleSaveToGithub]);

            // =========================================================================
            // VAULT LISTING & AUTH
            // =========================================================================
            const fetchAvailableVaults = useCallback(async (configOverride = null, preserveError = false) => {
                const config = configOverride || latestStateRef.current.githubConfig;
                cancelAutoSave();
                setAppState('loading_vaults');
                if (!preserveError) setAuthError('');
                try {
                    const response = await fetch(ghContentsUrl(config, '', true), {
                        headers: ghReadHeaders(config),
                        cache: 'no-store'
                    });

                    if (response.status === 404) {
                        setAvailableVaults([]);
                        setAppState('select_vault');
                        return;
                    }
                    if (response.status === 401 || response.status === 403) {
                        throw new Error('GitHub Token geçersiz veya depo erişim yetkisi yok.');
                    }
                    if (!response.ok) throw new Error('GitHub erişimi reddedildi.');

                    const files = await response.json();
                    const fileList = Array.isArray(files) ? files : [];

                    const vaults = fileList
                        .filter((f) => f?.name && f.name.startsWith('vault_') && !f.name.startsWith('vault_locked_') && f.name.endsWith('.json'))
                        .map((f) => ({
                            name: getVaultDisplayName(f.name),
                            filename: f.name
                        }))
                        .sort((a, b) => a.name.localeCompare(b.name, 'tr'));

                    if (fileList.some((f) => f?.name === 'data.json')) {
                        vaults.unshift({ name: 'Ana Kasa (Legacy)', filename: 'data.json' });
                    }

                    setAvailableVaults(vaults);
                    setAppState('select_vault');
                } catch (err) {
                    const msg = String(err?.message || '').toLowerCase().includes('failed to fetch')
                        ? 'Ağa bağlanılamadı. İnternet bağlantınızı kontrol edin.'
                        : (err?.message || 'Erişim Reddedildi.');
                    setAuthError(msg);
                    setFormConfig(config);
                    setAppState('setup_github');
                }
            }, [cancelAutoSave]);

            const handleAuth = useCallback(async (e, directPassword = null, directFilename = null, configOverride = null, isAutoLogin = false) => {
                if (e) e.preventDefault();
                const pass = directPassword !== null ? directPassword : passwordInput;
                const fileToFetch = directFilename || currentVaultFile;
                const config = configOverride || latestStateRef.current.githubConfig;

                if (!fileToFetch) {
                    fetchAvailableVaults(config);
                    return;
                }
                if (!pass) {
                    setAuthError('Şifre boş olamaz.');
                    return;
                }

                // Aggressively wipe previous vault state before fetching so zero data ever flashes
                cancelAutoSave();
                closeAllModals();
                setAuthError('');
                setPortfolio([]);
                setVaultPassword('');
                updateFileSha(null);
                setHasUnsavedChanges(false);
                setSaveStatus('idle');
                attemptedStocksRef.current.clear();
                ratesFetchedForVaultRef.current = '';
                setCurrentVaultFile(fileToFetch);
                setAppState('loading_vault');

                try {
                    const response = await fetch(ghContentsUrl(config, fileToFetch, true), {
                        headers: ghReadHeaders(config),
                        cache: 'no-store'
                    });

                    if (response.status === 404) {
                        clearVaultSession();
                        showToast('Seçilen kasa bulunamadı veya yönetici tarafından dondurulmuş.', 'error');
                        await fetchAvailableVaults(config);
                        return;
                    }
                    if (response.status === 401 || response.status === 403) {
                        clearVaultSession();
                        setAuthError('GitHub erişim tokenı geçersiz veya süresi dolmuş.');
                        setFormConfig(config);
                        setAppState('setup_github');
                        return;
                    }
                    if (!response.ok) throw new Error('GitHub erişimi reddedildi.');

                    const data = await response.json();
                    const decodedContent = base64ToUtf8(data.content);
                    const vaultData = safeJsonParse(decodedContent, null);

                    if (!vaultData || !vaultData.isEncrypted || !vaultData.payload) {
                        throw new Error('Kasa dosya formatı geçersiz veya bozuk.');
                    }

                    let parsedData;
                    try {
                        const vBytes = CryptoJS.AES.decrypt(vaultData.payload, pass);
                        const decryptedString = vBytes.toString(CryptoJS.enc.Utf8);
                        if (!decryptedString) throw new Error('empty');
                        parsedData = JSON.parse(decryptedString);
                    } catch {
                        throw new Error('Kasa Şifresi Yanlış');
                    }

                    const rawPortfolio = Array.isArray(parsedData) ? parsedData : (parsedData?.portfolio || []);
                    const finalPortfolio = sanitizePortfolioData(rawPortfolio);

                    const mergedLabels = { ...DEFAULT_LABELS };
                    if (parsedData && !Array.isArray(parsedData) && parsedData.labels && typeof parsedData.labels === 'object') {
                        Object.assign(mergedLabels, parsedData.labels);
                        if (!mergedLabels.STOCK) mergedLabels.STOCK = 'Hisse';
                    }

                    const mergedRates = { ...DEFAULT_RATES };
                    if (parsedData && !Array.isArray(parsedData) && parsedData.rates && typeof parsedData.rates === 'object') {
                        Object.entries(parsedData.rates).forEach(([k, v]) => {
                            const n = safeParseNum(v);
                            if (n > 0) mergedRates[k] = n;
                        });
                    }

                    const expandedInit = {};
                    finalPortfolio.forEach((p) => { expandedInit[p.id] = true; });
                    const loadedHistory = (parsedData && !Array.isArray(parsedData) && Array.isArray(parsedData.history))
                        ? parsedData.history
                        : [];
                    const loadedGoal = (parsedData && !Array.isArray(parsedData) && parsedData.goal && typeof parsedData.goal === 'object')
                        ? {
                            title: String(parsedData.goal.title || ''),
                            target: parsedData.goal.target ?? '',
                            currency: ['TRY', 'USD', 'EUR', 'GRAM'].includes(parsedData.goal.currency) ? parsedData.goal.currency : 'TRY'
                        }
                        : { title: '', target: '', currency: 'TRY' };

                    // Prevent initial hydration from triggering a redundant auto-save
                    skipNextSaveRef.current = true;
                    updateFileSha(data.sha);
                    setPortfolio(finalPortfolio);
                    setVaultHistory(loadedHistory);
                    setVaultGoal(loadedGoal);
                    setSearchQuery('');
                    setActiveTypeFilter(null);
                    setCurrencyLabels(mergedLabels);
                    setRates(mergedRates);
                    setExpandedPersons(expandedInit);
                    setExpandedAssets({});
                    setVaultPassword(pass);
                    setPasswordInput('');
                    setCurrentVaultFile(fileToFetch);
                    setVaultSession(fileToFetch, pass);
                    setAppState('app');
                } catch (err) {
                    const errMsg = String(err?.message || '');
                    const isNetworkErr = errMsg.toLowerCase().includes('failed to fetch');

                    if (!isNetworkErr) {
                        clearVaultSession();
                    }

                    setAuthError(
                        isNetworkErr
                            ? 'Ağa bağlanılamadı. İnternet bağlantınızı kontrol edin.'
                            : (errMsg || 'Erişim Reddedildi.')
                    );
                    setPasswordInput('');
                    setAppState('enter_password');
                }
            }, [passwordInput, currentVaultFile, cancelAutoSave, closeAllModals, updateFileSha, clearVaultSession, showToast, fetchAvailableVaults, setVaultSession]);

            const lockVault = useCallback((toastMsg = null, toastType = 'error') => {
                cancelAutoSave();
                closeAllModals();
                setVaultPassword('');
                setPasswordInput('');
                setPortfolio([]);
                setVaultHistory([]);
                setVaultGoal({ title: '', target: '', currency: 'TRY' });
                setSearchQuery('');
                setActiveTypeFilter(null);
                setLastRefreshTime('');
                setAdminVaults([]);
                setCurrencyLabels({ ...DEFAULT_LABELS });
                setRates({ ...DEFAULT_RATES });
                setExpandedPersons({});
                setExpandedAssets({});
                updateFileSha(null);
                setHasUnsavedChanges(false);
                setSaveStatus('idle');
                attemptedStocksRef.current.clear();
                ratesFetchedForVaultRef.current = '';
                clearVaultSession();
                if (toastMsg) showToast(toastMsg, toastType);
                fetchAvailableVaults();
            }, [cancelAutoSave, closeAllModals, updateFileSha, clearVaultSession, showToast, fetchAvailableVaults]);

            // =========================================================================
            // STARTUP INIT, IDLE TIMEOUT (15m) & SESSION EXPIRY CHECK (30m)
            // =========================================================================
            useEffect(() => {
                const init = async () => {
                    const parsedConfig = safeJsonParse(localStorage.getItem(GH_CONFIG_KEY), null);
                    if (parsedConfig && parsedConfig.username && parsedConfig.repo && parsedConfig.token) {
                        setGithubConfig(parsedConfig);
                        setFormConfig(parsedConfig);

                        const session = safeJsonParse(localStorage.getItem(VAULT_SESSION_KEY), null);
                        if (session && Date.now() < session.expiry && session.filename && session.password) {
                            await handleAuth(null, session.password, session.filename, parsedConfig, true);
                        } else {
                            clearVaultSession();
                            await fetchAvailableVaults(parsedConfig);
                        }
                    } else {
                        localStorage.removeItem('gh_config_v4');
                        localStorage.removeItem('gh_config_v3');
                        clearVaultSession();
                        setAppState('setup_github');
                    }
                };
                init();
            }, []);

            // 15-minute Idle Auto-Logout & Mobile Wake-up 30-minute Session Enforcement
            useEffect(() => {
                if (appState !== 'app' && appState !== 'admin_panel') return;

                let idleTimer = null;
                const events = ['mousemove', 'mousedown', 'keydown', 'scroll', 'touchstart', 'wheel'];

                const resetTimer = () => {
                    if (idleTimer) clearTimeout(idleTimer);
                    idleTimer = setTimeout(() => {
                        lockVault('Hareketsizlik sebebiyle oturum otomatik kilitlendi.', 'error');
                    }, IDLE_TIMEOUT_MS);
                };

                const handleVisibilityChange = () => {
                    if (document.visibilityState === 'visible') {
                        const session = safeJsonParse(localStorage.getItem(VAULT_SESSION_KEY), null);
                        if (!session || Date.now() >= session.expiry) {
                            lockVault('30 dakikalık oturum süresi doldu. Lütfen tekrar giriş yapın.', 'warning');
                        } else {
                            resetTimer();
                        }
                    }
                };

                resetTimer();
                events.forEach((ev) => window.addEventListener(ev, resetTimer, { passive: true }));
                document.addEventListener('visibilitychange', handleVisibilityChange);

                return () => {
                    if (idleTimer) clearTimeout(idleTimer);
                    events.forEach((ev) => window.removeEventListener(ev, resetTimer));
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                };
            }, [appState, lockVault]);

            // =========================================================================
            // LIVE MARKET RATES & BIST STOCK PRICES (NO STALE OVERWRITES)
            // =========================================================================
            const applyBatchStockPricesToPortfolio = useCallback((priceMap) => {
                if (!priceMap || Object.keys(priceMap).length === 0) return false;
                let anyChanged = false;

                setPortfolio((prev) => {
                    const next = prev.map((person) => {
                        let personChanged = false;
                        const nextAssets = person.assets.map((asset) => {
                            let assetChanged = false;
                            let updatedAsset = asset;

                            if ((!asset.subItems || asset.subItems.length === 0) && asset.type === 'STOCK' && asset.name) {
                                const sym = normalizeBistTicker(asset.name);
                                if (sym && priceMap[sym] !== undefined) {
                                    if (safeParseNum(asset.currentPrice) !== priceMap[sym] || asset._lastFetchedTicker !== sym) {
                                        updatedAsset = { ...updatedAsset, currentPrice: priceMap[sym], _lastFetchedTicker: sym };
                                        assetChanged = true;
                                    }
                                }
                            }

                            if (asset.subItems && asset.subItems.length > 0) {
                                let subChanged = false;
                                const nextSubs = asset.subItems.map((sub) => {
                                    if (sub.type === 'STOCK' && sub.name) {
                                        const sym = normalizeBistTicker(sub.name);
                                        if (sym && priceMap[sym] !== undefined) {
                                            if (safeParseNum(sub.currentPrice) !== priceMap[sym] || sub._lastFetchedTicker !== sym) {
                                                subChanged = true;
                                                return { ...sub, currentPrice: priceMap[sym], _lastFetchedTicker: sym };
                                            }
                                        }
                                    }
                                    return sub;
                                });
                                if (subChanged) {
                                    updatedAsset = { ...updatedAsset, subItems: nextSubs };
                                    assetChanged = true;
                                }
                            }

                            if (assetChanged) {
                                personChanged = true;
                                return updatedAsset;
                            }
                            return asset;
                        });

                        if (personChanged) {
                            anyChanged = true;
                            return { ...person, assets: nextAssets };
                        }
                        return person;
                    });

                    return anyChanged ? next : prev;
                });

                return anyChanged;
            }, []);

            const fetchLiveRates = useCallback(async (isManual = false) => {
                setIsLoadingRates(true);

                // Collect every BIST stock (both top-level assets AND all sub-items)
                const currentPortfolio = latestStateRef.current.portfolio || [];
                const stockEntries = [];
                currentPortfolio.forEach((p) => {
                    (p.assets || []).forEach((a) => {
                        const hasSubs = a.subItems && a.subItems.length > 0;
                        if (!hasSubs && a.type === 'STOCK' && a.name) {
                            const sym = normalizeBistTicker(a.name);
                            if (sym) stockEntries.push({ id: a.id, sym });
                        }
                        if (hasSubs) {
                            a.subItems.forEach((s) => {
                                if (s.type === 'STOCK' && s.name) {
                                    const sym = normalizeBistTicker(s.name);
                                    if (sym) stockEntries.push({ id: s.id, sym });
                                }
                            });
                        }
                    });
                });

                if (isManual) {
                    attemptedStocksRef.current.clear();
                }

                // Mark all stock items as refreshing so their icons spin
                if (stockEntries.length > 0) {
                    setFetchingStocks((prev) => {
                        const next = { ...prev };
                        stockEntries.forEach((e) => { next[e.id] = true; });
                        return next;
                    });
                }

                let ratesOk = false;
                let updatedStockItems = 0;
                let failedSymbols = [];

                try {
                    const endpoints = [
                        'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json',
                        'https://latest.currency-api.pages.dev/v1/currencies/usd.json'
                    ];

                    const fetchFxPromise = (async () => {
                        let data = null;
                        for (const url of endpoints) {
                            try {
                                const res = await fetch(url);
                                if (res.ok) {
                                    data = await res.json();
                                    if (data?.usd?.try) break;
                                }
                            } catch { }
                        }
                        return data;
                    })();

                    const fetchStocksPromise = stockEntries.length > 0
                        ? fetchTurkishStockPricesBatch(stockEntries.map((e) => e.sym))
                        : Promise.resolve({});

                    const [data, stockPrices] = await Promise.all([fetchFxPromise, fetchStocksPromise]);

                    if (data?.usd?.try && Number.isFinite(data.usd.try) && data.usd.try > 0) {
                        ratesOk = true;
                        const usdTry = data.usd.try;
                        const eurPerUsd = data.usd.eur;
                        const gbpPerUsd = data.usd.gbp;
                        const xauPerUsd = data.usd.xau;
                        const xagPerUsd = data.usd.xag;
                        const btcPerUsd = data.usd.btc;

                        const nextUsd = parseFloat(usdTry.toFixed(2));
                        const nextEur = (Number.isFinite(eurPerUsd) && eurPerUsd > 0)
                            ? parseFloat((usdTry / eurPerUsd).toFixed(2))
                            : null;
                        const nextGbp = (Number.isFinite(gbpPerUsd) && gbpPerUsd > 0)
                            ? parseFloat((usdTry / gbpPerUsd).toFixed(2))
                            : null;

                        let nextGram = null;
                        let nextCeyrek = null;
                        let nextAta = null;
                        if (Number.isFinite(xauPerUsd) && xauPerUsd > 0) {
                            const xauUsd = 1 / xauPerUsd;
                            const spotGramGoldUsd = xauUsd / 31.1034768;
                            const spotGramGoldTry = spotGramGoldUsd * usdTry;
                            const physicalPremium = 1.045;
                            nextGram = parseFloat((spotGramGoldTry * physicalPremium).toFixed(2));
                            nextCeyrek = parseFloat((nextGram * 1.63).toFixed(2));
                            nextAta = parseFloat((nextGram * 6.88).toFixed(2));
                        }

                        let nextSilver = null;
                        if (Number.isFinite(xagPerUsd) && xagPerUsd > 0) {
                            const xagUsd = 1 / xagPerUsd;
                            nextSilver = parseFloat(((xagUsd / 31.1034768) * usdTry * 1.045).toFixed(2));
                        }

                        let nextBtc = null;
                        if (Number.isFinite(btcPerUsd) && btcPerUsd > 0) {
                            nextBtc = Math.round((1 / btcPerUsd) * usdTry);
                        }

                        setRates((prev) => {
                            const updated = {
                                ...prev,
                                USD: nextUsd,
                                EUR: nextEur ?? prev.EUR,
                                GBP: nextGbp ?? prev.GBP,
                                GRAM: nextGram ?? prev.GRAM,
                                CEYREK: nextCeyrek ?? prev.CEYREK,
                                ATA: nextAta ?? prev.ATA,
                                SILVER: nextSilver ?? prev.SILVER,
                                BTC: nextBtc ?? prev.BTC
                            };
                            const keys = ['USD', 'EUR', 'GBP', 'GRAM', 'CEYREK', 'ATA', 'SILVER', 'BTC'];
                            if (keys.every((k) => updated[k] === prev[k])) {
                                return prev;
                            }
                            return updated;
                        });
                    }

                    if (stockEntries.length > 0) {
                        const uniqueSyms = [...new Set(stockEntries.map((e) => e.sym))];
                        failedSymbols = uniqueSyms.filter((sym) => stockPrices[sym] === undefined);
                        updatedStockItems = stockEntries.filter((e) => stockPrices[e.sym] !== undefined).length;
                        if (Object.keys(stockPrices).length > 0) {
                            applyBatchStockPricesToPortfolio(stockPrices);
                        }
                    }

                    if (!ratesOk && updatedStockItems === 0) {
                        throw new Error('Piyasa verileri alınamadı');
                    }

                    const nowStr = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
                    setLastRefreshTime(nowStr);

                    if (isManual) {
                        if (stockEntries.length > 0) {
                            const baseMsg = ratesOk
                                ? `Kurlar ve ${updatedStockItems} hisse/alt kalem güncellendi`
                                : `${updatedStockItems} hisse/alt kalem güncellendi (kurlar alınamadı)`;
                            if (failedSymbols.length > 0) {
                                showToast(`${baseMsg} (${failedSymbols.slice(0, 3).join(', ')} bulunamadı)`, 'warning');
                            } else {
                                showToast(baseMsg, ratesOk ? 'success' : 'warning');
                            }
                        } else {
                            showToast('Tüm piyasa kurları ve alt kalem değerleri güncellendi', 'success');
                        }
                    }
                } catch (err) {
                    console.error('Fiyat çekme hatası:', err);
                    showToast('Kurlar güncellenemedi, mevcut değerler korunuyor', 'error');
                } finally {
                    setIsLoadingRates(false);
                    if (stockEntries.length > 0) {
                        setFetchingStocks((prev) => {
                            const next = { ...prev };
                            stockEntries.forEach((e) => { delete next[e.id]; });
                            return next;
                        });
                    }
                }
            }, [applyBatchStockPricesToPortfolio, showToast]);

            // Auto-fetch live rates once per opened vault
            useEffect(() => {
                if (appState !== 'app' || !currentVaultFile) return;
                if (ratesFetchedForVaultRef.current === currentVaultFile) return;

                ratesFetchedForVaultRef.current = currentVaultFile;
                const timer = setTimeout(() => {
                    fetchLiveRates(false);
                }, 400);
                return () => clearTimeout(timer);
            }, [appState, currentVaultFile, fetchLiveRates]);

            // Auto-fetch BIST price ONLY when a new stock ticker is entered (deduplicated, zero stale overwrite)
            useEffect(() => {
                if (appState !== 'app' || !portfolio.length) return;

                const tickersToFetch = [];
                portfolio.forEach((person) => {
                    (person.assets || []).forEach((asset) => {
                        if ((!asset.subItems || asset.subItems.length === 0) && asset.type === 'STOCK' && asset.name) {
                            const sym = normalizeBistTicker(asset.name);
                            const key = `${asset.id}:${sym}`;
                            if (sym && asset._lastFetchedTicker !== sym && !attemptedStocksRef.current.has(key)) {
                                attemptedStocksRef.current.add(key);
                                tickersToFetch.push(sym);
                            }
                        }
                        (asset.subItems || []).forEach((sub) => {
                            if (sub.type === 'STOCK' && sub.name) {
                                const sym = normalizeBistTicker(sub.name);
                                const key = `${sub.id}:${sym}`;
                                if (sym && sub._lastFetchedTicker !== sym && !attemptedStocksRef.current.has(key)) {
                                    attemptedStocksRef.current.add(key);
                                    tickersToFetch.push(sym);
                                }
                            }
                        });
                    });
                });

                if (tickersToFetch.length === 0) return;

                let cancelled = false;
                fetchTurkishStockPricesBatch(tickersToFetch).then((priceMap) => {
                    if (!cancelled && Object.keys(priceMap).length > 0) {
                        applyBatchStockPricesToPortfolio(priceMap);
                    }
                });

                return () => { cancelled = true; };
            }, [portfolio, appState, applyBatchStockPricesToPortfolio]);

            const forceFetchStockPrice = useCallback(async (personId, assetId, subId = null) => {
                const currentPortfolio = latestStateRef.current.portfolio || [];
                const person = currentPortfolio.find((p) => p.id === personId);
                const asset = person?.assets?.find((a) => a.id === assetId);
                const target = subId ? asset?.subItems?.find((s) => s.id === subId) : asset;

                if (!target || target.type !== 'STOCK' || !target.name) {
                    showToast('Önce geçerli bir hisse sembolü (örn: THYAO) girin.', 'warning');
                    return;
                }

                const sym = normalizeBistTicker(target.name);
                if (!sym) {
                    showToast('Geçerli bir BIST sembolü bulunamadı.', 'error');
                    return;
                }

                const fetchKey = subId || assetId;
                setFetchingStocks((prev) => ({ ...prev, [fetchKey]: true }));

                try {
                    const price = await fetchTurkishStockPrice(sym);
                    if (price !== null) {
                        setPortfolio((prev) =>
                            prev.map((p) => {
                                if (p.id !== personId) return p;
                                return {
                                    ...p,
                                    assets: p.assets.map((a) => {
                                        if (a.id !== assetId) return a;
                                        if (subId) {
                                            return {
                                                ...a,
                                                subItems: (a.subItems || []).map((s) =>
                                                    s.id === subId ? { ...s, currentPrice: price, _lastFetchedTicker: sym } : s
                                                )
                                            };
                                        }
                                        return { ...a, currentPrice: price, _lastFetchedTicker: sym };
                                    })
                                };
                            })
                        );
                        showToast(`${sym} güncel fiyatı: ${price} ₺`, 'success');
                    } else {
                        showToast(`${sym} için fiyat çekilemedi. Sembolü kontrol edin.`, 'error');
                    }
                } finally {
                    setFetchingStocks((prev) => {
                        const next = { ...prev };
                        delete next[fetchKey];
                        return next;
                    });
                }
            }, [showToast]);

            const forceFetchAssetSubStocks = useCallback(async (personId, assetId) => {
                const currentPortfolio = latestStateRef.current.portfolio || [];
                const person = currentPortfolio.find((p) => p.id === personId);
                const asset = person?.assets?.find((a) => a.id === assetId);
                const stockSubs = (asset?.subItems || [])
                    .filter((s) => s.type === 'STOCK' && s.name)
                    .map((s) => ({ id: s.id, sym: normalizeBistTicker(s.name) }))
                    .filter((x) => x.sym);

                if (stockSubs.length === 0) {
                    showToast('Bu varlıkta güncellenecek geçerli hisse alt kalemi yok.', 'warning');
                    return;
                }

                setFetchingStocks((prev) => {
                    const next = { ...prev, [assetId]: true };
                    stockSubs.forEach((s) => { next[s.id] = true; });
                    return next;
                });

                try {
                    const priceMap = await fetchTurkishStockPricesBatch(stockSubs.map((s) => s.sym));
                    const updatedCount = stockSubs.filter((s) => priceMap[s.sym] !== undefined).length;
                    if (updatedCount > 0) {
                        applyBatchStockPricesToPortfolio(priceMap);
                        showToast(`${asset.name || 'Varlık'}: ${updatedCount} alt kalem güncellendi`, 'success');
                    } else {
                        showToast('Alt kalemler için hisse fiyatı çekilemedi.', 'error');
                    }
                } finally {
                    setFetchingStocks((prev) => {
                        const next = { ...prev };
                        delete next[assetId];
                        stockSubs.forEach((s) => { delete next[s.id]; });
                        return next;
                    });
                }
            }, [applyBatchStockPricesToPortfolio, showToast]);

            // =========================================================================
            // ADMIN PANEL ACTIONS (LEGACY MAIN VAULT ONLY)
            // =========================================================================
            const fetchAdminVaults = useCallback(async () => {
                if (latestStateRef.current.currentVaultFile !== 'data.json') return;
                const config = latestStateRef.current.githubConfig;
                setAppState('admin_loading');
                try {
                    const response = await fetch(ghContentsUrl(config, '', true), {
                        headers: ghReadHeaders(config),
                        cache: 'no-store'
                    });
                    if (!response.ok) throw new Error('Depo içeriği okunamadı.');

                    const files = await response.json();
                    const fileList = Array.isArray(files) ? files : [];
                    const targetFiles = fileList.filter(
                        (f) => f?.name && (f.name.startsWith('vault_') || f.name === 'data.json') && f.name.endsWith('.json')
                    );

                    const detailedVaults = await Promise.all(targetFiles.map(async (f) => {
                        const isLocked = f.name.startsWith('vault_locked_');
                        const detail = {
                            name: getVaultDisplayName(f.name),
                            filename: f.name,
                            isLocked,
                            lastUpdate: 'Bilinmiyor',
                            sha: f.sha
                        };

                        try {
                            const fRes = await fetch(ghContentsUrl(config, f.name, true), {
                                headers: ghReadHeaders(config),
                                cache: 'no-store'
                            });
                            if (fRes.ok) {
                                const fData = await fRes.json();
                                detail.sha = fData.sha;
                                const decoded = safeJsonParse(base64ToUtf8(fData.content), null);
                                if (decoded?.lastUpdate) {
                                    const d = new Date(decoded.lastUpdate);
                                    if (!isNaN(d.getTime())) {
                                        detail.lastUpdate = d.toLocaleString('tr-TR', {
                                            day: '2-digit',
                                            month: '2-digit',
                                            year: 'numeric',
                                            hour: '2-digit',
                                            minute: '2-digit'
                                        });
                                    }
                                }
                            }
                        } catch { }

                        return detail;
                    }));

                    detailedVaults.sort((a, b) => {
                        if (a.filename === 'data.json') return -1;
                        if (b.filename === 'data.json') return 1;
                        if (a.isLocked !== b.isLocked) return a.isLocked ? 1 : -1;
                        return a.name.localeCompare(b.name, 'tr');
                    });

                    setAdminVaults(detailedVaults);
                    setAppState('admin_panel');
                } catch (e) {
                    showToast('Yönetim paneline ulaşılamadı: ' + (e?.message || ''), 'error');
                    setAppState('app');
                }
            }, [showToast]);

            const executeAdminAction = async (type, e = null) => {
                if (e) e.preventDefault();
                const target = adminActionTarget;
                if (!target?.vault || target.vault.filename === 'data.json') return;

                // Validate inputs BEFORE closing modal or switching to loading screen
                let validatedRename = null;
                if (type === 'rename') {
                    const check = validateVaultName(adminInputVal);
                    if (!check.ok) {
                        setAdminModalError(check.error);
                        return;
                    }
                    const candidateFile = target.vault.isLocked
                        ? `vault_locked_${check.name}.json`
                        : `vault_${check.name}.json`;
                    if (candidateFile === target.vault.filename) {
                        setAdminModalError('Yeni isim mevcut isimle aynı.');
                        return;
                    }
                    const collision = adminVaults.some(
                        (v) =>
                            v.filename !== target.vault.filename &&
                            v.name.toLocaleLowerCase('tr-TR') === check.name.toLocaleLowerCase('tr-TR')
                    );
                    if (collision) {
                        setAdminModalError('Bu isimde başka bir kasa zaten mevcut.');
                        return;
                    }
                    validatedRename = { name: check.name, filename: candidateFile };
                } else if (type === 'reset_password') {
                    if (adminInputVal.length < 4) {
                        setAdminModalError('Yeni şifre en az 4 karakter olmalıdır.');
                        return;
                    }
                }

                setAdminModalError('');
                setAdminActionTarget(null);
                setAppState('admin_loading');

                const config = latestStateRef.current.githubConfig;

                const getFileRaw = async (filename) => {
                    const res = await fetch(ghContentsUrl(config, filename, true), {
                        headers: ghReadHeaders(config),
                        cache: 'no-store'
                    });
                    if (!res.ok) throw new Error('Dosya GitHub üzerinden okunamadı.');
                    return res.json();
                };

                const putFile = async (filename, contentBase64, message, existingSha = null) => {
                    const bodyData = { message, content: String(contentBase64).replace(/\s/g, '') };
                    if (existingSha) bodyData.sha = existingSha;
                    const res = await fetch(ghContentsUrl(config, filename), {
                        method: 'PUT',
                        headers: ghWriteHeaders(config),
                        body: JSON.stringify(bodyData)
                    });
                    if (!res.ok) {
                        const errJson = await res.json().catch(() => ({}));
                        throw new Error(errJson?.message || 'GitHub yazma hatası.');
                    }
                };

                    }

                try {
                    if (type === 'delete') {

            // =========================================================================

                                    ].map(esc).join(';'));

                                const cost = safeParseNum(a.costPrice);
                                const unit = getItemUnitRate(a, snap.rates);
                                const total = qty * unit;
                                const pnl = calculatePnL(a.amount, snap.rates[a.type], a.costPrice, a.type, a.currentPrice);
                                rows.push([

            const handleImportFileChange = (e) => {
                const file = e.target.files?.[0];
                e.target.value = '';
                setImportError('');
                setImportPreview(null);
                setImportMode('replace');
                if (!file) return;

                const isCsv = file.name.toLowerCase().endsWith('.csv');

                const resolveTypeFromLabel = (rawType) => {
                    const cleaned = normalizeTurkishSearch(rawType).trim();
                    const entries = Object.entries({ ...DEFAULT_LABELS, ...latestStateRef.current.currencyLabels });
                    const directKey = Object.keys(DEFAULT_LABELS).find((k) => k.toLowerCase() === cleaned);
                    if (directKey) return directKey;
                    const matched = entries.find(([, lbl]) => normalizeTurkishSearch(lbl).trim() === cleaned);
                    if (matched) return matched[0];
                    if (cleaned.includes('hisse') || cleaned.includes('stock')) return 'STOCK';
                    if (cleaned.includes('dolar') || cleaned.includes('usd')) return 'USD';
                    if (cleaned.includes('euro') || cleaned.includes('eur')) return 'EUR';
                    if (cleaned.includes('sterlin') || cleaned.includes('gbp')) return 'GBP';
                    if (cleaned.includes('ceyrek')) return 'CEYREK';
                    if (cleaned.includes('ata')) return 'ATA';
                    if (cleaned.includes('gram') || cleaned.includes('altin')) return 'GRAM';
                    if (cleaned.includes('gumus') || cleaned.includes('silver')) return 'SILVER';
                    if (cleaned.includes('btc') || cleaned.includes('bitcoin')) return 'BTC';
                    return 'TRY';
                };

                const parseCsvRow = (line, delim) => {
                    const cols = [];
                    let cur = '';
                    let inQuotes = false;
                    for (let i = 0; i < line.length; i++) {
                        const ch = line[i];
                        if (inQuotes) {
                            if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; }
                            else if (ch === '"') inQuotes = false;
                            else cur += ch;
                        } else {
                            if (ch === '"') inQuotes = true;
                            else if (ch === delim) { cols.push(cur.trim()); cur = ''; }
                            else cur += ch;
                        }
                    }
                    cols.push(cur.trim());
                    return cols;
                };

                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const rawText = String(reader.result || '').replace(/^\uFEFF/, '').trim();
                        if (!rawText) throw new Error('Dosya boş.');

                        if (isCsv || (!rawText.startsWith('{') && !rawText.startsWith('['))) {
                            const lines = rawText.split(/\r?\n/).filter((l) => l.trim().length > 0);
                            if (lines.length < 2) throw new Error('CSV dosyasında veri satırı bulunamadı.');
                            const delim = lines[0].includes(';') ? ';' : ',';
                            const personMap = new Map();

                            for (let i = 1; i < lines.length; i++) {
                                const cols = parseCsvRow(lines[i], delim);
                                if (cols.length < 5) continue;
                                const [pName, aName, subName, typeStr, qtyStr, costStr, currStr, , , , statusStr] = cols;
                                const personKey = pName || 'İçe Aktarılan Portföy';
                                if (!personMap.has(personKey)) {
                                    personMap.set(personKey, { id: generateId('person'), person: personKey, isHidden: false, assets: [] });
                                }
                                const personObj = personMap.get(personKey);
                                const type = resolveTypeFromLabel(typeStr);
                                const qty = safeParseNum(qtyStr);
                                const cost = safeParseNum(costStr);
                                const curr = safeParseNum(currStr);
                                const isHidden = normalizeTurkishSearch(statusStr || '').includes('gizli');

                                if (subName) {
                                    let parentAsset = personObj.assets.find((a) => a.name === (aName || 'Varlık') && Array.isArray(a.subItems));
                                    if (!parentAsset) {
                                        parentAsset = { id: generateId('asset'), name: aName || 'Varlık', type: 'TRY', amount: '', costPrice: '', currentPrice: '', isHidden, subItems: [] };
                                        personObj.assets.push(parentAsset);
                                    }
                                    parentAsset.subItems.push({
                                        id: generateId('sub'),
                                        name: subName,
                                        type,
                                        amount: qty > 0 ? String(qty) : '',
                                        costPrice: cost > 0 ? String(cost) : '',
                                        currentPrice: type === 'STOCK' && curr > 0 ? String(curr) : ''
                                    });
                                } else {
                                    personObj.assets.push({
                                        id: generateId('asset'),
                                        name: aName || 'Varlık',
                                        type,
                                        amount: qty > 0 ? String(qty) : '',
                                        costPrice: cost > 0 ? String(cost) : '',
                                        currentPrice: type === 'STOCK' && curr > 0 ? String(curr) : '',
                                        isHidden,
                                        subItems: []
                                    });
                                }
                            }

                            const sanitized = sanitizePortfolioData(Array.from(personMap.values()));
                            if (sanitized.length === 0) throw new Error('CSV içinden geçerli portföy okunamadı.');
                            const assetCount = sanitized.reduce((acc, p) => acc + p.assets.length, 0);
                            setImportPreview({
                                format: 'CSV',
                                portfolio: sanitized,
                                rates: null,
                                labels: null,
                                history: null,
                                goal: null,
                                personCount: sanitized.length,
                                assetCount,
                                filename: file.name
                            });
                            return;
                        }

                        const parsed = JSON.parse(rawText);
                        const rawPortfolio = Array.isArray(parsed) ? parsed : parsed?.portfolio;
                        if (!Array.isArray(rawPortfolio)) {
                            throw new Error('Geçerli portföy dizisi bulunamadı.');
                        }
                        const sanitized = sanitizePortfolioData(rawPortfolio);
                        const assetCount = sanitized.reduce((acc, p) => acc + p.assets.length, 0);
                        setImportPreview({
                            format: 'JSON',
                            portfolio: sanitized,
                            rates: (parsed && !Array.isArray(parsed) && parsed.rates && typeof parsed.rates === 'object') ? parsed.rates : null,
                            labels: (parsed && !Array.isArray(parsed) && (parsed.currencyLabels || parsed.labels)) || null,
                            history: (parsed && !Array.isArray(parsed) && Array.isArray(parsed.history)) ? parsed.history : null,
                            goal: (parsed && !Array.isArray(parsed) && parsed.goal && typeof parsed.goal === 'object') ? parsed.goal : null,
                            personCount: sanitized.length,
                            assetCount,
                            filename: file.name
                        });
                    } catch (err) {
                        setImportError('Geçersiz dosya: ' + (err?.message || 'Okunamadı'));
                    }
                };
                reader.onerror = () => setImportError('Dosya okunamadı.');
                reader.readAsText(file, 'UTF-8');
            };

            const confirmImportBackup = () => {

                    const clonedWithFreshIds = importPreview.portfolio.map((p) => ({
