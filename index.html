            const saveGithubConfig = async (e) => {
                e.preventDefault();
                const cleanedConfig = {
                    username: formConfig.username.trim(),
                    repo: formConfig.repo.trim(),
                    token: cleanTokenStr(formConfig.token)
                };
                if (!cleanedConfig.username || !cleanedConfig.repo || !cleanedConfig.token) {
                    setAuthError('Tüm GitHub alanlarını doldurmalısınız.');
                    return;
                }
                localStorage.setItem(GH_CONFIG_KEY, JSON.stringify(cleanedConfig));
                clearVaultSession();
                setGithubConfig(cleanedConfig);
                setFormConfig(cleanedConfig);
                await fetchAvailableVaults(cleanedConfig, false, true);
            };

            const confirmDisconnectGithub = () => {
                cancelAutoSave();
                closeAllModals();
                localStorage.removeItem(GH_CONFIG_KEY);
                localStorage.removeItem('gh_config_v4');
                localStorage.removeItem('gh_config_v3');
                clearVaultSession();
                setVaultPassword('');
                setPasswordInput('');
                setPortfolio([]);
                setVaultHistory([]);
                setVaultGoal({ title: '', target: '', currency: 'TRY' });
                setSearchQuery('');
                setShowSearch(false);
                setActiveTypeFilter(null);
                setLastRefreshTime('');
                setAvailableVaults([]);
                setAdminVaults([]);
                setCurrentVaultFile('');
                updateFileSha(null);
                userDirtyRef.current = false;
                setHasUnsavedChanges(false);
                setAuthError('');
                const emptyCfg = { ...DEFAULT_GH_CONFIG };
                setGithubConfig(emptyCfg);
                setFormConfig(emptyCfg);
                setAppState('setup_github');
            };

            // =========================================================================
            // PORTFOLIO CALCULATIONS (MEMOIZED & CONSISTENT)
            // =========================================================================
            const calculateAssetValue = useCallback((asset) => {
                if (asset.subItems && asset.subItems.length > 0) {
                    return asset.subItems.reduce((total, sub) => total + getItemValue(sub, rates), 0);
                }
                return getItemValue(asset, rates);
            }, [rates]);

            const calculatePnL = useCallback((amount, rate, costPrice, type, currentPrice) => {
                const cost = safeParseNum(costPrice);
                const qty = safeParseNum(amount);
                if (cost <= 0 || qty <= 0 || type === 'TRY') return null;

                const unitCurrent = type === 'STOCK' ? safeParseNum(currentPrice) : safeParseNum(rate);
                if (unitCurrent <= 0) return null;

                const currentTotal = qty * unitCurrent;
                const costTotal = qty * cost;
                const profit = currentTotal - costTotal;
                const percentage = (profit / costTotal) * 100;
                return { profit, percentage, isProfit: profit >= 0, isNeutral: Math.abs(profit) < 0.5 };
            }, []);

            const calculatePersonTotal = useCallback((assets) => {
                return (assets || []).filter((a) => !a.isHidden).reduce((total, asset) => total + calculateAssetValue(asset), 0);
            }, [calculateAssetValue]);

            const calculateAssetPnL = useCallback((asset) => {
                const items = asset?.subItems && asset.subItems.length > 0 ? asset.subItems : [asset];
                let costSum = 0;
                let currSum = 0;
                items.forEach((it) => {
                    if (!it) return;
                    const pnl = calculatePnL(it.amount, rates[it.type], it.costPrice, it.type, it.currentPrice);
                    if (pnl) {
                        costSum += safeParseNum(it.amount) * safeParseNum(it.costPrice);
                        currSum += getItemValue(it, rates);
                    }
                });
                if (costSum <= 0) return null;
                const profit = currSum - costSum;
                const percentage = (profit / costSum) * 100;
                return { profit, percentage, isProfit: profit >= 0, isNeutral: Math.abs(profit) < 0.5 };
            }, [rates, calculatePnL]);

            const calculatePersonPnL = useCallback((assets) => {
                let costSum = 0;
                let currSum = 0;
                (assets || []).filter((a) => !a.isHidden).forEach((asset) => {
                    const items = asset.subItems && asset.subItems.length > 0 ? asset.subItems : [asset];
                    items.forEach((it) => {
                        const pnl = calculatePnL(it.amount, rates[it.type], it.costPrice, it.type, it.currentPrice);
                        if (pnl) {
                            costSum += safeParseNum(it.amount) * safeParseNum(it.costPrice);
                            currSum += getItemValue(it, rates);
                        }
                    });
                });
                if (costSum <= 0) return null;
                const profit = currSum - costSum;
                const percentage = (profit / costSum) * 100;
                return { profit, percentage, isProfit: profit >= 0, isNeutral: Math.abs(profit) < 0.5 };
            }, [rates, calculatePnL]);

            const visiblePortfolio = useMemo(() => portfolio.filter((p) => !p.isHidden), [portfolio]);

            const grandTotal = useMemo(
                () => visiblePortfolio.reduce((acc, person) => acc + calculatePersonTotal(person.assets), 0),
                [visiblePortfolio, calculatePersonTotal]
            );

            const overallPnL = useMemo(() => {
                let costSum = 0;
                let currSum = 0;
                visiblePortfolio.forEach((person) => {
                    (person.assets || []).filter((a) => !a.isHidden).forEach((asset) => {
                        const items = asset.subItems && asset.subItems.length > 0 ? asset.subItems : [asset];
                        items.forEach((it) => {
                            const pnl = calculatePnL(it.amount, rates[it.type], it.costPrice, it.type, it.currentPrice);
                            if (pnl) {
                                costSum += safeParseNum(it.amount) * safeParseNum(it.costPrice);
                                currSum += getItemValue(it, rates);
                            }
                        });
                    });
                });
                if (costSum <= 0) return null;
                const profit = currSum - costSum;
                const percentage = (profit / costSum) * 100;
                return { profit, percentage, costSum, isProfit: profit >= 0 };
            }, [visiblePortfolio, rates, calculatePnL]);

            const goalProgress = useMemo(() => {
                const targetNum = safeParseNum(vaultGoal?.target);
                if (targetNum <= 0) return null;
                const cur = vaultGoal.currency || 'TRY';
                let targetInTry = targetNum;
                if (cur !== 'TRY') {
                    const r = safeParseNum(rates[cur]);
                    if (r <= 0) return null;
                    targetInTry = targetNum * r;
                }
                const pct = Math.min(100, Math.max(0, (grandTotal / targetInTry) * 100));
                const remainingTry = Math.max(0, targetInTry - grandTotal);
                return {
                    title: vaultGoal.title || 'Portföy Hedefi',
                    currency: cur,
                    targetInTry,
                    pct,
                    remainingTry,
                    reached: grandTotal >= targetInTry
                };
            }, [vaultGoal, grandTotal, rates]);

            const liveHistory = useMemo(
                () => mergeTodayHistorySnapshot(vaultHistory, portfolio, rates),
                [vaultHistory, portfolio, rates]
            );

            const totalAssetCount = useMemo(
                () => portfolio.reduce((acc, p) => acc + (p.assets || []).length, 0),
                [portfolio]
            );

            const hasAnyExpandedAsset = useMemo(
                () => portfolio.some((p) => (p.assets || []).some((a) => Boolean(expandedAssets[a.id]))),
                [portfolio, expandedAssets]
            );

            const toggleExpandAllAssets = useCallback(() => {
                const nextExpand = !hasAnyExpandedAsset;
                const nextPersons = {};
                const nextAssets = {};
                portfolio.forEach((p) => {
                    nextPersons[p.id] = true;
                    (p.assets || []).forEach((a) => { nextAssets[a.id] = nextExpand; });
                });
                setExpandedPersons(nextPersons);
                setExpandedAssets(nextAssets);
            }, [portfolio, hasAnyExpandedAsset]);

            const distribution = useMemo(() => {
                if (grandTotal <= 0) return [];
                const tryEquivalent = {};
                visiblePortfolio.forEach((person) => {
                    (person.assets || []).filter((a) => !a.isHidden).forEach((asset) => {
                        if (asset.subItems && asset.subItems.length > 0) {
                            asset.subItems.forEach((sub) => {
                                tryEquivalent[sub.type] = (tryEquivalent[sub.type] || 0) + getItemValue(sub, rates);
                            });
                        } else {
                            tryEquivalent[asset.type] = (tryEquivalent[asset.type] || 0) + getItemValue(asset, rates);
                        }
                    });
                });

                return Object.keys(tryEquivalent)
                    .filter((key) => tryEquivalent[key] > 0)
                    .map((key) => {
                        const rawPct = (tryEquivalent[key] / grandTotal) * 100;
                        return {
                            type: key,
                            label: currencyLabels[key] || key,
                            value: tryEquivalent[key],
                            rawPct,
                            percentage: formatTrDecimal(rawPct, 1)
                        };
                    })
                    .sort((a, b) => b.rawPct - a.rawPct);
            }, [visiblePortfolio, grandTotal, rates, currencyLabels]);

            // Auto-clear orphaned type filter if that asset category drops to 0
            useEffect(() => {
                if (activeTypeFilter && !distribution.some((d) => d.type === activeTypeFilter)) {
                    setActiveTypeFilter(null);
                }
            }, [activeTypeFilter, distribution]);

            const isFiltering = Boolean(searchQuery.trim() || activeTypeFilter);

            const filteredPortfolio = useMemo(() => {
                const q = normalizeTurkishSearch(searchQuery).trim();
                const hasQuery = q.length > 0;
                const hasType = Boolean(activeTypeFilter);

                let list = portfolio;

                if (hasQuery || hasType) {
                    list = portfolio
                        .map((person) => {
                            const personMatchesQuery = hasQuery && normalizeTurkishSearch(person.person).includes(q);
                            const matchedAssets = (person.assets || []).filter((asset) => {
                                const hasSubs = asset.subItems && asset.subItems.length > 0;
                                const typeOk = !hasType || (
                                    hasSubs
                                        ? asset.subItems.some((s) => s.type === activeTypeFilter)
                                        : asset.type === activeTypeFilter
                                );
                                if (!typeOk) return false;
                                if (!hasQuery || personMatchesQuery) return true;
                                if (normalizeTurkishSearch(asset.name).includes(q)) return true;
                                if (normalizeTurkishSearch(currencyLabels[asset.type] || asset.type).includes(q)) return true;
                                if (hasSubs) {
                                    return asset.subItems.some(
                                        (s) =>
                                            normalizeTurkishSearch(s.name).includes(q) ||
                                            normalizeTurkishSearch(currencyLabels[s.type] || s.type).includes(q)
                                    );
                                }
                                return false;
                            });

                            if (matchedAssets.length === 0 && !(personMatchesQuery && !hasType)) return null;
                            return { ...person, assets: matchedAssets };
                        })
                        .filter(Boolean);
                }

                if (sortByValue) {
                    list = [...list]
                        .map((person) => ({
                            ...person,
                            assets: [...(person.assets || [])].sort((a, b) => calculateAssetValue(b) - calculateAssetValue(a))
                        }))
                        .sort((a, b) => calculatePersonTotal(b.assets) - calculatePersonTotal(a.assets));
                }

                return list;
            }, [portfolio, searchQuery, activeTypeFilter, sortByValue, currencyLabels, calculateAssetValue, calculatePersonTotal]);

            // Keyboard shortcuts (Ctrl+S flushes active input before saving!)
            useEffect(() => {
                if (appState !== 'app') return;
                const onKeyDown = (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                        e.preventDefault();
                        if (document.activeElement && typeof document.activeElement.blur === 'function') {
                            document.activeElement.blur();
                        }
                        setTimeout(() => handleSaveToGithub(false), 30);
                    } else if (e.altKey && e.key.toLowerCase() === 'r') {
                        e.preventDefault();
                        fetchLiveRates(true);
                    } else if (e.altKey && e.key.toLowerCase() === 'h') {
                        e.preventDefault();
                        togglePrivacyMode();
                    }
                };
                window.addEventListener('keydown', onKeyDown);
                return () => window.removeEventListener('keydown', onKeyDown);
            }, [appState, handleSaveToGithub, fetchLiveRates, togglePrivacyMode]);

            const getSessionRemainingMinutes = () => {
                const session = safeJsonParse(localStorage.getItem(VAULT_SESSION_KEY), null);
                if (!session?.expiry) return null;
                return Math.max(0, Math.ceil((session.expiry - Date.now()) / 60000));
            };

            // =========================================================================
            // PORTFOLIO MUTATIONS (SMART DEFAULTS, INSTANT EMPTY DELETE, AUTO-DETECT)
            // =========================================================================
            const handleRateCommit = useCallback((currency, numVal) => {
                setRates((prev) => (prev[currency] === numVal ? prev : { ...prev, [currency]: numVal }));
            }, []);

            const closeRatesModal = useCallback(() => {
                setShowRatesModal(false);
                setDragRateKey(null);
                setDragOverRateKey(null);
                setShowAddRateForm(false);
                setNewRateName('');
                setNewRateValue('');
                setNewRateError('');
            }, []);

            const orderedRateItems = useMemo(
                () => rateOrder.map((key) => getRateMeta(key)),
                [rateOrder]
            );

            const visibleTickerRates = useMemo(
                () => orderedRateItems.filter((m) => !hiddenTickerRates.includes(m.key)),
                [orderedRateItems, hiddenTickerRates]
            );

            const orderedAssetOptions = useMemo(() => {
                const opts = {
                    TRY: currencyLabels.TRY || DEFAULT_LABELS.TRY,
                    STOCK: currencyLabels.STOCK || DEFAULT_LABELS.STOCK
                };
                rateOrder.forEach((key) => {
                    opts[key] = currencyLabels[key] || DEFAULT_LABELS[key] || key;
                });
                Object.keys(currencyLabels).forEach((key) => {
                    if (!(key in opts)) opts[key] = currencyLabels[key];
                });
                return opts;
            }, [rateOrder, currencyLabels]);

            const moveRate = useCallback((key, direction) => {
                setRateOrder((prev) => {
                    const idx = prev.indexOf(key);
                    const target = idx + direction;
                    if (idx === -1 || target < 0 || target >= prev.length) return prev;
                    const next = [...prev];
                    [next[idx], next[target]] = [next[target], next[idx]];
                    return next;
                });
            }, []);

            const reorderRate = useCallback((fromKey, toKey) => {
                if (!fromKey || !toKey || fromKey === toKey) return;
                setRateOrder((prev) => {
                    const fromIdx = prev.indexOf(fromKey);
                    const toIdx = prev.indexOf(toKey);
                    if (fromIdx === -1 || toIdx === -1) return prev;
                    const next = [...prev];
                    const [moved] = next.splice(fromIdx, 1);
                    next.splice(toIdx, 0, moved);
                    return next;
                });
            }, []);

            const toggleTickerRateVisibility = useCallback((key) => {
                setHiddenTickerRates((prev) =>
                    prev.includes(key) ? prev.filter((k) => k !== key) : [...prev, key]
                );
            }, []);

            const handleAddCustomRate = useCallback((e) => {
                e.preventDefault();
                const cleanName = String(newRateName || '').trim().replace(/\s+/g, ' ');
                const parsedVal = safeParseNum(newRateValue);
                if (!cleanName) {
                    setNewRateError('Birim adı boş olamaz.');
                    return;
                }
                if (cleanName.length > 24) {
                    setNewRateError('Birim adı en fazla 24 karakter olabilir.');
                    return;
                }
                if (parsedVal <= 0) {
                    setNewRateError('Birim fiyat 0’dan büyük olmalıdır.');
                    return;
                }
                const newKey = `CUSTOM_${Date.now().toString(36).toUpperCase()}`;
                setCurrencyLabels((prev) => ({ ...prev, [newKey]: cleanName }));
                setRates((prev) => ({ ...prev, [newKey]: parsedVal }));
                setRateOrder((prev) => [...prev, newKey]);
                setNewRateName('');
                setNewRateValue('');
                setNewRateError('');
                setShowAddRateForm(false);
                showToast(`"${cleanName}" birimi eklendi.`, 'success');
            }, [newRateName, newRateValue, showToast]);

            const handleDeleteCustomRate = useCallback((key) => {
                if (BUILTIN_RATE_SET.has(key)) return;
                const snapPortfolio = latestStateRef.current.portfolio || [];
                const inUse = snapPortfolio.some((p) =>
                    (p.assets || []).some((a) =>
                        a.type === key || (a.subItems || []).some((s) => s.type === key)
                    )
                );
                if (inUse) {
                    showToast('Bu birim portföydeki varlıklarda kullanılıyor. Silmeden önce varlık türünü değiştirin.', 'warning');
                    return;
                }
                const removedName = latestStateRef.current.currencyLabels[key] || key;
                setRateOrder((prev) => prev.filter((k) => k !== key));
                setHiddenTickerRates((prev) => prev.filter((k) => k !== key));
                setCurrencyLabels((prev) => {
                    const next = { ...prev };
                    delete next[key];
                    return next;
                });
                setRates((prev) => {
                    const next = { ...prev };
                    delete next[key];
                    return next;
                });
                showToast(`"${removedName}" birimi silindi.`, 'success');
            }, [showToast]);

            const handleResetRatesDefaults = useCallback(() => {
                setRateOrder((prev) => {
                    const customKeys = prev.filter((k) => !BUILTIN_RATE_SET.has(k));
                    return [...DEFAULT_RATE_ORDER, ...customKeys];
                });
                setHiddenTickerRates([]);
                setCurrencyLabels((prev) => ({ ...prev, ...DEFAULT_LABELS }));
                showToast('Kur sırası ve varsayılan isimler sıfırlandı.', 'success');
            }, [showToast]);

            const togglePersonAccordion = (personId) => {
                if (isFiltering) return;
                setExpandedPersons((prev) => ({ ...prev, [personId]: prev[personId] === false ? true : false }));
            };

            const toggleAssetAccordion = (assetId) => {
                if (isFiltering) return;
                setExpandedAssets((prev) => ({ ...prev, [assetId]: !prev[assetId] }));
            };

            const updatePersonName = (personId, newName) =>
                setPortfolio((prev) => prev.map((p) => (p.id === personId ? { ...p, person: newName } : p)));

            const updatePortfolioAsset = (personId, assetId, updater) =>
                setPortfolio((prev) =>
                    prev.map((person) =>
                        person.id === personId
                            ? { ...person, assets: person.assets.map((asset) => (asset.id === assetId ? updater(asset) : asset)) }
                            : person
                    )
                );

            const updateAssetNameSmart = (personId, assetId, newName) => {
                updatePortfolioAsset(personId, assetId, (a) => {
                    const hasSubs = a.subItems && a.subItems.length > 0;
                    const smartType = !hasSubs ? detectSmartAssetType(newName, a) : null;
                    if (smartType === 'STOCK') {
                        for (const key of attemptedStocksRef.current) {
                            if (key.startsWith(`${assetId}:`)) attemptedStocksRef.current.delete(key);
                        }
                    }
                    return { ...a, name: newName, ...(smartType ? { type: smartType } : {}) };
                });
            };

            const updateSubItemNameSmart = (personId, assetId, subId, newName) => {
                updatePortfolioAsset(personId, assetId, (asset) => ({
                    ...asset,
                    subItems: (asset.subItems || []).map((sub) => {
                        if (sub.id !== subId) return sub;
                        const smartType = detectSmartAssetType(newName, sub);
                        if (smartType === 'STOCK') {
                            for (const key of attemptedStocksRef.current) {
                                if (key.startsWith(`${subId}:`)) attemptedStocksRef.current.delete(key);
                            }
                        }
                        return { ...sub, name: newName, ...(smartType ? { type: smartType } : {}) };
                    })
                }));
            };

            const addSubItem = (personId, assetId) => {
                const initType = activeTypeFilter || 'TRY';
                updatePortfolioAsset(personId, assetId, (asset) => {
                    const existingSubs = [...(asset.subItems || [])];
                    if (existingSubs.length === 0 && safeParseNum(asset.amount) > 0) {
                        existingSubs.push({
                            id: generateId('sub'),
                            name: asset.name || 'Kalem 1',
                            type: asset.type || 'TRY',
                            amount: asset.amount,
                            costPrice: asset.costPrice || '',
                            currentPrice: asset.currentPrice || '',
                            _lastFetchedTicker: asset._lastFetchedTicker || ''
                        });
                    }
                    existingSubs.push({ id: generateId('sub'), name: '', type: initType, amount: '', costPrice: '', currentPrice: '' });
                    return { ...asset, amount: '', costPrice: '', currentPrice: '', _lastFetchedTicker: '', subItems: existingSubs };
                });
            };

            const removeSubItem = (e, personId, assetId, subItem) => {
                if (e) e.stopPropagation();
                // Instant zero-modal delete if empty
                if (!subItem.name?.trim() && safeParseNum(subItem.amount) === 0) {
                    updatePortfolioAsset(personId, assetId, (asset) => ({
                        ...asset,
                        subItems: (asset.subItems || []).filter((s) => s.id !== subItem.id)
                    }));
                    return;
                }
                setDeleteTarget({ type: 'subItem', personId, assetId, subItemId: subItem.id });
            };

            const updateSubItem = (personId, assetId, subItemId, field, value) =>
                updatePortfolioAsset(personId, assetId, (asset) => ({
                    ...asset,
                    subItems: (asset.subItems || []).map((sub) => (sub.id === subItemId ? { ...sub, [field]: value } : sub))
                }));

            const addAsset = (personId) => {
                const initType = activeTypeFilter || 'TRY';
                if (searchQuery.trim()) setSearchQuery('');
                const newId = generateId('asset');
                setPortfolio((prev) =>
                    prev.map((person) =>
                        person.id === personId
                            ? { ...person, assets: [...person.assets, { id: newId, name: '', type: initType, amount: '', costPrice: '', currentPrice: '', subItems: [] }] }
                            : person
                    )
                );
                setExpandedPersons((prev) => ({ ...prev, [personId]: true }));
                setExpandedAssets((prev) => ({ ...prev, [newId]: true }));
            };

            const removeAsset = (e, personId, asset) => {
                if (e) e.stopPropagation();
                const isEmpty = !asset.name?.trim() && safeParseNum(asset.amount) === 0 && (!asset.subItems || asset.subItems.length === 0);
                if (isEmpty) {
                    setPortfolio((prev) => prev.map((p) => (p.id === personId ? { ...p, assets: p.assets.filter((a) => a.id !== asset.id) } : p)));
                    return;
                }
                setDeleteTarget({ type: 'asset', personId, assetId: asset.id });
            };

            const togglePersonVisibility = (personId) => {
                setPortfolio((prev) => prev.map((p) => (p.id === personId ? { ...p, isHidden: !p.isHidden } : p)));
            };

            const toggleAssetVisibility = (personId, assetId) => {
                setPortfolio((prev) =>
                    prev.map((person) =>
                        person.id === personId
                            ? { ...person, assets: person.assets.map((asset) => (asset.id === assetId ? { ...asset, isHidden: !asset.isHidden } : asset)) }
                            : person
                    )
                );
            };

            const removePerson = (person) => {
                setOpenPersonMenuId(null);
                if (!person.person?.trim() && (!person.assets || person.assets.length === 0)) {
                    setPortfolio((prev) => prev.filter((p) => p.id !== person.id));
                    return;
                }
                setDeleteTarget({ type: 'person', personId: person.id });
            };

            const addNewPerson = () => {
                if (searchQuery.trim()) setSearchQuery('');
                if (activeTypeFilter) setActiveTypeFilter(null);
                const newId = generateId('person');
                setPortfolio((prev) => [...prev, { id: newId, person: '', isHidden: false, assets: [] }]);
                setExpandedPersons((prev) => ({ ...prev, [newId]: true }));
                setRenamingPersonId(newId);
            };

            const movePerson = (personId, direction) => {
                setPortfolio((prev) => {
                    const idx = prev.findIndex((p) => p.id === personId);
                    const nextIdx = idx + direction;
                    if (idx < 0 || nextIdx < 0 || nextIdx >= prev.length) return prev;
                    const copy = [...prev];
                    const [moved] = copy.splice(idx, 1);
                    copy.splice(nextIdx, 0, moved);
                    return copy;
                });
                setOpenPersonMenuId(null);
            };

            const openTradeModal = (personId, assetId, item, subId = null) => {
                const liveUnit = getItemUnitRate(item, rates);
                setTradeTarget({
                    personId,
                    assetId,
                    subId,
                    name: item.name || (currencyLabels[item.type] || item.type),
                    type: item.type,
                    typeLabel: currencyLabels[item.type] || item.type,
                    currentAmount: safeParseNum(item.amount),
                    currentCost: safeParseNum(item.costPrice),
                    liveUnit
                });
                setTradeMode('buy');
                setTradeQty('');
                setTradePrice(liveUnit > 0 ? String(liveUnit) : '');
            };

            const applyTrade = (e) => {
                e.preventDefault();
                if (!tradeTarget) return;
                const qty = safeParseNum(tradeQty);
                const price = safeParseNum(tradePrice);
                if (qty <= 0) {
                    showToast('İşlem miktarı 0’dan büyük olmalıdır.', 'error');
                    return;
                }
                if (tradeMode === 'buy' && price <= 0) {
                    showToast('Alım birim fiyatı 0’dan büyük olmalıdır.', 'error');
                    return;
                }
                if (tradeMode === 'sell' && qty > tradeTarget.currentAmount) {
                    showToast('Satış miktarı mevcut adetten fazla olamaz.', 'error');
                    return;
                }

                let newAmount;
                let newCost;
                if (tradeMode === 'buy') {
                    newAmount = parseFloat((tradeTarget.currentAmount + qty).toFixed(6));
                    if (tradeTarget.currentAmount > 0 && tradeTarget.currentCost > 0) {
                        newCost = parseFloat((((tradeTarget.currentAmount * tradeTarget.currentCost) + (qty * price)) / newAmount).toFixed(4));
                    } else {
                        newCost = parseFloat(price.toFixed(4));
                    }
                } else {
                    newAmount = parseFloat(Math.max(0, tradeTarget.currentAmount - qty).toFixed(6));
                    newCost = newAmount > 0 ? tradeTarget.currentCost : '';
                }

                if (tradeTarget.subId) {
                    updatePortfolioAsset(tradeTarget.personId, tradeTarget.assetId, (asset) => ({
                        ...asset,
                        subItems: (asset.subItems || []).map((s) =>
                            s.id === tradeTarget.subId
                                ? { ...s, amount: String(newAmount), costPrice: newCost === '' ? '' : String(newCost) }
                                : s
                        )
                    }));
                } else {
                    updatePortfolioAsset(tradeTarget.personId, tradeTarget.assetId, (asset) => ({
                        ...asset,
                        amount: String(newAmount),
                        costPrice: newCost === '' ? '' : String(newCost)
                    }));
                }

                showToast(
                    tradeMode === 'buy'
                        ? `${tradeTarget.name}: +${formatQty(qty)} eklendi (Yeni ort. ${formatTrDecimal(newCost, 2)} ₺).`

                setTradeTarget(null);
            };

                const qty = safeParseNum(asset.amount);

                if (asset.type === 'STOCK') {

                    return price > 0 ? `${formatQty(qty)} Adet · ${formatCompactRate(price)} ₺` : `${formatQty(qty)} Adet`;

                return `${formatQty(qty)} ${lbl}`;

                                </p>
                                {adminModalError && (
                                    <div className="p-2.5 rounded-xl bg-red-500/15 border border-red-500/30 text-red-300 text-xs font-semibold">
                                        {adminModalError}
                                    </div>
                                )}
                                <input
                                    autoFocus
                                    type="text"
                                    value={adminInputVal}
                                    onChange={(e) => { setAdminInputVal(e.target.value); setAdminModalError(''); }}
                                    className="w-full glass-surface py-3 px-4 rounded-xl text-center text-white font-bold text-base tracking-[0.2em] outline-none focus:border-white/30"
                                    placeholder="Yeni Şifre (En az 4 karakter)"
                                />
                                <div className="flex gap-3 mt-1">
                                    <button type="button" onClick={() => { setAdminActionTarget(null); setAdminModalError(''); }} className="flex-1 py-3 rounded-xl font-bold text-xs bg-white/5 text-white hover:bg-white/10 tracking-widest border border-white/10">İPTAL</button>
                                    <button type="submit" className="flex-1 py-3 rounded-xl font-bold text-xs bg-amber-500/20 text-amber-300 hover:bg-amber-500 hover:text-black tracking-widest border border-amber-500/35">SIFIRLA</button>
                                </div>
                            </form>
                        )}
                    </PortalModal>
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <PortfolioApp />
            </ErrorBoundary>
        );
    </script>
</body>

</html>
