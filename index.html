        const GH_CONFIG_KEY = 'gh_config_v5';
        const VAULT_SESSION_KEY = 'vault_session_v5';
        const PRIVACY_MODE_KEY = 'privacy_mode_v1';
        const SESSION_DURATION_MS = 30 * 60 * 1000; // 30 dakika
        const IDLE_TIMEOUT_MS = 15 * 60 * 1000;     // 15 dakika

        const safeJsonParse = (str, fallback = null) => {
            if (!str) return fallback;
            try {
                return JSON.parse(str);
            } catch {
                return fallback;
            }
        };

        const safeDecodeURIComponent = (str) => {
            if (!str) return '';
            try {
                return decodeURIComponent(str);
            } catch {
                return String(str);
            }
        };

        const utf8ToBase64 = (str) => {
            const bytes = new TextEncoder().encode(str);
            let binary = '';
            const chunkSize = 0x8000;
            for (let i = 0; i < bytes.length; i += chunkSize) {
                binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
            }
            return btoa(binary);
        };

        const base64ToUtf8 = (b64) => {
            const cleaned = String(b64 || '').replace(/\s/g, '');
            const binary = atob(cleaned);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return new TextDecoder().decode(bytes);
        };

        const cleanTokenStr = (token) => String(token || '').replace(/[^\x20-\x7E]/g, '').trim();

        const generateId = (prefix) => `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;

        const safeParseNum = (val) => {
            if (val === '' || val === null || val === undefined) return 0;
            if (typeof val === 'number') return Number.isFinite(val) ? val : 0;
            const normalized = String(val).trim().replace(',', '.');
            const num = parseFloat(normalized);
            return Number.isFinite(num) ? num : 0;
        };

        const formatMoney = (value, masked = false) => {
            if (masked) return '•••••• ₺';
            const safeVal = Number.isFinite(value) ? (Math.abs(value) < 0.5 ? 0 : value) : 0;
            return new Intl.NumberFormat('tr-TR', { minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(safeVal) + ' ₺';
        };

        const formatInCurrency = (tryValue, currency, rates, masked = false) => {
            if (masked) {
                if (currency === 'USD') return '$•••••';
                if (currency === 'EUR') return '€•••••';
                if (currency === 'GRAM') return '•••• gr';
                return '•••••• ₺';
            }
            const safeTry = Number.isFinite(tryValue) ? tryValue : 0;
            if (currency === 'USD') {
                const r = safeParseNum(rates?.USD);
                const val = r > 0 ? safeTry / r : 0;
                return '$' + new Intl.NumberFormat('tr-TR', { minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(val);
            }
            if (currency === 'EUR') {
                const r = safeParseNum(rates?.EUR);
                const val = r > 0 ? safeTry / r : 0;
                return '€' + new Intl.NumberFormat('tr-TR', { minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(val);
            }
            if (currency === 'GRAM') {
                const r = safeParseNum(rates?.GRAM);
                const val = r > 0 ? safeTry / r : 0;
                return new Intl.NumberFormat('tr-TR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(val) + ' gr';
            }
            return formatMoney(safeTry, false);
        };

        const normalizeTurkishSearch = (str) =>
            String(str || '')
                .replace(/[çÇ]/g, 'c')
                .replace(/[ğĞ]/g, 'g')
                .replace(/[ıİI]/g, 'i')
                .replace(/[öÖ]/g, 'o')
                .replace(/[şŞ]/g, 's')
                .replace(/[üÜ]/g, 'u')
                .toLowerCase();

        const formatTitleCase = (str) => {
            if (!str) return 'TL';
            return String(str).trim().split(/[\s_-]+/).map((word) => {
                if (!word) return '';
                const upper = word.toUpperCase();
                if (upper === 'TL' || upper === 'USD' || upper === 'EUR' || upper === 'GBP' || upper === 'BTC' || upper === 'BIST') return upper;
                if (word.length <= 4 && word === upper && /[A-Z]/.test(word)) return word;
                return word.charAt(0).toLocaleUpperCase('tr-TR') + word.slice(1).toLocaleLowerCase('tr-TR');
            }).filter(Boolean).join(' ');
        };

        const getVaultDisplayName = (filename) => {
            if (!filename) return 'Kasa';
            if (filename === 'data.json') return 'Ana Kasa (Legacy)';
            const stripped = filename
                .replace(/^vault_locked_/, '')
                .replace(/^vault_/, '')
                .replace(/\.json$/i, '');
            return safeDecodeURIComponent(stripped) || 'Kasa';
        };

        const validateVaultName = (rawName) => {
            const trimmed = String(rawName || '').trim().replace(/\s+/g, ' ');
            if (!trimmed) return { ok: false, error: 'Kasa adı boş olamaz.' };
            if (trimmed.length > 50) return { ok: false, error: 'Kasa adı en fazla 50 karakter olabilir.' };
            if (/[\/\\?%*:|"<>#]/.test(trimmed)) {
                return { ok: false, error: 'Kasa adında / \\ ? % * : | " < > # karakterleri kullanılamaz.' };
            }
            if (trimmed.toLowerCase() === 'data') {
                return { ok: false, error: 'Bu kasa adı sistem tarafından ayrılmıştır.' };
            }
            return { ok: true, name: trimmed };
        };

        const normalizeBistTicker = (rawName) => {
            if (!rawName) return '';
            const firstWord = String(rawName).trim().split(/\s+/)[0] || '';
            const ascii = firstWord
                .replace(/[çÇ]/g, 'C')
                .replace(/[ğĞ]/g, 'G')
                .replace(/[ıİiI]/g, 'I')
                .replace(/[öÖ]/g, 'O')
                .replace(/[şŞ]/g, 'S')
                .replace(/[üÜ]/g, 'U')
                .toUpperCase()
                .replace(/[^A-Z0-9]/g, '');
            if (ascii.length < 2 || ascii.length > 10) return '';
            return ascii;
        };

        const fetchTurkishStockPricesBatch = async (rawTickers) => {
            const unique = [...new Set(rawTickers.map(normalizeBistTicker).filter(Boolean))];
            if (unique.length === 0) return {};

            try {
                // Content-Type: text/plain avoids CORS OPTIONS preflight on TradingView scanner
                const res = await fetch('https://scanner.tradingview.com/turkey/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({
                        symbols: { tickers: unique.map((s) => `BIST:${s}`) },
                        query: { types: [] },
                        columns: ['close']
                    })
                });
                if (!res.ok) return {};
                const data = await res.json();
                const map = {};
                if (Array.isArray(data?.data)) {
                    data.data.forEach((row) => {
                        const sym = String(row?.s || '').replace(/^BIST:/i, '').toUpperCase();
                        const price = row?.d?.[0];
                        if (sym && typeof price === 'number' && Number.isFinite(price) && price > 0) {
                            map[sym] = parseFloat(price.toFixed(2));
                        }
                    });
                }
                return map;
            } catch (e) {
                console.warn('TradingView fetch failed:', e);
                return {};
            }
        };

        const fetchTurkishStockPrice = async (ticker) => {
            const normalized = normalizeBistTicker(ticker);
            if (!normalized) return null;
            const prices = await fetchTurkishStockPricesBatch([normalized]);
            return prices[normalized] ?? null;
        };

        const getItemUnitRate = (item, rates) => {
            if (!item) return 0;
            if (item.type === 'STOCK') {
                return safeParseNum(item.currentPrice) || safeParseNum(item.costPrice) || 0;
            }
            return safeParseNum(rates[item.type] ?? 1);
        };

        const getItemValue = (item, rates) => {
            return safeParseNum(item?.amount) * getItemUnitRate(item, rates);
        };

        const getTodayDateKey = () => {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };

        const calcPersonValuePure = (person, rates) => {
            return (person?.assets || [])
                .filter((a) => !a.isHidden)
                .reduce((sum, asset) => {
                    if (asset.subItems && asset.subItems.length > 0) {
                        return sum + asset.subItems.reduce((s, sub) => s + getItemValue(sub, rates), 0);
                    }
                    return sum + getItemValue(asset, rates);
                }, 0);
        };

        const mergeTodayHistorySnapshot = (prevHistory, portfolio, rates) => {
            const base = Array.isArray(prevHistory)
                ? prevHistory.filter((h) => h && typeof h.date === 'string' && Number.isFinite(h.total))
                : [];
            const today = getTodayDateKey();
            const byPerson = {};
            let total = 0;

            (portfolio || []).forEach((person) => {
                const pVal = Math.round(calcPersonValuePure(person, rates));
                byPerson[person.id] = pVal;
                if (!person.isHidden) total += pVal;
            });

            const todaySnap = { date: today, total: Math.round(total), byPerson };
            const filtered = base.filter((h) => h.date !== today);
            if (total > 0 || filtered.length > 0) {
                filtered.push(todaySnap);
            }
            filtered.sort((a, b) => a.date.localeCompare(b.date));
            return filtered.slice(-365);
        };

        const formatShortDateTr = (isoDate) => {
            if (!isoDate || typeof isoDate !== 'string') return '';
            const parts = isoDate.split('-');
            if (parts.length !== 3) return isoDate;
            const months = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];
            const mIdx = parseInt(parts[1], 10) - 1;
            return `${parseInt(parts[2], 10)} ${months[mIdx] || parts[1]}`;
        };

        const sanitizePortfolioData = (raw) => {
            if (!Array.isArray(raw)) return [];
            return raw.map((p) => ({
                id: p?.id || generateId('person'),
                person: typeof p?.person === 'string' ? p.person : '',
                isHidden: Boolean(p?.isHidden),
                assets: Array.isArray(p?.assets)
                    ? p.assets.map((a) => ({
                        id: a?.id || generateId('asset'),
                        name: typeof a?.name === 'string' ? a.name : '',
                        type: typeof a?.type === 'string' && a.type ? a.type : 'TRY',
                        amount: a?.amount ?? '',
                        costPrice: a?.costPrice ?? '',
                        currentPrice: a?.currentPrice ?? '',
                        _lastFetchedTicker: a?._lastFetchedTicker || '',
                        isHidden: Boolean(a?.isHidden),
                        subItems: Array.isArray(a?.subItems)
                            ? a.subItems.map((s) => ({
                                id: s?.id || generateId('sub'),
                                name: typeof s?.name === 'string' ? s.name : '',
                                type: typeof s?.type === 'string' && s.type ? s.type : 'TRY',
                                amount: s?.amount ?? '',
                                costPrice: s?.costPrice ?? '',
                                currentPrice: s?.currentPrice ?? '',
                                _lastFetchedTicker: s?._lastFetchedTicker || ''
                            }))
                            : []
                    }))
                    : []
            }));

        const ghContentsUrl = (config, filename = '', cacheBust = false) => {
            const user = encodeURIComponent(String(config.username || '').trim());
            const repo = encodeURIComponent(String(config.repo || '').trim());
            const filePart = filename ? encodeURIComponent(filename) : '';
            const qs = cacheBust ? `?t=${Date.now()}` : '';
            return `https://api.github.com/repos/${user}/${repo}/contents/${filePart}${qs}`;
        };

        const ghReadHeaders = (config) => ({
            'Authorization': `Bearer ${cleanTokenStr(config.token)}`,

        });

        const ghWriteHeaders = (config) => ({

            'Content-Type': 'application/json'
        });

        // =========================================================================
        // ERROR BOUNDARY
        // =========================================================================
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, message: '' };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, message: error?.message || 'Beklenmeyen bir hata oluştu.' };
            }
            componentDidCatch(error, info) {
                console.error('PortfolioApp ErrorBoundary:', error, info);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex items-center justify-center p-6">
                            <div className="glass-card p-8 rounded-[2rem] max-w-sm w-full text-center flex flex-col items-center gap-4 border border-red-500/30">
                                <div className="w-14 h-14 rounded-2xl bg-red-500/15 border border-red-500/30 flex items-center justify-center">
                                    <i className="fa-solid fa-triangle-exclamation text-2xl text-red-400"></i>
                                </div>
                                <h2 className="text-xl font-bold text-white">Bir Hata Oluştu</h2>
                                <p className="text-xs text-zinc-400 leading-relaxed">{this.state.message}</p>
                                <button
                                    onClick={() => window.location.reload()}
                                    className="w-full py-3 rounded-xl font-bold text-xs tracking-widest uppercase bg-emerald-500/20 text-emerald-400 hover:bg-emerald-500 hover:text-black border border-emerald-500/30 transition-all"
                                >
                                    Sayfayı Yenile

                        </div>

                return this.props.children;

        }

        // =========================================================================

        let openModalCount = 0;

        const PortalModal = ({ isOpen, onClose, children, maxWidth = 'max-w-sm', disableBackdropClose = false }) => {
            useEffect(() => {

                openModalCount += 1;

                const handleKeyDown = (e) => {
                    if (e.key === 'Escape' && onClose && !disableBackdropClose) {
                        onClose();
                    }
                };
                document.addEventListener('keydown', handleKeyDown);
                return () => {
                    document.removeEventListener('keydown', handleKeyDown);
                    openModalCount = Math.max(0, openModalCount - 1);
                    if (openModalCount === 0) {
                        document.body.style.overflow = '';
                    }
                };
            }, [isOpen, onClose, disableBackdropClose]);

            if (!isOpen) return null;

            return ReactDOM.createPortal(
                <div

        const ToastBanner = ({ toast }) => {

        const CustomSelect = ({ value, options, onChange, className = '' }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [coords, setCoords] = useState(null);
            const dropdownRef = useRef(null);

            useEffect(() => {
                if (!isOpen) return;

                const updatePosition = () => {
                    if (!dropdownRef.current) return;
                    const rect = dropdownRef.current.getBoundingClientRect();
                    const optionCount = Object.keys(options).length;
                    const estimatedHeight = Math.min(260, optionCount * 40 + 16);
                    const spaceBelow = window.innerHeight - rect.bottom;
                    const spaceAbove = rect.top;
                    const direction = (spaceBelow < estimatedHeight + 16 && spaceAbove > spaceBelow) ? 'up' : 'down';
                    const menuWidth = Math.max(115, rect.width);
                    const rawRight = window.innerWidth - rect.right;
                    const clampedRight = Math.max(8, Math.min(rawRight, window.innerWidth - menuWidth - 8));

                    setCoords({
                        right: clampedRight,
                        top: rect.bottom + 6,
                        bottom: window.innerHeight - rect.top + 6,
                        width: menuWidth,
                        direction
                    });
                };

                updatePosition();

                const handleClickOutside = (event) => {
                    const target = event.target;
                    const insideDropdown = dropdownRef.current && target instanceof Node && dropdownRef.current.contains(target);
                    const insidePortal = target && typeof target.closest === 'function' && Boolean(target.closest('.custom-select-portal'));
                    if (!insideDropdown && !insidePortal) {
                        setIsOpen(false);
                    }
                };

                const handleScroll = (event) => {
                    const target = event.target;
                    const insidePortal = target && typeof target.closest === 'function' && Boolean(target.closest('.custom-select-portal'));
                    if (!insidePortal) {
                        setIsOpen(false);
                    }
                };

                const handleKeyDown = (event) => {
                    if (event.key === 'Escape') setIsOpen(false);
                };

                const handleResize = () => setIsOpen(false);

                document.addEventListener('mousedown', handleClickOutside);
                document.addEventListener('keydown', handleKeyDown);
                window.addEventListener('scroll', handleScroll, true);
                window.addEventListener('resize', handleResize);
                return () => {
                    document.removeEventListener('mousedown', handleClickOutside);
                    document.removeEventListener('keydown', handleKeyDown);
                    window.removeEventListener('scroll', handleScroll, true);
                    window.removeEventListener('resize', handleResize);
                };
            }, [isOpen, options]);

            const portalContent = isOpen && coords ? ReactDOM.createPortal(
                <div
                    className="custom-select-portal fixed bg-zinc-900/95 backdrop-blur-xl border border-white/20 rounded-xl shadow-[0_24px_80px_rgba(0,0,0,0.95)] z-[999999] overflow-y-auto max-h-[260px] py-1.5 animate-fade-in-up"
                    style={{
                        right: `${coords.right}px`,
                        top: coords.direction === 'up' ? 'auto' : `${coords.top}px`,
                        bottom: coords.direction === 'up' ? `${coords.bottom}px` : 'auto',
                        minWidth: `${coords.width}px`
                    }}
                >
                    {Object.entries(options).map(([key, label]) => (
                        <div
                            key={key}
                            onClick={(e) => {
                                e.stopPropagation();
                                onChange(key);
                                setIsOpen(false);
                            }}
                            className={`px-4 py-2.5 text-[11px] font-bold text-center cursor-pointer transition-colors ${
                                value === key
                                    ? 'bg-emerald-500/20 text-emerald-400'
                                    : 'text-zinc-300 hover:bg-white/10 hover:text-white'
                            }`}
                        >
                            {formatTitleCase(label)}
                        </div>
                    ))}
                </div>,
                document.body
            ) : null;

            return (
                <div ref={dropdownRef} className={`relative flex ${className}`} onClick={(e) => e.stopPropagation()}>
                    <button
                        type="button"
                        onClick={() => setIsOpen((prev) => !prev)}
                        className="w-full h-full flex items-center justify-center gap-1 cursor-pointer px-1.5 sm:px-2 text-[10px] sm:text-[11px] font-bold outline-none no-arrow hover:bg-white/5 transition-colors whitespace-nowrap rounded-r-xl"
                    >
                        <span>{formatTitleCase(options[value] || value)}</span>
                        <i className={`fa-solid fa-chevron-down text-[8px] opacity-60 transition-transform ${isOpen ? 'rotate-180' : ''}`}></i>
                    </button>
                    {portalContent}
                </div>
            );
        };

        const DebouncedInput = ({ value, onChange, delay = 350, type = 'text', onBlur, ...props }) => {
            const safeProp = value ?? '';
            const [localValue, setLocalValue] = useState(safeProp);
            const timerRef = useRef(null);
            const onChangeRef = useRef(onChange);
            const latestPropRef = useRef(safeProp);
            const localValueRef = useRef(safeProp);

            onChangeRef.current = onChange;

            useEffect(() => {
                latestPropRef.current = safeProp;
                if (safeProp !== localValueRef.current) {
                    if (timerRef.current) {
                        clearTimeout(timerRef.current);
                        timerRef.current = null;
                    }
                    localValueRef.current = safeProp;
                    setLocalValue(safeProp);
                }
            }, [safeProp]);

            useEffect(() => {
                return () => {
                    if (timerRef.current) {
                        clearTimeout(timerRef.current);
                        timerRef.current = null;
                        if (localValueRef.current !== latestPropRef.current) {
                            onChangeRef.current(localValueRef.current);
                        }
                    }
                };
            }, []);

            const handleChange = (e) => {
                const next = e.target.value;
                localValueRef.current = next;
                setLocalValue(next);
                if (timerRef.current) clearTimeout(timerRef.current);
                timerRef.current = setTimeout(() => {
                    timerRef.current = null;
                    if (localValueRef.current !== latestPropRef.current) {
                        onChangeRef.current(localValueRef.current);
                    }
                }, delay);
            };

            const handleBlur = (e) => {
                if (timerRef.current) {
                    clearTimeout(timerRef.current);
                    timerRef.current = null;
                }
                if (localValueRef.current !== latestPropRef.current) {
                    onChangeRef.current(localValueRef.current);
                }
                if (onBlur) onBlur(e);
            };

            const isNumeric = type === 'number';

            return (
                <input
                    {...props}
                    type={type}
                    step={isNumeric ? (props.step ?? 'any') : props.step}
                    inputMode={isNumeric ? (props.inputMode ?? 'decimal') : props.inputMode}
                    value={localValue}
                    onChange={handleChange}
                    onBlur={handleBlur}
                />
            );
        };

        // Instant auto-wrapping text field with optional BIST stock autocomplete portal
        const AutoGrowText = ({
            value,
            onChange,
            delay = 350,
            placeholder = '',
            className = '',
            wrapperClassName = '',
            onClick,
            title,
            isStock = false
        }) => {
            const safeProp = value ?? '';
            const [localValue, setLocalValue] = useState(safeProp);
            const [isFocused, setIsFocused] = useState(false);
            const [suggestCoords, setSuggestCoords] = useState(null);
            const wrapperRef = useRef(null);
            const timerRef = useRef(null);
            const onChangeRef = useRef(onChange);
            const latestPropRef = useRef(safeProp);
            const localValueRef = useRef(safeProp);

            onChangeRef.current = onChange;

            useEffect(() => {
                latestPropRef.current = safeProp;
                if (safeProp !== localValueRef.current) {
                    if (timerRef.current) {
                        clearTimeout(timerRef.current);
                        timerRef.current = null;
                    }
                    localValueRef.current = safeProp;
                    setLocalValue(safeProp);
                }
            }, [safeProp]);

            useEffect(() => {
                return () => {
                    if (timerRef.current) {
                        clearTimeout(timerRef.current);
                        timerRef.current = null;
                        if (localValueRef.current !== latestPropRef.current) {
                            onChangeRef.current(localValueRef.current);
                        }
                    }
                };
            }, []);

            const stockSuggestions = useMemo(() => {
                if (!isStock || !isFocused) return [];
                const q = normalizeTurkishSearch(localValue).trim();
                if (!q) return BIST_POPULAR.slice(0, 6);
                const exactAlready = BIST_POPULAR.some((s) => `${s.sym} ${s.name}`.toLowerCase() === localValue.trim().toLowerCase());
                if (exactAlready) return [];
                return BIST_POPULAR.filter(
                    (s) =>
                        s.sym.toLowerCase().startsWith(q) ||
                        normalizeTurkishSearch(s.name).includes(q) ||
                        s.sym.toLowerCase().includes(q)
                ).slice(0, 6);
            }, [isStock, isFocused, localValue]);

            useEffect(() => {
                if (!isStock || !isFocused || stockSuggestions.length === 0 || !wrapperRef.current) {
                    setSuggestCoords(null);
                    return;
                }
                const rect = wrapperRef.current.getBoundingClientRect();
                const menuWidth = Math.min(260, Math.max(190, rect.width));
                const left = Math.max(8, Math.min(rect.left, window.innerWidth - menuWidth - 8));
                const spaceBelow = window.innerHeight - rect.bottom;
                const direction = spaceBelow < 210 && rect.top > spaceBelow ? 'up' : 'down';
                setSuggestCoords({
                    left,
                    top: rect.bottom + 6,
                    bottom: window.innerHeight - rect.top + 6,
                    width: menuWidth,
                    direction
                });
            }, [isStock, isFocused, stockSuggestions.length, localValue]);

            const commitImmediate = (next) => {
                if (timerRef.current) {
                    clearTimeout(timerRef.current);
                    timerRef.current = null;
                }
                localValueRef.current = next;
                setLocalValue(next);
                if (next !== latestPropRef.current) {
                    onChangeRef.current(next);
                }
            };

            const handleChange = (e) => {
                const next = e.target.value.replace(/\r?\n/g, ' ');
                localValueRef.current = next;
                setLocalValue(next);
                if (timerRef.current) clearTimeout(timerRef.current);
                timerRef.current = setTimeout(() => {
                    timerRef.current = null;
                    if (localValueRef.current !== latestPropRef.current) {
                        onChangeRef.current(localValueRef.current);
                    }
                }, delay);
            };

            const handleBlur = () => {
                setIsFocused(false);
                if (timerRef.current) {
                    clearTimeout(timerRef.current);
                    timerRef.current = null;
                }
                if (localValueRef.current !== latestPropRef.current) {
                    onChangeRef.current(localValueRef.current);
                }
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    e.currentTarget.blur();
                } else if (e.key === 'Escape') {
                    setIsFocused(false);
                }
            };

            return (
                <div ref={wrapperRef} className={`relative w-full min-w-0 flex-1 ${wrapperClassName}`}>
                    <div
                        aria-hidden="true"
                        className={`invisible whitespace-pre-wrap break-words p-0 m-0 w-full min-w-0 pointer-events-none select-none ${className}`}
                    >
                        {(localValue || placeholder || '') + '\u200B'}
                    </div>
                    <textarea
                        rows={1}
                        value={localValue}
                        onFocus={() => setIsFocused(true)}
                        onChange={handleChange}
                        onBlur={handleBlur}
                        onKeyDown={handleKeyDown}
                        onClick={onClick}
                        placeholder={placeholder}
                        title={title || localValue}
                        className={`absolute inset-0 w-full h-full bg-transparent p-0 m-0 border-0 outline-none resize-none overflow-hidden ${className}`}
                    />
                    {isStock && isFocused && suggestCoords && stockSuggestions.length > 0 && ReactDOM.createPortal(
                        <div
                            className="fixed bg-zinc-900/95 backdrop-blur-xl border border-indigo-500/35 rounded-xl shadow-[0_24px_80px_rgba(0,0,0,0.95)] z-[999998] overflow-hidden py-1"
                            style={{
                                left: `${suggestCoords.left}px`,
                                top: suggestCoords.direction === 'up' ? 'auto' : `${suggestCoords.top}px`,
                                bottom: suggestCoords.direction === 'up' ? `${suggestCoords.bottom}px` : 'auto',
                                width: `${suggestCoords.width}px`
                            }}
                        >
                            <div className="px-3 py-1 text-[9px] font-bold uppercase tracking-widest text-indigo-300/80 border-b border-white/5">
                                BIST Sembol Önerileri

                            {stockSuggestions.map((item) => (
                                <button
                                    key={item.sym}
                                    type="button"
                                    onMouseDown={(e) => {
                                        e.preventDefault();
                                        e.stopPropagation();
                                        commitImmediate(`${item.sym} ${item.name}`);
                                        setIsFocused(false);
                                    }}
                                    className="w-full px-3 py-2 text-left flex items-center justify-between gap-2 hover:bg-indigo-500/20 transition-colors"
                                >
                                    <span className="text-xs font-black text-indigo-300 font-numbers">{item.sym}</span>
                                    <span className="text-[11px] text-zinc-300 truncate">{item.name}</span>
                                </button>
                            ))}
                        </div>,
                        document.body
                    )}
                </div>
            );
        };

        // Smooth decimal rate editor (allows typing "44.05" without eating ".0" or snapping to "0")
        const RateInput = ({ value, onCommit, className = '' }) => {
            const [text, setText] = useState(String(value ?? ''));
            const isFocusedRef = useRef(false);
            const timerRef = useRef(null);
            const onCommitRef = useRef(onCommit);
            onCommitRef.current = onCommit;

            useEffect(() => {
                if (!isFocusedRef.current) {
                    setText(String(value ?? ''));
                }
            }, [value]);

            useEffect(() => () => { if (timerRef.current) clearTimeout(timerRef.current); }, []);

            const handleChange = (e) => {
                const raw = e.target.value;
                setText(raw);
                if (timerRef.current) clearTimeout(timerRef.current);
                timerRef.current = setTimeout(() => {
                    onCommitRef.current(safeParseNum(raw));
                }, 400);
            };

            const handleBlur = () => {
                isFocusedRef.current = false;
                if (timerRef.current) {
                    clearTimeout(timerRef.current);
                    timerRef.current = null;
                }
                const parsed = safeParseNum(text);
                setText(String(parsed));
                onCommitRef.current(parsed);
            };

            return (
                <input
                    type="number"
                    step="any"
                    inputMode="decimal"
                    value={text}
                    onFocus={() => { isFocusedRef.current = true; }}
                    onChange={handleChange}
                    onBlur={handleBlur}
                    className={className}
                />
            );
        };

        // =========================================================================
        // PORTFOLIO PERFORMANCE & ANALYTICS CHART CARD
        // =========================================================================
        const CHART_PALETTE = ['#10b981', '#38bdf8', '#f59e0b', '#818cf8', '#f43f5e', '#14b8a6', '#a855f7', '#fb923c'];

        const PerformanceChartCard = ({
            portfolio,
            rates,
            currencyLabels,
            liveHistory,
            calculateAssetValue,
            calculatePersonTotal,
            calculatePnL,
            privacyMode = false
        }) => {
            const fmt = (val) => formatMoney(val, privacyMode);
            const [isOpen, setIsOpen] = useState(true);
            const [selectedPersonId, setSelectedPersonId] = useState('all');
            const [chartTab, setChartTab] = useState('performance'); // 'performance' | 'allocation' | 'trend'
            const [perfMetric, setPerfMetric] = useState('pct'); // 'pct' | 'try'
            const [selectedBarKey, setSelectedBarKey] = useState(null);
            const [selectedSliceIdx, setSelectedSliceIdx] = useState(null);
            const [selectedPointIdx, setSelectedPointIdx] = useState(null);

            useEffect(() => {
                if (selectedPersonId !== 'all' && !portfolio.some((p) => p.id === selectedPersonId)) {
                    setSelectedPersonId('all');
                }
            }, [portfolio, selectedPersonId]);

            useEffect(() => {
                setSelectedBarKey(null);
                setSelectedSliceIdx(null);
                setSelectedPointIdx(null);
            }, [selectedPersonId, chartTab]);

            const analytics = useMemo(() => {
                const targetPersons = selectedPersonId === 'all'
                    ? portfolio.filter((p) => !p.isHidden)
                    : portfolio.filter((p) => p.id === selectedPersonId);

                let totalValue = 0;
                let trackedCost = 0;
                let trackedCurrent = 0;
                const flatItems = [];

                targetPersons.forEach((person) => {
                    const personLabel = (person.person || 'İsimsiz Portföy').trim();
                    (person.assets || []).filter((a) => !a.isHidden).forEach((asset) => {
                        const hasSubs = asset.subItems && asset.subItems.length > 0;
                        if (hasSubs) {
                            asset.subItems.forEach((sub) => {
                                const val = getItemValue(sub, rates);
                                totalValue += val;
                                const pnl = calculatePnL(sub.amount, rates[sub.type], sub.costPrice, sub.type, sub.currentPrice);
                                const qty = safeParseNum(sub.amount);
                                const costUnit = safeParseNum(sub.costPrice);
                                const currentUnit = getItemUnitRate(sub, rates);
                                if (pnl) {
                                    trackedCost += qty * costUnit;
                                    trackedCurrent += val;
                                }
                                flatItems.push({
                                    key: `${person.id}-${asset.id}-${sub.id}`,
                                    name: (sub.name || 'İsimsiz Kalem').trim(),
                                    subtitle: [asset.name?.trim(), selectedPersonId === 'all' && targetPersons.length > 1 ? personLabel : ''].filter(Boolean).join(' · '),
                                    type: sub.type,
                                    typeLabel: currencyLabels[sub.type] || sub.type,
                                    qty,
                                    costUnit,
                                    currentUnit,
                                    costTotal: qty * costUnit,
                                    currentTotal: val,
                                    pnl
                                });
                            });
                        } else {
                            const val = getItemValue(asset, rates);
                            totalValue += val;
                            const pnl = calculatePnL(asset.amount, rates[asset.type], asset.costPrice, asset.type, asset.currentPrice);
                            const qty = safeParseNum(asset.amount);
                            const costUnit = safeParseNum(asset.costPrice);
                            const currentUnit = getItemUnitRate(asset, rates);
                            if (pnl) {
                                trackedCost += qty * costUnit;
                                trackedCurrent += val;
                            }
                            flatItems.push({
                                key: `${person.id}-${asset.id}`,
                                name: (asset.name || 'İsimsiz Varlık').trim(),
                                subtitle: selectedPersonId === 'all' && targetPersons.length > 1 ? personLabel : '',
                                type: asset.type,
                                typeLabel: currencyLabels[asset.type] || asset.type,
                                qty,
                                costUnit,
                                currentUnit,
                                costTotal: qty * costUnit,
                                currentTotal: val,
                                pnl
                            });
                        }
                    });
                });

                const perfItems = flatItems
                    .filter((item) => item.pnl !== null)
                    .sort((a, b) =>
                        perfMetric === 'pct'
                            ? b.pnl.percentage - a.pnl.percentage
                            : b.pnl.profit - a.pnl.profit
                    );

                // Allocation slices: portfolio-by-portfolio when "all" & multiple persons, else asset-by-asset
                let allocationSlices = [];
                if (selectedPersonId === 'all' && targetPersons.length > 1) {
                    allocationSlices = targetPersons
                        .map((p) => {
                            const val = calculatePersonTotal(p.assets);
                            let pCost = 0;
                            let pCurr = 0;
                            (p.assets || []).filter((a) => !a.isHidden).forEach((a) => {
                                const list = a.subItems && a.subItems.length > 0 ? a.subItems : [a];
                                list.forEach((it) => {
                                    const pnl = calculatePnL(it.amount, rates[it.type], it.costPrice, it.type, it.currentPrice);
                                    if (pnl) {
                                        pCost += safeParseNum(it.amount) * safeParseNum(it.costPrice);
                                        pCurr += getItemValue(it, rates);
                                    }
                                });
                            });
                            return {
                                id: p.id,
                                label: (p.person || 'İsimsiz Portföy').trim(),
                                subLabel: `${(p.assets || []).filter((a) => !a.isHidden).length} Varlık`,
                                value: val,
                                pnlPct: pCost > 0 ? ((pCurr - pCost) / pCost) * 100 : null,
                                pnlVal: pCost > 0 ? (pCurr - pCost) : null
                            };
                        })
                        .filter((s) => s.value > 0)
                        .sort((a, b) => b.value - a.value);
                } else if (targetPersons.length > 0) {
                    const p = targetPersons[0];
                    allocationSlices = (p.assets || [])
                        .filter((a) => !a.isHidden)
                        .map((a) => {
                            const val = calculateAssetValue(a);
                            const list = a.subItems && a.subItems.length > 0 ? a.subItems : [a];
                            let aCost = 0;
                            let aCurr = 0;
                            list.forEach((it) => {
                                const pnl = calculatePnL(it.amount, rates[it.type], it.costPrice, it.type, it.currentPrice);
                                if (pnl) {
                                    aCost += safeParseNum(it.amount) * safeParseNum(it.costPrice);
                                    aCurr += getItemValue(it, rates);
                                }
                            });
                            return {
                                id: a.id,
                                label: (a.name || 'İsimsiz Varlık').trim(),
                                subLabel: a.subItems?.length > 0 ? `${a.subItems.length} Kalem` : (currencyLabels[a.type] || a.type),
                                value: val,
                                pnlPct: aCost > 0 ? ((aCurr - aCost) / aCost) * 100 : null,
                                pnlVal: aCost > 0 ? (aCurr - aCost) : null
                            };
                        })
                        .filter((s) => s.value > 0)
                        .sort((a, b) => b.value - a.value);
                }

                const sliceSum = allocationSlices.reduce((acc, s) => acc + s.value, 0);
                allocationSlices = allocationSlices.map((s, idx) => ({
                    ...s,
                    color: CHART_PALETTE[idx % CHART_PALETTE.length],
                    pct: sliceSum > 0 ? (s.value / sliceSum) * 100 : 0
                }));

                const netProfit = trackedCurrent - trackedCost;
                const netPct = trackedCost > 0 ? (netProfit / trackedCost) * 100 : null;

                return {
                    totalValue,
                    trackedCost,
                    trackedCurrent,
                    netProfit,
                    netPct,
                    trackedCount: perfItems.length,
                    perfItems,
                    allocationSlices
                };
            }, [portfolio, selectedPersonId, rates, currencyLabels, perfMetric, calculateAssetValue, calculatePersonTotal, calculatePnL]);

            const trendSeries = useMemo(() => {
                const raw = (liveHistory || []).map((pt) => ({
                    date: pt.date,
                    value: selectedPersonId === 'all'
                        ? safeParseNum(pt.total)
                        : safeParseNum(pt.byPerson?.[selectedPersonId])
                }));
                return raw.filter((pt, idx) => pt.value > 0 || idx === raw.length - 1);
            }, [liveHistory, selectedPersonId]);

            if (!portfolio || portfolio.length === 0) return null;

            const maxAbsMetric = analytics.perfItems.reduce((max, item) => {
                const v = Math.abs(perfMetric === 'pct' ? item.pnl.percentage : item.pnl.profit);
                return v > max ? v : max;
            }, 0) || 1;
            const hasMixedSigns =
                analytics.perfItems.some((i) => i.pnl.profit > 0) &&
                analytics.perfItems.some((i) => i.pnl.profit < 0);

            const activeSlice = selectedSliceIdx !== null ? analytics.allocationSlices[selectedSliceIdx] : null;
            const activeTrendPoint = selectedPointIdx !== null
                ? trendSeries[selectedPointIdx]
                : (trendSeries.length > 0 ? trendSeries[trendSeries.length - 1] : null);
            const trendFirst = trendSeries.length > 1 ? trendSeries[0] : null;
            const trendDelta = (trendFirst && activeTrendPoint && trendFirst.value > 0)
                ? {
                    diff: activeTrendPoint.value - trendFirst.value,
                    pct: ((activeTrendPoint.value - trendFirst.value) / trendFirst.value) * 100
                }
                : null;

            return (
                <div className="mb-8 sm:mb-10 glass-card rounded-[2rem] max-w-4xl mx-auto border border-white/10 shadow-2xl overflow-hidden">
                    {/* Card Header */}

                        onClick={() => setIsOpen((v) => !v)}

                    >
                        <div className="flex items-center gap-3 min-w-0">
                            <div className="w-9 h-9 rounded-xl bg-indigo-500/15 border border-indigo-500/30 flex items-center justify-center shrink-0">
                                <i className="fa-solid fa-chart-column text-indigo-400 text-sm"></i>
                            </div>
                            <div className="min-w-0">
                                <h3 className="text-xs sm:text-sm font-black text-white uppercase tracking-widest truncate">
                                    Portföy Performans Grafiği
                                </h3>
                                <p className="text-[10px] text-zinc-400 font-medium truncate">
                                    Portföy bazlı kâr/zarar, dağılım ve değer trendi
                                </p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2 shrink-0">
                            {analytics.netPct !== null && (
                                <span className={`hidden sm:inline-flex items-center px-2.5 py-1 rounded-lg text-[11px] font-bold font-numbers ${
                                    analytics.netProfit >= 0
                                        ? 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/25'
                                        : 'bg-red-500/15 text-red-400 border border-red-500/25'
                                }`}>
                                    {analytics.netProfit >= 0 ? '+' : ''}{analytics.netPct.toFixed(1)}%
                                </span>
                            )}
                            <div className={`w-8 h-8 rounded-full flex items-center justify-center transition-transform duration-300 ${isOpen ? 'bg-white/15 text-white rotate-180' : 'bg-white/5 text-zinc-400'}`}>
                                <i className="fa-solid fa-chevron-down text-xs"></i>
                            </div>
                        </div>
                    </div>

                    {isOpen && (
                        <div className="px-4 sm:px-6 pb-6 pt-1 border-t border-white/5 flex flex-col gap-5">
                            {/* Portfolio Selector Pills */}
                            <div className="flex items-center gap-2 overflow-x-auto hide-scrollbar pt-3 pb-1">
                                <button
                                    type="button"
                                    onClick={() => setSelectedPersonId('all')}
                                    className={`px-3.5 py-1.5 rounded-xl text-[11px] font-bold tracking-wide whitespace-nowrap transition-all border shrink-0 ${
                                        selectedPersonId === 'all'
                                            ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40 shadow-sm'
                                            : 'bg-white/5 text-zinc-400 border-white/5 hover:bg-white/10 hover:text-white'
                                    }`}
                                >
                                    Tüm Portföyler
                                </button>
                                {portfolio.map((p) => (
                                    <button
                                        key={p.id}
                                        type="button"
                                        onClick={() => setSelectedPersonId(p.id)}
                                        className={`px-3.5 py-1.5 rounded-xl text-[11px] font-bold tracking-wide whitespace-nowrap transition-all border shrink-0 flex items-center gap-1.5 ${
                                            selectedPersonId === p.id
                                                ? 'bg-indigo-500/25 text-indigo-200 border-indigo-400/45 shadow-sm'
                                                : 'bg-white/5 text-zinc-400 border-white/5 hover:bg-white/10 hover:text-white'
                                        }`}
                                    >
                                        <span>{(p.person || 'İsimsiz Portföy').trim()}</span>
                                        {p.isHidden && <i className="fa-solid fa-eye-slash text-[9px] text-red-400/80"></i>}
                                    </button>
                                ))}
                            </div>

                            {/* KPI Summary Strip */}
                            <div className="grid grid-cols-3 gap-2.5 sm:gap-3">
                                <div className="bg-black/30 border border-white/5 rounded-2xl p-3 sm:p-3.5 flex flex-col">
                                    <span className="text-[9px] sm:text-[10px] font-bold uppercase tracking-widest text-zinc-500">Güncel Değer</span>
                                    <span className="text-xs sm:text-base font-black text-white font-numbers mt-1 break-words">
                                        {fmt(analytics.totalValue)}
                                    </span>
                                </div>
                                <div className="bg-black/30 border border-white/5 rounded-2xl p-3 sm:p-3.5 flex flex-col">
                                    <span className="text-[9px] sm:text-[10px] font-bold uppercase tracking-widest text-zinc-500">Maliyet Bazı</span>
                                    <span className="text-xs sm:text-base font-black text-zinc-200 font-numbers mt-1 break-words">
                                        {analytics.trackedCost > 0 ? fmt(analytics.trackedCost) : '—'}
                                    </span>
                                    {analytics.trackedCount > 0 && (
                                        <span className="text-[9px] text-zinc-500 mt-0.5">{analytics.trackedCount} kalem takipli</span>
                                    )}
                                </div>
                                <div className="bg-black/30 border border-white/5 rounded-2xl p-3 sm:p-3.5 flex flex-col">
                                    <span className="text-[9px] sm:text-[10px] font-bold uppercase tracking-widest text-zinc-500">Net Kâr / Zarar</span>
                                    {analytics.netPct !== null ? (
                                        <>
                                            <span className={`text-xs sm:text-base font-black font-numbers mt-1 break-words ${analytics.netProfit >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                                                {analytics.netProfit >= 0 ? '+' : ''}{fmt(analytics.netProfit)}
                                            </span>
                                            <span className={`text-[10px] font-bold font-numbers mt-0.5 ${analytics.netProfit >= 0 ? 'text-emerald-400/80' : 'text-red-400/80'}`}>
                                                {analytics.netProfit >= 0 ? '+' : ''}%{analytics.netPct.toFixed(1)}
                                            </span>
                                        </>
                                    ) : (
                                        <span className="text-xs sm:text-sm font-bold text-zinc-500 mt-1">Maliyet yok</span>
                                    )}
                                </div>
                            </div>

                            {/* Chart Mode Switcher */}
                            <div className="flex flex-wrap items-center justify-between gap-2">
                                <div className="inline-flex bg-black/35 p-1 rounded-xl border border-white/10">
                                    {[
                                        { id: 'performance', label: 'Performans', icon: 'fa-arrow-trend-up' },
                                        { id: 'allocation', label: 'Dağılım', icon: 'fa-chart-pie' },
                                        { id: 'trend', label: 'Trend', icon: 'fa-wave-square' }
                                    ].map((tab) => (
                                        <button
                                            key={tab.id}
                                            type="button"
                                            onClick={() => setChartTab(tab.id)}
                                            className={`px-3 py-1.5 rounded-lg text-[10px] sm:text-[11px] font-bold uppercase tracking-wider flex items-center gap-1.5 transition-all ${
                                                chartTab === tab.id
                                                    ? 'bg-white/15 text-white shadow-sm'
                                                    : 'text-zinc-400 hover:text-zinc-200'
                                            }`}
                                        >
                                            <i className={`fa-solid ${tab.icon} text-[10px]`}></i>
                                            <span>{tab.label}</span>
                                        </button>
                                    ))}
                                </div>

                                {chartTab === 'performance' && analytics.perfItems.length > 0 && (
                                    <div className="inline-flex bg-black/35 p-1 rounded-xl border border-white/10">
                                        <button
                                            type="button"
                                            onClick={() => setPerfMetric('pct')}
                                            className={`px-2.5 py-1 rounded-lg text-[10px] font-bold transition-all ${perfMetric === 'pct' ? 'bg-emerald-500/25 text-emerald-300' : 'text-zinc-400 hover:text-white'}`}
                                        >
                                            % Getiri
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => setPerfMetric('try')}
                                            className={`px-2.5 py-1 rounded-lg text-[10px] font-bold transition-all ${perfMetric === 'try' ? 'bg-emerald-500/25 text-emerald-300' : 'text-zinc-400 hover:text-white'}`}
                                        >
                                            ₺ Tutar
                                        </button>
                                    </div>
                                )}
                            </div>

                            {/* TAB 1: ASSET P&L PERFORMANCE BAR CHART */}
                            {chartTab === 'performance' && (
                                analytics.perfItems.length > 0 ? (
                                    <div className="flex flex-col gap-2.5">
                                        {analytics.perfItems.map((item) => {
                                            const rawVal = perfMetric === 'pct' ? item.pnl.percentage : item.pnl.profit;
                                            const ratio = Math.min(100, Math.max(4, (Math.abs(rawVal) / maxAbsMetric) * 100));
                                            const isPos = item.pnl.profit >= 0;
                                            const isSelected = selectedBarKey === item.key;

                                            return (
                                                <div
                                                    key={item.key}
                                                    onClick={() => setSelectedBarKey(isSelected ? null : item.key)}
                                                    className={`p-3 rounded-2xl border transition-all cursor-pointer ${
                                                        isSelected
                                                            ? 'bg-white/[0.06] border-white/20'
                                                            : 'bg-black/25 border-white/5 hover:border-white/15'
                                                    }`}
                                                >
                                                    <div className="flex items-start justify-between gap-2 mb-2">
                                                        <div className="min-w-0 flex-1">
                                                            <div className="flex items-center gap-1.5 flex-wrap">
                                                                <span className="text-xs sm:text-sm font-bold text-white break-words">{item.name}</span>
                                                                <span className="text-[9px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded bg-white/10 text-zinc-300">
                                                                    {formatTitleCase(item.typeLabel)}
                                                                </span>
                                                            </div>
                                                            {item.subtitle && (
                                                                <p className="text-[10px] text-zinc-500 mt-0.5 truncate">{item.subtitle}</p>
                                                            )}
                                                        </div>
                                                        <div className="text-right shrink-0 font-numbers">
                                                            <div className={`text-xs sm:text-sm font-black ${isPos ? 'text-emerald-400' : 'text-red-400'}`}>
                                                                {isPos ? '+' : ''}{item.pnl.percentage.toFixed(1)}%
                                                            </div>
                                                            <div className={`text-[10px] font-semibold ${isPos ? 'text-emerald-400/80' : 'text-red-400/80'}`}>
                                                                {isPos ? '+' : ''}{fmt(item.pnl.profit)}
                                                            </div>
                                                        </div>
                                                    </div>

                                                    {/* Bar track */}
                                                    {hasMixedSigns ? (
                                                        <div className="relative h-2.5 w-full bg-white/5 rounded-full overflow-hidden flex items-center">
                                                            <div className="w-1/2 h-full flex justify-end pr-[1px]">
                                                                {!isPos && (
                                                                    <div
                                                                        className="h-full rounded-l-full bg-gradient-to-l from-red-500 to-rose-400 transition-all duration-500"
                                                                        style={{ width: `${ratio}%` }}
                                                                    ></div>
                                                                )}
                                                            </div>
                                                            <div className="w-[2px] h-full bg-white/25 shrink-0"></div>
                                                            <div className="w-1/2 h-full flex justify-start pl-[1px]">
                                                                {isPos && (
                                                                    <div
                                                                        className="h-full rounded-r-full bg-gradient-to-r from-emerald-500 to-teal-300 transition-all duration-500"
                                                                        style={{ width: `${ratio}%` }}
                                                                    ></div>
                                                                )}
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <div className="relative h-2.5 w-full bg-white/5 rounded-full overflow-hidden">
                                                            <div
                                                                className={`h-full rounded-full transition-all duration-500 ${
                                                                    isPos
                                                                        ? 'bg-gradient-to-r from-emerald-600 via-emerald-400 to-teal-300'
                                                                        : 'bg-gradient-to-r from-rose-600 to-red-400'
                                                                }`}
                                                                style={{ width: `${ratio}%` }}
                                                            ></div>
                                                        </div>
                                                    )}

                                                    {isSelected && (
                                                        <div className="mt-2.5 pt-2.5 border-t border-white/10 grid grid-cols-2 sm:grid-cols-4 gap-2 text-[10px] font-numbers">
                                                            <div>
                                                                <span className="text-zinc-500 block font-sans">Miktar / Adet</span>
                                                                <span className="text-white font-bold">{item.qty}</span>
                                                            </div>
                                                            <div>
                                                                <span className="text-zinc-500 block font-sans">Birim Maliyet → Güncel</span>
                                                                <span className="text-zinc-200 font-bold">{item.costUnit} → {item.currentUnit} ₺</span>
                                                            </div>
                                                            <div>
                                                                <span className="text-zinc-500 block font-sans">Toplam Maliyet</span>
                                                                <span className="text-zinc-200 font-bold">{fmt(item.costTotal)}</span>
                                                            </div>
                                                            <div>
                                                                <span className="text-zinc-500 block font-sans">Güncel Değer</span>
                                                                <span className="text-emerald-300 font-bold">{fmt(item.currentTotal)}</span>
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                ) : (
                                    <div className="bg-black/25 border border-white/5 rounded-2xl p-6 text-center flex flex-col items-center gap-3">
                                        <i className="fa-solid fa-sliders text-2xl text-zinc-500"></i>
                                        <p className="text-xs text-zinc-400 max-w-xs leading-relaxed">
                                            Bu portföyde kâr/zarar hesaplanacak maliyet girişi bulunmuyor. Döviz, altın veya hisse varlıklarına <strong>Maliyet</strong> girdiğinizde performans grafiği otomatik oluşur.
                                        </p>
                                        <button
                                            type="button"
                                            onClick={() => setChartTab('allocation')}
                                            className="px-4 py-2 rounded-xl text-[11px] font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 hover:bg-indigo-500 hover:text-white transition-all"
                                        >
                                            Dağılım Grafiğine Geç
                                        </button>
                                    </div>
                                )
                            )}

                            {/* TAB 2: SVG DONUT + RANKED ALLOCATION */}
                            {chartTab === 'allocation' && (
                                analytics.allocationSlices.length > 0 ? (
                                    <div className="grid grid-cols-1 md:grid-cols-[200px_1fr] gap-5 items-center">
                                        <div className="relative w-44 h-44 mx-auto shrink-0">
                                            <svg viewBox="0 0 120 120" className="w-full h-full -rotate-90">
                                                <circle cx="60" cy="60" r="46" fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth="14" />
                                                {(() => {
                                                    const circumference = 2 * Math.PI * 46;
                                                    let offset = 0;
                                                    return analytics.allocationSlices.map((slice, idx) => {
                                                        const dash = (slice.pct / 100) * circumference;
                                                        const segOffset = offset;
                                                        offset += dash;
                                                        const isHighlighted = selectedSliceIdx === idx;
                                                        return (
                                                            <circle
                                                                key={slice.id}
                                                                cx="60"
                                                                cy="60"
                                                                r="46"
                                                                fill="none"
                                                                stroke={slice.color}
                                                                strokeWidth={isHighlighted ? '17' : '14'}
                                                                strokeDasharray={`${Math.max(0, dash - 1.2)} ${circumference}`}
                                                                strokeDashoffset={-segOffset}
                                                                strokeLinecap="butt"
                                                                className="transition-all duration-300 cursor-pointer"
                                                                opacity={selectedSliceIdx === null || isHighlighted ? 1 : 0.35}
                                                                onClick={() => setSelectedSliceIdx(isHighlighted ? null : idx)}
                                                            />
                                                        );
                                                    });
                                                })()}
                                            </svg>
                                            <div className="absolute inset-0 flex flex-col items-center justify-center text-center px-4 pointer-events-none">
                                                <span className="text-[9px] uppercase tracking-widest text-zinc-400 font-bold truncate max-w-full">
                                                    {activeSlice ? activeSlice.label : 'Toplam'}
                                                </span>
                                                <span className="text-xs font-black text-white font-numbers mt-0.5">
                                                    {fmt(activeSlice ? activeSlice.value : analytics.totalValue)}
                                                </span>
                                                {activeSlice && (
                                                    <span className="text-[10px] font-bold font-numbers mt-0.5" style={{ color: activeSlice.color }}>
                                                        %{activeSlice.pct.toFixed(1)}
                                                    </span>
                                                )}
                                            </div>
                                        </div>

                                        <div className="flex flex-col gap-2">
                                            {analytics.allocationSlices.map((slice, idx) => {
                                                const isHighlighted = selectedSliceIdx === idx;
                                                return (
                                                    <div
                                                        key={slice.id}
                                                        onClick={() => setSelectedSliceIdx(isHighlighted ? null : idx)}
                                                        className={`p-2.5 rounded-xl border transition-all cursor-pointer ${
                                                            isHighlighted
                                                                ? 'bg-white/10 border-white/25'
                                                                : 'bg-black/25 border-white/5 hover:border-white/15'
                                                        }`}
                                                    >
                                                        <div className="flex items-center justify-between gap-2 mb-1.5">
                                                            <div className="flex items-center gap-2 min-w-0">
                                                                <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ backgroundColor: slice.color }}></span>
                                                                <span className="text-xs font-bold text-white truncate">{slice.label}</span>

                                                            </div>
                                                            <div className="flex items-center gap-2 shrink-0 font-numbers">
